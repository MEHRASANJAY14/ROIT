<!DOCTYPE html>
<html>
<head>

<!-- 🔐 LOGIN CHECK -->
<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");

  let now = new Date().getTime();

  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }

})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RO Jabalpur Business Dashboard</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI, Arial;background:#f4f6f8;}
.orange{color:#ff9800;font-weight:bold}

.topbar{
  background:#006400;
  color:white;
  text-align:center;
  padding:10px;
  font-size:15px;
  font-weight:bold;
}

.container{padding:8px;}

select{
  width:100%;
  padding:6px;
  margin-bottom:10px;
  border-radius:5px;
  border:1px solid #ccc;
  font-size:12px;
}

.branch-card{
  background:white;
  padding:6px;
  margin-bottom:10px;
  border-radius:6px;
  box-shadow:0 1px 6px rgba(0,0,0,0.1);
  text-align:center;
  font-weight:bold;
  color:#006400;
  font-size:12px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:6px;
  margin-bottom:10px;
}

.summary-card{
  background:white;
  padding:6px;
  border-radius:6px;
  box-shadow:0 1px 6px rgba(0,0,0,0.1);
  text-align:center;
}

.summary-card h4{margin:0;font-size:11px;color:#555;}
.summary-card h2{margin:3px 0 0 0;color:#006400;font-size:14px;}

.section{
  background:white;
  padding:6px;
  margin-bottom:10px;
  border-radius:6px;
  box-shadow:0 1px 6px rgba(0,0,0,0.1);
}

.section-title{
  background:#006400;
  color:white;
  padding:4px;
  text-align:center;
  font-weight:bold;
  border-radius:4px;
  margin-bottom:6px;
  font-size:12px;
}

.table-wrapper{width:100%;overflow-x:auto;}

table{
  width:100%;
  border-collapse:collapse;
  min-width:480px;
  table-layout:fixed;
}

th{
  border:1px solid #ddd;
  background:#2e7d32;
  color:white;
  font-size:11px;
  padding:5px 2px;
  text-align:center;
}

td{
  border:1px solid #ddd;
  padding:10px 3px;
  font-size:12px;
  text-align:center;
}

.header-date{
  font-weight:bold;
  font-size:10px;
}

.positive{color:green;font-weight:bold}
.negative{color:red;font-weight:bold}

.footer{
  text-align:center;
  padding:6px;
  font-size:11px;
  color:#555;
}

.back-btn{
  display:block;
  margin:20px auto;
  width:160px;
  text-align:center;
  padding:10px;
  background:linear-gradient(135deg,#006400,#00a86b);
  color:white;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="topbar">
MADHYA PRADESH GRAMIN BANK  
RO JABALPUR BUSINESS DASHBOARD (₹ Crore)
</div>

<div class="container">

<div id="overallSummary"></div>

<select id="branch">
<option value="">Select Branch</option>
</select>

<div id="branchInfo"></div>
<div id="summary"></div>
<div id="dashboard"></div>

</div>

<div class="footer">Powered by RO Jabalpur IT Cell</div>

<a href="dashboard.html" class="back-btn">⬅ Back</a>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzTaMnM5Me3GitJAa3ztT8wSne5dcr__uegB-6qgwnTQRgi6hsUc_iI1i9ri6pYfrHfOw/exec";

/* Number Fix */
function toNumber(val){
  if(!val) return 0;
  return parseFloat(val.toString().replace(/₹/g,"").replace(/,/g,"")) || 0;
}

/* Overall */
function loadOverallData(){
fetch(API_URL+"?type=overallData")
.then(res=>res.json())
.then(data=>{

let advance = toNumber(data.advance ?? data[0]);
let deposit = toNumber(data.deposit ?? data[1]);
let npa = toNumber(data.npa ?? data[2]);
let casa = toNumber(data.casa ?? data[3]);

let total = advance + deposit;
let cd = deposit ? ((advance/deposit)*100).toFixed(2) : "0.00";

document.getElementById("overallSummary").innerHTML=`
<div class="section">
<div class="section-title">RO TOTAL BUSINESS</div>
<div class="summary">

<div class="summary-card"><h4>Advance</h4><h2>${advance.toFixed(2)}</h2></div>
<div class="summary-card"><h4>Deposit</h4><h2>${deposit.toFixed(2)}</h2></div>
<div class="summary-card"><h4>Total</h4><h2>${total.toFixed(2)}</h2></div>
<div class="summary-card"><h4>CD Ratio</h4><h2>${cd}%</h2></div>

</div>
</div>`;
});
}

/* Branch List */
function loadBranches(){
fetch(API_URL+"?type=branches")
.then(res=>res.json())
.then(data=>{
let select=document.getElementById("branch");
data.forEach(r=>{
let o=document.createElement("option");
o.value=r[0];
o.text=r[0]+" - "+r[1];
select.appendChild(o);
});
});
}

/* Color */
function growthClass(v,isNPA){
let val=parseFloat(v);
if(isNaN(val)) return "";
return isNPA ? (val<0?"positive":"negative") : (val>0?"positive":"negative");
}

/* Section */
function renderSection(title,start,row,headers,isNPA){

const h=headers.slice(start,start+4);
const d=row.slice(start,start+7);

return `
<div class="section">
<div class="section-title">${title}</div>

<div class="table-wrapper">
<table>

<tr>
<th>${h[0]||""}</th>
<th>${h[1]||""}</th>
<th>${h[2]||""}</th>
<th>${h[3]||""}</th>
<th>FTD</th>
<th>MTD</th>
<th>YTD</th>
</tr>

<tr>
${d.map((v,i)=>`<td class="${i>=4?growthClass(v,isNPA):""}">${v||0}</td>`).join("")}
</tr>

</table>
</div>
</div>`;
}

/* Branch Change */
document.getElementById("branch").addEventListener("change",function(){

if(!this.value) return;

fetch(API_URL+"?type=branchData&solid="+this.value)
.then(res=>res.json())
.then(result=>{

let row=result.row;
let headers=result.headers;

document.getElementById("branchInfo").innerHTML=
`<div class="branch-card">${row[0]} - ${row[1]}</div>`;

let advance=toNumber(row[5]);
let deposit=toNumber(row[19]);

let total=advance+deposit;
let cd=(advance/deposit*100).toFixed(2);

document.getElementById("summary").innerHTML=`
<div class="summary">

<div class="summary-card"><h4>Advance</h4><h2>${row[5]}</h2></div>
<div class="summary-card"><h4>Deposit</h4><h2>${row[19]}</h2></div>
<div class="summary-card"><h4>Total</h4><h2>${total.toFixed(2)}</h2></div>
<div class="summary-card"><h4>CD</h4><h2>${cd}%</h2></div>

</div>`;

let html="";
html+=renderSection("ADVANCE",2,row,headers,false);
html+=renderSection("NPA",9,row,headers,true);
html+=renderSection("DEPOSIT",16,row,headers,false);
html+=renderSection("CASA",23,row,headers,false);

document.getElementById("dashboard").innerHTML=html;

});

});

/* INIT */
loadOverallData();
loadBranches();

</script>

</body>
</html>
