<!DOCTYPE html>
<html>
<head>
  <title>NPA Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: Arial; background:#f5f7fb; padding:20px; }
    h2 { text-align:center; }
    #reportDate { text-align:center; color:#666; }

    .top-bar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

    select, button { padding:8px; border-radius:5px; border:none; }

    .btn-blue { background:#1976d2; color:white; }
    .btn-red { background:red; color:white; }
    .btn-grey { background:#555; color:white; }

    table { width:100%; border-collapse:collapse; background:white; margin-top:10px; }
    th, td { border:1px solid #ddd; padding:8px; text-align:center; }
    th { background:#d32f2f; color:white; }

    .green { color:green; font-weight:bold; }
    .red { color:red; font-weight:bold; }

    #loader { text-align:center; display:none; }
    #pageInfo { text-align:center; margin-top:10px; }
  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }
})();
</script>

<h2>🏦 SOL Wise NPA Dashboard</h2>
<h3 id="reportDate"></h3>

<div class="top-bar">
  <button class="btn-grey" onclick="goBack()">⬅ Back</button>
  <select id="solSelect"></select>

  <div>
    <button class="btn-blue" onclick="prevPage()">⬅ Prev</button>
    <button class="btn-blue" onclick="nextPage()">Next ➡</button>
  </div>

  <button class="btn-red" onclick="logout()">Logout</button>
</div>

<div>Total Records: <b id="totalCount">0</b></div>

<div id="loader">Loading...</div>

<table id="dataTable">
  <thead></thead>
  <tbody></tbody>
</table>

<div id="pageInfo"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz3v4s6qtAIRkbLYaq4V-yrveix3-glPv8YjWrTSav4fzbvfvfxiOhzyQ2CLcJQMe3FFw/exec";

let currentPage = 1;
let currentSol = "";

// Dropdown
function loadDropdown() {
  fetch(API_URL + "?type=dropdown")
    .then(res => res.json())
    .then(data => {
      let d = document.getElementById("solSelect");
      d.innerHTML = '<option value="">All Branch</option>';

      data.forEach(i => {
        let opt = document.createElement("option");
        opt.value = i.display;
        opt.text = i.display;
        d.appendChild(opt);
      });
    });
}

// Load Data
function loadData() {
  document.getElementById("loader").style.display = "block";

  fetch(API_URL + "?sol=" + encodeURIComponent(currentSol) + "&page=" + currentPage)
    .then(res => res.json())
    .then(res => {

      document.getElementById("loader").style.display = "none";

      let data = res.data;
      let total = res.total;
      let reportDate = res.date;

      // 📅 FIXED DATE (IST + FORMAT)
      if (reportDate) {
        let d = new Date(reportDate);
        let ist = new Date(d.getTime() + (5.5 * 60 * 60 * 1000));

        let formatted = ist.getDate() + "-" +
          ist.toLocaleString('en-US', { month: 'short' }) +
          "-" + ist.getFullYear();

        document.getElementById("reportDate").innerText =
          "Data as on: " + formatted;
      }

      document.getElementById("totalCount").innerText = total;

      let totalPages = Math.ceil(total / 20);
      document.getElementById("pageInfo").innerText =
        "Page " + currentPage + " of " + totalPages;

      let head = document.querySelector("#dataTable thead");
      let body = document.querySelector("#dataTable tbody");

      head.innerHTML = "";
      body.innerHTML = "";

      if (!data || data.length === 0) return;

      let headers = Object.keys(data[0]);

      let hrow = "<tr>";
      headers.forEach(h => hrow += `<th>${h}</th>`);
      hrow += "</tr>";
      head.innerHTML = hrow;

      data.forEach(row => {
        let tr = "<tr>";

        headers.forEach(h => {
          let val = row[h];

          if (h.toLowerCase().includes("outstanding")) {
            tr += `<td class="green">${val}</td>`;
          } else if (h.toLowerCase().includes("overdue")) {
            tr += `<td class="red">${val}</td>`;
          } else {
            tr += `<td>${val}</td>`;
          }
        });

        tr += "</tr>";
        body.innerHTML += tr;
      });

    });
}

// Pagination
function nextPage(){ currentPage++; loadData(); }
function prevPage(){ if(currentPage>1){ currentPage--; loadData(); } }

// Change
document.getElementById("solSelect").addEventListener("change", function(){
  currentSol = this.value;
  currentPage = 1;
  loadData();
});

// Logout
function logout(){
  localStorage.clear();
  window.location.href="index.html";
}

// Back
function goBack(){
  window.location.href="dashboard.html";
}

// Session refresh
document.addEventListener("click", function(){
  localStorage.setItem("time", new Date().getTime());
});

// Init
loadDropdown();
loadData();
</script>

</body>
</html>
