<!DOCTYPE html>
<html>
<head>
  <title>NPA Premium Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family:'Segoe UI'; background:#f4f6fb; padding:15px; }
    h2 { text-align:center; }
    #reportDate { text-align:center; color:#666; }

    .top-bar { display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; }

    select,input { padding:8px; border-radius:5px; border:1px solid #ccc; }

    button { padding:8px 12px; border:none; border-radius:5px; color:white; cursor:pointer; }
    .btn-blue { background:#1976d2; }
    .btn-red { background:red; }
    .btn-grey { background:#555; }

    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:10px 0; }
    .card { background:white; padding:10px; border-radius:10px; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,0.1); }

    table { width:100%; border-collapse:collapse; background:white; }
    th,td { padding:8px; border-bottom:1px solid #eee; text-align:center; }
    th { background:#d32f2f; color:white; position:sticky; top:0; }

    tr:hover { background:#f1f1f1; }

    .green { color:green; font-weight:bold; }
    .red { color:red; font-weight:bold; }

    #loader { text-align:center; display:none; }
    #pageInfo { text-align:center; margin-top:10px; font-weight:bold; }
  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }
})();
</script>

<h2>🏦 NPA Premium Dashboard</h2>
<h3 id="reportDate"></h3>

<div class="top-bar">
  <button class="btn-grey" onclick="goBack()">⬅ Back</button>
  <select id="solSelect"></select>
  <input type="text" id="searchBox" placeholder="Search...">

  <div>
    <button class="btn-blue" onclick="prevPage()">⬅</button>
    <button class="btn-blue" onclick="nextPage()">➡</button>
  </div>

  <button class="btn-red" onclick="logout()">Logout</button>
</div>

<div class="cards">
  <div class="card">
    <h3>Total Records</h3>
    <p id="totalCount">0</p>
  </div>
</div>

<div id="loader">Loading...</div>

<table id="dataTable">
  <thead></thead>
  <tbody></tbody>
</table>

<div id="pageInfo"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz3v4s6qtAIRkbLYaq4V-yrveix3-glPv8YjWrTSav4fzbvfvfxiOhzyQ2CLcJQMe3FFw/exec";

let currentPage = 1;
let currentSol = "";
let fullData = [];

// Dropdown
function loadDropdown(){
  fetch(API_URL+"?type=dropdown")
  .then(res=>res.json())
  .then(data=>{
    let d=document.getElementById("solSelect");
    d.innerHTML='<option value="">All Branch</option>';

    data.forEach(i=>{
      let opt=document.createElement("option");
      opt.value=i.display;
      opt.text=i.display;
      d.appendChild(opt);
    });
  });
}

// 🔥 DATE FIX FUNCTION
function formatDate(reportDate){
  if(!reportDate) return "";

  let d;

  if(typeof reportDate === "string" && reportDate.includes("T")){
    d = new Date(reportDate); // ISO
  } else {
    let parts = reportDate.toString().split(/[\/\-]/);

    if(parts.length === 3){
      d = new Date(parts[2], parts[1]-1, parts[0]); // DD/MM/YYYY
    }
  }

  if(!d || isNaN(d)) return reportDate;

  let day = d.getDate();
  let month = d.toLocaleString('en-US',{month:'short'});
  let year = d.getFullYear();

  return day+"-"+month+"-"+year;
}

// Load Data
function loadData(){
  document.getElementById("loader").style.display="block";

  fetch(API_URL+"?sol="+encodeURIComponent(currentSol)+"&page="+currentPage)
  .then(res=>res.json())
  .then(res=>{

    document.getElementById("loader").style.display="none";

    let data=res.data;
    let total=res.total;
    let reportDate=res.date;

    fullData=data;

    // ✅ TOTAL FIX
    document.getElementById("totalCount").innerText=total;

    // ✅ DATE FIX
    document.getElementById("reportDate").innerText =
      "Data as on: " + formatDate(reportDate);

    renderTable(data);

    let totalPages=Math.ceil(total/20);
    document.getElementById("pageInfo").innerText =
      "Page "+currentPage+" of "+totalPages;

  });
}

// Render
function renderTable(data){
  let head=document.querySelector("#dataTable thead");
  let body=document.querySelector("#dataTable tbody");

  head.innerHTML="";
  body.innerHTML="";

  if(data.length===0) return;

  let headers=Object.keys(data[0]);

  let hrow="<tr>";
  headers.forEach(h=>hrow+=`<th>${h}</th>`);
  hrow+="</tr>";
  head.innerHTML=hrow;

  data.forEach(row=>{
    let tr="<tr>";
    headers.forEach(h=>{
      let val=row[h];

      if(h.toLowerCase().includes("outstanding"))
        tr+=`<td class="green">${val}</td>`;
      else if(h.toLowerCase().includes("overdue"))
        tr+=`<td class="red">${val}</td>`;
      else
        tr+=`<td>${val}</td>`;
    });
    tr+="</tr>";
    body.innerHTML+=tr;
  });
}

// Search
document.getElementById("searchBox").addEventListener("keyup",function(){
  let val=this.value.toLowerCase();
  let filtered=fullData.filter(r=>
    Object.values(r).join(" ").toLowerCase().includes(val)
  );
  renderTable(filtered);
});

// Pagination
function nextPage(){currentPage++;loadData();}
function prevPage(){if(currentPage>1){currentPage--;loadData();}}

// Change
document.getElementById("solSelect").addEventListener("change",function(){
  currentSol=this.value;
  currentPage=1;
  loadData();
});

// Logout
function logout(){
  localStorage.clear();
  location.href="index.html";
}

// Back
function goBack(){
  location.href="dashboard.html";
}

// Session refresh
document.addEventListener("click",()=>{
  localStorage.setItem("time", new Date().getTime());
});

// Init
loadDropdown();
loadData();
</script>

</body>
</html>
