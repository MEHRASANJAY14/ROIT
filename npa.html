<!DOCTYPE html>
<html>
<head>
  <title>NPA Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
    }

    h2 { text-align: center; color: #333; }

    #reportDate {
      text-align: center;
      color: #666;
      margin-bottom: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    select, button {
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    .btn-blue { background: #1976d2; color: white; }
    .btn-red { background: red; color: white; }
    .btn-grey { background: #555; color: white; }

    .card {
      background: white;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #d32f2f;
      color: white;
      position: sticky;
      top: 0;
    }

    .green { color: green; font-weight: bold; }
    .red { color: red; font-weight: bold; }

    #loader { text-align: center; display: none; }

    #pageInfo {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }
})();
</script>

<h2>🏦 SOL Wise NPA Dashboard</h2>
<h3 id="reportDate"></h3>

<div class="top-bar">

  <button class="btn-grey" onclick="goBack()">⬅ Back</button>

  <select id="solSelect"></select>

  <div>
    <button class="btn-blue" onclick="prevPage()">⬅ Prev</button>
    <button class="btn-blue" onclick="nextPage()">Next ➡</button>
  </div>

  <button class="btn-red" onclick="logout()">Logout</button>

</div>

<div class="card">
  Total Records: <span id="totalCount">0</span>
</div>

<div id="loader">⏳ Loading...</div>

<table id="dataTable">
  <thead></thead>
  <tbody></tbody>
</table>

<div id="pageInfo"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz3v4s6qtAIRkbLYaq4V-yrveix3-glPv8YjWrTSav4fzbvfvfxiOhzyQ2CLcJQMe3FFw/exec";

let currentPage = 1;
let currentSol = "";

// 🔽 Dropdown
function loadDropdown() {
  fetch(API_URL + "?type=dropdown")
    .then(res => res.json())
    .then(data => {
      let dropdown = document.getElementById("solSelect");
      dropdown.innerHTML = '<option value="">All Branch</option>';

      data.forEach(item => {
        let opt = document.createElement("option");
        opt.value = item.display;
        opt.text = item.display;
        dropdown.appendChild(opt);
      });
    });
}

// 📊 Load Data
function loadData() {
  document.getElementById("loader").style.display = "block";

  fetch(API_URL + "?sol=" + encodeURIComponent(currentSol) + "&page=" + currentPage)
    .then(res => res.json())
    .then(response => {

      document.getElementById("loader").style.display = "none";

      let data = response.data;
      let total = response.total;
      let reportDate = response.date;

      // 📅 Date format
      if (reportDate) {
        let d = new Date(reportDate);
        let formatted = d.getDate() + "-" +
          d.toLocaleString('en-US', { month: 'short' }) +
          "-" + d.getFullYear();

        document.getElementById("reportDate").innerText =
          "Data as on: " + formatted;
      }

      // Total
      document.getElementById("totalCount").innerText = total;

      // Page info
      let totalPages = Math.ceil(total / 20);
      document.getElementById("pageInfo").innerText =
        "Page " + currentPage + " of " + totalPages;

      let head = document.querySelector("#dataTable thead");
      let body = document.querySelector("#dataTable tbody");

      head.innerHTML = "";
      body.innerHTML = "";

      if (!data || data.length === 0) return;

      let headers = Object.keys(data[0]);

      let hrow = "<tr>";
      headers.forEach(h => hrow += `<th>${h}</th>`);
      hrow += "</tr>";
      head.innerHTML = hrow;

      data.forEach(row => {
        let tr = "<tr>";

        headers.forEach(h => {
          let val = row[h];

          if (h.toLowerCase().includes("outstanding")) {
            tr += `<td class="green">${val}</td>`;
          } else if (h.toLowerCase().includes("overdue")) {
            tr += `<td class="red">${val}</td>`;
          } else {
            tr += `<td>${val}</td>`;
          }
        });

        tr += "</tr>";
        body.innerHTML += tr;
      });

    });
}

// Pagination
function nextPage() {
  currentPage++;
  loadData();
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    loadData();
  }
}

// Change
document.getElementById("solSelect").addEventListener("change", function() {
  currentSol = this.value;
  currentPage = 1;
  loadData();
});

// Logout
function logout(){
  localStorage.clear();
  window.location.href = "index.html";
}

// Back
function goBack(){
  window.location.href = "dashboard.html";
}

// Session refresh
document.addEventListener("click", function(){
  localStorage.setItem("time", new Date().getTime());
});

// Init
loadDropdown();
loadData();

</script>

</body>
</html>
