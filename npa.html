<!DOCTYPE html>
<html>
<head>
  <title>NPA Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family:'Segoe UI'; background:#f4f6fb; padding:15px; }
    h2 { text-align:center; }
    #reportDate { text-align:center; color:#666; }

    .top-bar { display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; }

    select,input { padding:8px; border-radius:5px; border:1px solid #ccc; }

    button { padding:8px 12px; border:none; border-radius:5px; color:white; cursor:pointer; }
    .btn-blue { background:#1976d2; }
    .btn-red { background:red; }
    .btn-grey { background:#555; }

    table { width:100%; border-collapse:collapse; background:white; }
    th,td { padding:8px; border-bottom:1px solid #eee; text-align:center; }
    th { background:#d32f2f; color:white; }

    .green { color:green; font-weight:bold; }
    .red { color:red; font-weight:bold; }

    #loader { text-align:center; display:none; }
    #pageInfo { text-align:center; margin-top:10px; font-weight:bold; }
  </style>
</head>

<body>

<script>
(function(){
  let login = localStorage.getItem("login");
  if(login!=="true"){ window.location="index.html"; }
})();
</script>

<h2>🏦 NPA Dashboard</h2>
<h3 id="reportDate"></h3>

<div class="top-bar">
  <button class="btn-grey" onclick="goBack()">⬅ Back</button>

  <select id="solSelect">
    <option value="">Select Branch</option>
  </select>

  <input type="text" id="searchBox" placeholder="Search..." disabled>

  <div>
    <button class="btn-blue" onclick="prevPage()">⬅</button>
    <button class="btn-blue" onclick="nextPage()">➡</button>
  </div>

  <button class="btn-red" onclick="logout()">Logout</button>
</div>

<div>Total Records: <b id="totalCount">0</b></div>

<div id="loader">Select branch</div>

<table id="dataTable">
<thead></thead>
<tbody></tbody>
</table>

<div id="pageInfo"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbz3v4s6qtAIRkbLYaq4V-yrveix3-glPv8YjWrTSav4fzbvfvfxiOhzyQ2CLcJQMe3FFw/exec";

let currentPage=1;
let currentSol="";
let fullData=[];

function loadDropdown(){
 fetch(API_URL+"?type=dropdown")
 .then(r=>r.json())
 .then(d=>{
  let s=document.getElementById("solSelect");
  d.forEach(i=>{
    let o=document.createElement("option");
    o.value=i.display;
    o.text=i.display;
    s.appendChild(o);
  });
 });
}

function loadData(){
 if(!currentSol) return;

 document.getElementById("loader").style.display="block";

 fetch(API_URL+"?sol="+encodeURIComponent(currentSol)+"&page="+currentPage)
 .then(r=>r.json())
 .then(res=>{

  document.getElementById("loader").style.display="none";

  fullData=res.data;

  document.getElementById("totalCount").innerText=res.total;

  document.getElementById("reportDate").innerText=
    "Data as on: "+res.date;

  render(res.data);

  let pages=Math.ceil(res.total/20);
  document.getElementById("pageInfo").innerText="Page "+currentPage+" of "+pages;
 });
}

function render(data){
 let h=document.querySelector("#dataTable thead");
 let b=document.querySelector("#dataTable tbody");

 h.innerHTML=""; b.innerHTML="";

 if(!data.length) return;

 let keys=Object.keys(data[0]);

 h.innerHTML="<tr>"+keys.map(k=>"<th>"+k+"</th>").join("")+"</tr>";

 data.forEach(r=>{
  let tr="<tr>";
  keys.forEach(k=>{
   let v=r[k];
   if(k.toLowerCase().includes("outstanding")) tr+=`<td class="green">${v}</td>`;
   else if(k.toLowerCase().includes("overdue")) tr+=`<td class="red">${v}</td>`;
   else tr+=`<td>${v}</td>`;
  });
  tr+="</tr>";
  b.innerHTML+=tr;
 });
}

document.getElementById("solSelect").onchange=function(){
 currentSol=this.value;
 currentPage=1;
 document.getElementById("searchBox").disabled=false;
 loadData();
};

document.getElementById("searchBox").onkeyup=function(){
 let v=this.value.toLowerCase();
 render(fullData.filter(r=>JSON.stringify(r).toLowerCase().includes(v)));
};

function nextPage(){currentPage++;loadData();}
function prevPage(){if(currentPage>1){currentPage--;loadData();}}

function logout(){localStorage.clear();location="index.html";}
function goBack(){location="dashboard.html";}

loadDropdown();
</script>

</body>
</html>
