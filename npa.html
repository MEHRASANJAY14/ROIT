<!DOCTYPE html>
<html>
<head>
  <title>NPA Smart Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: 'Segoe UI';
      background: #eef2f7;
      margin: 0;
      padding: 15px;
    }

    h2 { text-align: center; margin: 5px; }
    #reportDate { text-align:center; color:#666; margin-bottom:10px; }

    .top-bar {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      margin-bottom:10px;
    }

    select, input {
      padding:8px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button {
      padding:8px 12px;
      border:none;
      border-radius:6px;
      color:white;
      cursor:pointer;
    }

    .btn-blue { background:#1976d2; }
    .btn-red { background:#e53935; }
    .btn-grey { background:#555; }

    .card {
      background:white;
      padding:10px;
      border-radius:8px;
      text-align:center;
      margin-bottom:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }

    table {
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:10px;
      overflow:hidden;
    }

    th, td {
      padding:8px;
      text-align:center;
      border-bottom:1px solid #eee;
    }

    th {
      background:#c62828;
      color:white;
      position:sticky;
      top:0;
    }

    tr:hover { background:#f5f5f5; }

    .green { color:green; font-weight:bold; }
    .red { color:red; font-weight:bold; }

    #loader { text-align:center; margin:10px; }
    #pageInfo { text-align:center; margin-top:10px; font-weight:bold; }
  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<script>
(function(){
  if(localStorage.getItem("login")!=="true"){
    window.location="index.html";
  }
})();
</script>

<h2>🏦 NPA Smart Dashboard</h2>
<h3 id="reportDate"></h3>

<div class="top-bar">
  <button class="btn-grey" onclick="goBack()">⬅ Back</button>

  <select id="solSelect">
    <option value="">Select Branch</option>
  </select>

  <input type="text" id="searchBox" placeholder="Search..." disabled>

  <div>
    <button class="btn-blue" onclick="prevPage()">⬅</button>
    <button class="btn-blue" onclick="nextPage()">➡</button>
  </div>

  <button class="btn-red" onclick="logout()">Logout</button>
</div>

<div class="card">
  Total Records: <b id="totalCount">0</b>
</div>

<div id="loader">Select a branch to load data</div>

<table id="dataTable">
  <thead></thead>
  <tbody></tbody>
</table>

<div id="pageInfo"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbz3v4s6qtAIRkbLYaq4V-yrveix3-glPv8YjWrTSav4fzbvfvfxiOhzyQ2CLcJQMe3FFw/exec";

let currentPage=1;
let currentSol="";
let fullData=[];

// Dropdown
function loadDropdown(){
 fetch(API_URL+"?type=dropdown")
 .then(r=>r.json())
 .then(d=>{
  let s=document.getElementById("solSelect");
  d.forEach(i=>{
    let o=document.createElement("option");
    o.value=i.display;
    o.text=i.display;
    s.appendChild(o);
  });
 });
}

// 🔥 FINAL DATE FIX (NO MORE APRIL→JUNE ISSUE)
function formatDate(val){
  if(!val) return "-";

  let d;

  // ISO format
  if(typeof val==="string" && val.includes("T")){
    d=new Date(val);
  } else {
    let parts=val.toString().split(/[\/\-]/);

    if(parts.length===3){
      let day=parseInt(parts[0]);
      let month=parseInt(parts[1])-1;
      let year=parseInt(parts[2]);

      d=new Date(year,month,day);
    }
  }

  if(!d || isNaN(d)) return val;

  return d.getDate()+"-"+d.toLocaleString('en-US',{month:'short'})+"-"+d.getFullYear();
}

// Load Data
function loadData(){
 if(!currentSol) return;

 document.getElementById("loader").innerText="Loading...";

 fetch(API_URL+"?sol="+encodeURIComponent(currentSol)+"&page="+currentPage)
 .then(r=>r.json())
 .then(res=>{

  fullData=res.data;

  document.getElementById("loader").innerText="";
  document.getElementById("totalCount").innerText=res.total;

  document.getElementById("reportDate").innerText =
    "Data as on: "+formatDate(res.date);

  render(res.data);

  let pages=Math.ceil(res.total/20);
  document.getElementById("pageInfo").innerText =
    "Page "+currentPage+" of "+pages;
 });
}

// Render Table
function render(data){
 let head=document.querySelector("#dataTable thead");
 let body=document.querySelector("#dataTable tbody");

 head.innerHTML="";
 body.innerHTML="";

 if(!data.length) return;

 let keys=Object.keys(data[0]);

 head.innerHTML="<tr>"+keys.map(k=>"<th>"+k+"</th>").join("")+"</tr>";

 data.forEach(r=>{
  let tr="<tr>";
  keys.forEach(k=>{
   let v=r[k];

   if(k.toLowerCase().includes("outstanding"))
     tr+=`<td class="green">${v}</td>`;
   else if(k.toLowerCase().includes("overdue"))
     tr+=`<td class="red">${v}</td>`;
   else
     tr+=`<td>${v}</td>`;
  });
  tr+="</tr>";
  body.innerHTML+=tr;
 });
}

// Search
document.getElementById("searchBox").onkeyup=function(){
 let v=this.value.toLowerCase();
 render(fullData.filter(r=>JSON.stringify(r).toLowerCase().includes(v)));
};

// Pagination
function nextPage(){currentPage++;loadData();}
function prevPage(){if(currentPage>1){currentPage--;loadData();}}

// Select branch
document.getElementById("solSelect").onchange=function(){
 currentSol=this.value;
 currentPage=1;
 document.getElementById("searchBox").disabled=false;
 loadData();
};

// Logout & back
function logout(){localStorage.clear();location="index.html";}
function goBack(){location="dashboard.html";}

// Init
loadDropdown();
</script>

</body>
</html>
