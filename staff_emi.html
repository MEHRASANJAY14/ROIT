<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPGB Staff Loan EMI</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;}
.header{background:#006400;color:white;text-align:center;padding:14px;font-size:16px;font-weight:bold;}
.container{width:100%;max-width:1400px;margin:10px auto;background:white;padding:18px;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,0.08);}

label{
  font-weight:bold;
  display:block;
  margin-top:8px;
  margin-bottom:4px;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:5px;
  font-size:14px;
}

button{
  background:#006400;
  color:white;
  border:none;
  padding:9px 16px;
  border-radius:5px;
  cursor:pointer;
  margin-right:6px;
}

.result{
  margin-top:15px;
  background:#eef9f1;
  padding:18px;
  border-radius:6px;
  line-height:1.8em;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
}

th{
  background:#006400;
  color:white;
}

@media print{
  .header,input,button,label{display:none;}
}
</style>
</head>

<body>

<div class="header">
MPGB RO Jabalpur - Staff Loan EMI (Tier Based 3:1 Model)
</div>

<div class="container">

<label>Loan Amount (₹)</label>
<input type="number" id="amount">

<label>Total Tenure (Months)</label>
<input type="number" id="tenure">

<label>Moratorium Period (Months)</label>
<input type="number" id="moratorium">

<label>Account Open Date (Optional)</label>
<input type="date" id="accdate">

<button onclick="calculateStaff()">Calculate</button>
<button onclick="window.print()">Print</button>

<div id="summary" class="result" style="display:none;"></div>

<table id="schedule"></table>

</div>

<script>

function format(n){ return Number(n).toFixed(2); }

function getLastDate(base,m){
 if(!base) return "";
 let d=new Date(base);
 d.setMonth(d.getMonth()+m+1);
 d.setDate(0);
 return d.getDate()+"-"+d.toLocaleString('en-US',{month:'short'})+"-"+d.getFullYear();
}

function calculateStaff(){

let P=parseFloat(document.getElementById("amount").value);
let totalMonths=parseInt(document.getElementById("tenure").value);
let moratorium=parseInt(document.getElementById("moratorium").value)||0;
let accDateInput=document.getElementById("accdate").value;
let accDate=accDateInput?new Date(accDateInput):null;

if(!P||!totalMonths){ alert("Fill all fields"); return;}
if(moratorium>=totalMonths){ alert("Invalid moratorium"); return;}

let effectiveMonths=totalMonths-moratorium;
let principalMonths=Math.round((3/4)*effectiveMonths);
let interestMonths=effectiveMonths-principalMonths;

let monthlyPrincipal=P/principalMonths;

let r1=5/12/100,r2=5.5/12/100,r3=6/12/100;

let balance=P,accInt=0;
let s1=0,s2=0,s3=0;

let table=document.getElementById("schedule");
table.innerHTML="";

table.innerHTML=
"<tr><th>Month</th><th>Principal EMI</th><th>Interest EMI</th><th>5%</th><th>5.5%</th><th>6%</th><th>Total Int</th><th>Principal Outstanding</th><th>Total Outstanding</th></tr>";

/* MORATORIUM */
for(let i=1;i<=moratorium;i++){

let date=getLastDate(accDate,i-1);
let label=accDate?i+" ("+date+")":i;

let a=Math.min(balance,110000);
let b=balance>110000?Math.min(balance-110000,4000000-110000):0;
let c=balance>4000000?balance-4000000:0;

let i1=a*r1,i2=b*r2,i3=c*r3,total=i1+i2+i3;

accInt+=total; s1+=i1; s2+=i2; s3+=i3;

table.innerHTML+=`<tr>
<td>${label}</td><td>Moratorium</td><td>0</td>
<td>${format(i1)}</td><td>${format(i2)}</td><td>${format(i3)}</td>
<td>${format(total)}</td><td>${format(balance)}</td>
<td>${format(balance+accInt)}</td></tr>`;
}

/* PRINCIPAL */
for(let i=1;i<=principalMonths;i++){

let date=getLastDate(accDate,moratorium+i-1);
let label=accDate?(moratorium+i)+" ("+date+")":(moratorium+i);

let a=Math.min(balance,110000);
let b=balance>110000?Math.min(balance-110000,4000000-110000):0;
let c=balance>4000000?balance-4000000:0;

let i1=a*r1,i2=b*r2,i3=c*r3,total=i1+i2+i3;

accInt+=total; s1+=i1; s2+=i2; s3+=i3;

let pay=(i===principalMonths)?balance:monthlyPrincipal;
balance-=pay;

table.innerHTML+=`<tr>
<td>${label}</td><td>${format(pay)}</td><td>0</td>
<td>${format(i1)}</td><td>${format(i2)}</td><td>${format(i3)}</td>
<td>${format(total)}</td><td>${format(balance)}</td>
<td>${format(balance+accInt)}</td></tr>`;
}

/* INTEREST */
let emi=accInt/interestMonths,remain=accInt;

for(let i=1;i<=interestMonths;i++){

let date=getLastDate(accDate,moratorium+principalMonths+i-1);
let label=accDate?(moratorium+principalMonths+i)+" ("+date+")":(moratorium+principalMonths+i);

remain-=emi;

table.innerHTML+=`<tr>
<td>${label}</td><td>0</td><td>${format(emi)}</td>
<td>0</td><td>0</td><td>0</td>
<td>0</td><td>0</td><td>${format(remain)}</td></tr>`;
}

/* SUMMARY SAME */
document.getElementById("summary").innerHTML=
"<b>Loan Amount:</b> "+format(P)+"<br>"+
"<b>Total Tenure:</b> "+totalMonths+" Months<br>"+
"<b>Moratorium:</b> "+moratorium+" Months<br>"+
"<b>Effective Tenure:</b> "+effectiveMonths+" Months<br><hr>"+

"<b>Principal Phase:</b> "+principalMonths+" Months<br>"+
"<b>Interest Phase:</b> "+interestMonths+" Months<br><hr>"+

"<b>Monthly Principal EMI:</b> "+format(monthlyPrincipal)+"<br>"+
"<b>Monthly Interest EMI:</b> "+format(emi)+"<br><hr>"+

"<b>5% (Upto ₹1,10,000):</b> "+format(s1)+"<br>"+
"<b>5.5% (Above ₹1,10,000 to ₹40,00,000):</b> "+format(s2)+"<br>"+
"<b>6% (Above ₹40,00,000):</b> "+format(s3)+"<br><hr>"+

"<b>Total Interest:</b> "+format(accInt)+"<br>"+
"<b>Total Payment:</b> "+format(P+accInt);

document.getElementById("summary").style.display="block";

}

</script>

</body>
</html>
