<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPGB Staff Loan EMI</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;}
.header{background:#006400;color:white;text-align:center;padding:14px;font-weight:bold;}
.container{max-width:1400px;margin:10px auto;background:white;padding:18px;border-radius:6px;}
input{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:5px;}
button{background:#006400;color:white;border:none;padding:10px;border-radius:5px;margin-right:5px;cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border:1px solid #ddd;padding:6px;text-align:center;}
th{background:#006400;color:white;}
.result{background:#eef9f1;padding:15px;margin-top:10px;border-radius:5px;}

@media print{
  .header,input,button{display:none;}
}
</style>
</head>

<body>

<div class="header">MPGB Staff Loan EMI</div>

<div class="container">

<input type="number" id="amount" placeholder="Loan Amount">
<input type="number" id="tenure" placeholder="Tenure (Months)">
<input type="number" id="moratorium" placeholder="Moratorium">
<input type="date" id="accdate">

<button onclick="calculateStaff()">Calculate</button>
<button onclick="window.print()">Print</button>

<div id="summary" class="result" style="display:none;"></div>

<table id="schedule"></table>

</div>

<script>

function format(n){ return Number(n).toFixed(2); }

function getLastDate(base,m){
 if(!base) return "";
 let d=new Date(base);
 d.setMonth(d.getMonth()+m+1);
 d.setDate(0);
 return d.getDate()+"-"+d.toLocaleString('en-US',{month:'short'})+"-"+d.getFullYear();
}

function calculateStaff(){

let P=parseFloat(document.getElementById("amount").value);
let totalMonths=parseInt(document.getElementById("tenure").value);
let moratorium=parseInt(document.getElementById("moratorium").value)||0;
let accDateInput=document.getElementById("accdate").value;
let accDate=accDateInput?new Date(accDateInput):null;

if(!P||!totalMonths){ alert("Fill all fields"); return; }
if(moratorium>=totalMonths){ alert("Invalid moratorium"); return; }

let effective=totalMonths-moratorium;
let principalMonths=Math.round((3/4)*effective);
let interestMonths=effective-principalMonths;

let monthlyPrincipal=P/principalMonths;

let r1=5/12/100,r2=5.5/12/100,r3=6/12/100;

let balance=P,accInt=0;
let s1=0,s2=0,s3=0;

let table=document.getElementById("schedule");
table.innerHTML="";

table.innerHTML="<tr><th>Month</th><th>Principal EMI</th><th>Interest EMI</th><th>5%</th><th>5.5%</th><th>6%</th><th>Total Int</th><th>Principal</th><th>Total</th></tr>";

/* MORATORIUM */
for(let i=1;i<=moratorium;i++){

let date=getLastDate(accDate,i-1);
let label=accDate?i+" ("+date+")":i;

let a=Math.min(balance,110000);
let b=balance>110000?Math.min(balance-110000,4000000-110000):0;
let c=balance>4000000?balance-4000000:0;

let i1=a*r1,i2=b*r2,i3=c*r3,total=i1+i2+i3;

accInt+=total; s1+=i1; s2+=i2; s3+=i3;

table.innerHTML+=`<tr>
<td>${label}</td><td>Moratorium</td><td>0</td>
<td>${format(i1)}</td><td>${format(i2)}</td><td>${format(i3)}</td>
<td>${format(total)}</td><td>${format(balance)}</td>
<td>${format(balance+accInt)}</td></tr>`;
}

/* PRINCIPAL */
for(let i=1;i<=principalMonths;i++){

let date=getLastDate(accDate,moratorium+i-1);
let label=accDate?(moratorium+i)+" ("+date+")":(moratorium+i);

let a=Math.min(balance,110000);
let b=balance>110000?Math.min(balance-110000,4000000-110000):0;
let c=balance>4000000?balance-4000000:0;

let i1=a*r1,i2=b*r2,i3=c*r3,total=i1+i2+i3;

accInt+=total; s1+=i1; s2+=i2; s3+=i3;

let pay=(i===principalMonths)?balance:monthlyPrincipal;
balance-=pay;

table.innerHTML+=`<tr>
<td>${label}</td><td>${format(pay)}</td><td>0</td>
<td>${format(i1)}</td><td>${format(i2)}</td><td>${format(i3)}</td>
<td>${format(total)}</td><td>${format(balance)}</td>
<td>${format(balance+accInt)}</td></tr>`;
}

/* INTEREST */
let emi=accInt/interestMonths,remain=accInt;

for(let i=1;i<=interestMonths;i++){

let date=getLastDate(accDate,moratorium+principalMonths+i-1);
let label=accDate?(moratorium+principalMonths+i)+" ("+date+")":(moratorium+principalMonths+i);

remain-=emi;

table.innerHTML+=`<tr>
<td>${label}</td><td>0</td><td>${format(emi)}</td>
<td>0</td><td>0</td><td>0</td>
<td>0</td><td>0</td><td>${format(remain)}</td></tr>`;
}

/* SUMMARY */
document.getElementById("summary").innerHTML=
`Loan: ${format(P)}<br>
Effective Tenure: ${effective}<br>
Principal EMI: ${format(monthlyPrincipal)}<br>
Interest EMI: ${format(emi)}<br>
5% Interest: ${format(s1)}<br>
5.5% Interest: ${format(s2)}<br>
6% Interest: ${format(s3)}<br>
Total Interest: ${format(accInt)}`;

document.getElementById("summary").style.display="block";

}

</script>

</body>
</html>
