<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPGB Login</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1c4fa3,#000428);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* CONTAINER */
.box{
  width:90%;
  max-width:340px;
  background:rgba(255,255,255,0.1);
  padding:25px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* LOGO */
.logo{
  width:100%;
  max-width:220px;
  margin-bottom:10px;
}

/* INPUT FIX */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  box-sizing:border-box;
  font-size:14px;
  display:block;
}

/* CAPTCHA BOX FIX */
.captcha-box{
  display:flex;
  gap:10px;
  width:100%;
}

.captcha-text{
  flex:1;
  background:#fff;
  color:#000;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  letter-spacing:2px;
  text-align:center;
  box-sizing:border-box;
}

.refresh{
  width:50px;
  background:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  box-sizing:border-box;
}

/* BUTTON FIX */
button{
  width:100%;
  padding:12px;
  background:#00c6ff;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
  box-sizing:border-box;
}

button:hover{
  background:#0072ff;
}

#msg{
  margin-top:10px;
  color:yellow;
}

/* FOCUS EFFECT */
input:focus{
  outline:none;
  box-shadow:0 0 5px #00c6ff;
}
</style>
</head>

<body>

<div class="box">

  <img src="mpgb_header_small.png" class="logo">

  <h2>MPGB Login</h2>

  <input type="text" id="username" placeholder="Enter SOL ID">
  <input type="password" id="password" placeholder="Enter Password">

  <!-- CAPTCHA -->
  <div class="captcha-box">
    <div class="captcha-text" id="captcha"></div>
    <button class="refresh" onclick="generateCaptcha()">⟳</button>
  </div>

  <input type="text" id="captchaInput" placeholder="Enter CAPTCHA">

  <button onclick="login()">Login</button>

  <p id="msg"></p>

</div>

<script>

let captchaValue = "";

/* GENERATE CAPTCHA */
function generateCaptcha(){
  captchaValue = Math.random().toString(36).substring(2,7).toUpperCase();
  document.getElementById("captcha").innerText = captchaValue;
}
generateCaptcha();

/* LOGIN FUNCTION */
function login(){

  let user = document.getElementById("username").value.trim();
  let pass = document.getElementById("password").value.trim();
  let captchaInput = document.getElementById("captchaInput").value.trim();

  if(captchaInput !== captchaValue){
    document.getElementById("msg").innerText = "Invalid CAPTCHA!";
    generateCaptcha();
    return;
  }

  let url = "https://script.google.com/macros/s/AKfycbwQGrxhD6caEndOULRK0jMvzG5j9mQ7EA4Xb2n8BtniAFeWh0RGE8lCk0PZgV0uPzmkdQ/exec"
            + "?username=" + encodeURIComponent(user)
            + "&password=" + encodeURIComponent(pass)
            + "&key=MPGB123";

  fetch(url)
    .then(res => res.json())
    .then(data => {

      if(data.status === "success"){

        localStorage.setItem("login","true");
        localStorage.setItem("branch", data.branch);
        localStorage.setItem("time", new Date().getTime());

        window.location.href = "dashboard.html";

      } else {
        document.getElementById("msg").innerText = "Invalid Login!";
        generateCaptcha();
      }

    })
    .catch(()=>{
      document.getElementById("msg").innerText = "Server Error!";
    });
}

</script>

</body>
</html>
