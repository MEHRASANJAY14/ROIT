<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPGB Login</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1c4fa3,#000428);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* CONTAINER */
.box{
  width:90%;
  max-width:340px;
  background:rgba(255,255,255,0.1);
  padding:25px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* LOGO */
.logo{
  width:100%;
  max-width:220px;
  margin-bottom:10px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  box-sizing:border-box;
  font-size:14px;
}

/* CAPTCHA BOX */
.captcha-box{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
}

/* CAPTCHA TEXT */
.captcha-text{
  flex:1;
  background:#fff;
  color:#000;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  letter-spacing:2px;
  text-align:center;
}

/* 🔥 REFRESH BUTTON (SVG FIX) */
.refresh{
  width:50px;
  height:50px;
  background:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

/* BUTTON */
button.login-btn{
  width:100%;
  padding:12px;
  background:#00c6ff;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

button.login-btn:hover{
  background:#0072ff;
}

#msg{
  margin-top:10px;
  color:yellow;
}

/* FOCUS */
input:focus{
  outline:none;
  box-shadow:0 0 5px #00c6ff;
}
</style>
</head>

<body>

<div class="box">

  <img src="mpgb_header_small.png" class="logo">

  <h2>MPGB Login</h2>

  <input type="text" id="username" placeholder="Enter SOL ID">
  <input type="password" id="password" placeholder="Enter Password">

  <!-- CAPTCHA -->
  <div class="captcha-box">
    <div class="captcha-text" id="captcha"></div>

    <button type="button" class="refresh" onclick="generateCaptcha()">
      <!-- SVG ICON (ALWAYS VISIBLE) -->
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="black" d="M17.65 6.35A7.95 7.95 0 0012 4V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107-7c1.66 0 3.14.69 4.22 1.78l1.43-1.43z"/>
      </svg>
    </button>
  </div>

  <input type="text" id="captchaInput" placeholder="Enter CAPTCHA">

  <button class="login-btn" onclick="login()">Login</button>

  <p id="msg"></p>

</div>

<script>

let captchaValue = "";

/* GENERATE CAPTCHA */
function generateCaptcha(){
  captchaValue = Math.random().toString(36).substring(2,7).toUpperCase();
  document.getElementById("captcha").innerText = captchaValue;
}
generateCaptcha();

/* LOGIN FUNCTION */
function login(){

  let user = document.getElementById("username").value.trim();
  let pass = document.getElementById("password").value.trim();
  let captchaInput = document.getElementById("captchaInput").value.trim();

  if(captchaInput !== captchaValue){
    document.getElementById("msg").innerText = "Invalid CAPTCHA!";
    generateCaptcha();
    return;
  }

  let url = "https://script.google.com/macros/s/AKfycbwQGrxhD6caEndOULRK0jMvzG5j9mQ7EA4Xb2n8BtniAFeWh0RGE8lCk0PZgV0uPzmkdQ/exec"
            + "?username=" + encodeURIComponent(user)
            + "&password=" + encodeURIComponent(pass)
            + "&key=MPGB123";

  fetch(url)
    .then(res => res.json())
    .then(data => {

      if(data.status === "success"){

        localStorage.setItem("login","true");
        localStorage.setItem("branch", data.branch);
        localStorage.setItem("time", new Date().getTime());

        window.location.href = "dashboard.html";

      } else {
        document.getElementById("msg").innerText = "Invalid Login!";
        generateCaptcha();
      }

    })
    .catch(()=>{
      document.getElementById("msg").innerText = "Server Error!";
    });
}

</script>

</body>
</html>
