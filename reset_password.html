<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1c4fa3,#000428);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:white;
}

/* CARD FIXED */
.card{
  width:90%;
  max-width:360px;
  background:rgba(255,255,255,0.12);
  padding:25px 20px;
  border-radius:14px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  text-align:center;
}

/* TITLE */
.card h2{
  margin-bottom:15px;
  font-size:20px;
}

/* INPUT GROUP FIX */
.input-group{
  position:relative;
  width:100%;
}

/* ICON FIX */
.input-group i{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#555;
}

/* INPUT PERFECT ALIGN */
input{
  width:100%;
  padding:12px 12px 12px 38px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  outline:none;
  font-size:14px;
  box-sizing:border-box;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  background:#00c6ff;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

button:hover{
  background:#0096c7;
}

/* MESSAGE */
#msg{
  margin-top:12px;
  font-weight:bold;
  font-size:14px;
}

/* LOADER */
.loader {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #00c6ff;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-right: 8px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* FOOTER */
.footer{
  margin-top:10px;
  font-size:11px;
  opacity:0.8;
}

</style>
</head>

<body>

<div class="card">

  <h2>🔐 Reset Password</h2>

  <div class="input-group">
    <i class="fa-solid fa-user"></i>
    <input type="text" id="userid" placeholder="Enter User ID">
  </div>

  <button onclick="resetPass()">Reset Password</button>

  <p id="msg"></p>

  <div class="footer">
    Only N07550 can access this panel
  </div>

</div>

<script>

// 🔐 ADMIN CHECK
if(localStorage.getItem("userid") !== "N07550"){
  alert("Unauthorized Access!");
  window.location.href = "dashboard.html";
}

// 🔐 RESET FUNCTION
function resetPass(){

  let user = document.getElementById("userid").value.trim();
  let msg = document.getElementById("msg");

  if(user === ""){
    msg.innerHTML = "❌ Please enter User ID";
    return;
  }

  msg.innerHTML = '<span class="loader"></span> Processing...';

  let admin = localStorage.getItem("userid");

  let url = "https://script.google.com/macros/s/AKfycbwQGrxhD6caEndOULRK0jMvzG5j9mQ7EA4Xb2n8BtniAFeWh0RGE8lCk0PZgV0uPzmkdQ/exec"
            + "?action=resetPassword"
            + "&admin=" + admin
            + "&userid=" + user
            + "&key=MPGB123";

  fetch(url)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      msg.innerHTML = "✅ Reset Done<br>Default password applied";
      msg.style.color = "lightgreen";
    } 
    else if(data.status === "unauthorized"){
      msg.innerHTML = "❌ Unauthorized";
    } 
    else{
      msg.innerHTML = "❌ User Not Found";
    }

  })
  .catch(()=>{
    msg.innerHTML = "⚠ Server Error";
  });

}

</script>

</body>
</html>
