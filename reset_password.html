<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1c4fa3,#000428);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:white;
}

/* BACK BUTTON */
.back-btn{
  position:absolute;
  top:15px;
  left:15px;
  background:white;
  color:#1c4fa3;
  padding:6px 12px;
  border-radius:6px;
  font-size:12px;
  cursor:pointer;
}

/* CARD */
.card{
  width:90%;
  max-width:360px;
  background:rgba(255,255,255,0.12);
  padding:25px;
  border-radius:14px;
  backdrop-filter:blur(12px);
  text-align:center;
}

/* INPUT */
.input-group{
  position:relative;
}

.input-group i{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#555;
}

input{
  width:100%;
  padding:12px 12px 12px 38px;
  margin:10px 0;
  border:none;
  border-radius:8px;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  background:#00c6ff;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* MESSAGE */
#msg{
  margin-top:10px;
  font-weight:bold;
}

/* LOADER */
.loader {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #00c6ff;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  animation: spin 1s linear infinite;
  display:inline-block;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->
<div class="back-btn" onclick="goBack()">⬅ Back</div>

<div class="card">

  <h2>🔐 Reset Password</h2>

  <div class="input-group">
    <i class="fa-solid fa-user"></i>
    <input type="text" id="userid" placeholder="Enter User ID" onblur="checkUser()">
  </div>

  <button onclick="resetPass()">Reset Password</button>

  <p id="msg"></p>

</div>

<script>

// 🔐 ADMIN CHECK
if(localStorage.getItem("userid") !== "N07550"){
  window.location.href = "dashboard.html";
}

// 🔙 BACK
function goBack(){
  window.location.href = "dashboard.html";
}

// 🔍 CHECK USER EXISTS
function checkUser(){

  let user = document.getElementById("userid").value.trim();
  let msg = document.getElementById("msg");

  if(user === ""){
    return;
  }

  msg.innerHTML = "Checking...";

  let url = "https://script.google.com/macros/s/AKfycbwQGrxhD6caEndOULRK0jMvzG5j9mQ7EA4Xb2n8BtniAFeWh0RGE8lCk0PZgV0uPzmkdQ/exec"
            + "?action=checkUser"
            + "&userid=" + user;

  fetch(url)
  .then(res => res.json())
  .then(data => {

    if(data.status === "exists"){
      msg.innerHTML = "✅ Valid User";
      msg.style.color = "lightgreen";
    } else {
      msg.innerHTML = "❌ User Not Found";
      msg.style.color = "red";
    }

  });

}

// 🔐 RESET
function resetPass(){

  let user = document.getElementById("userid").value.trim();
  let msg = document.getElementById("msg");

  if(user === ""){
    msg.innerHTML = "❌ Enter User ID";
    return;
  }

  msg.innerHTML = '<span class="loader"></span> Processing...';

  let admin = localStorage.getItem("userid");

  let url = "https://script.google.com/macros/s/AKfycbwQGrxhD6caEndOULRK0jMvzG5j9mQ7EA4Xb2n8BtniAFeWh0RGE8lCk0PZgV0uPzmkdQ/exec"
            + "?action=resetPassword"
            + "&admin=" + admin
            + "&userid=" + user
            + "&key=MPGB123";

  fetch(url)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      msg.innerHTML = "✅ Reset Done<br>Default password applied";
      msg.style.color = "lightgreen";
    } 
    else{
      msg.innerHTML = "❌ Failed";
    }

  });

}

</script>

</body>
</html>
