<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

/* ===== BODY FIX ===== */
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1c4fa3,#000428);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

/* ===== BACK BUTTON ===== */
.back-btn{
  position:absolute;
  top:15px;
  left:15px;
  background:white;
  color:#1c4fa3;
  padding:6px 12px;
  border-radius:6px;
  font-size:12px;
  cursor:pointer;
}

/* ===== CARD (FIXED CENTER) ===== */
.card{
  width:90%;
  max-width:350px;
  background:rgba(255,255,255,0.12);
  padding:25px;
  border-radius:14px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  text-align:center;
}

/* ===== TITLE ===== */
.card h2{
  margin-bottom:15px;
}

/* ===== INPUT GROUP ===== */
.input-group{
  position:relative;
  width:100%;
}

/* ICON FIX */
.input-group i{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#555;
}

/* INPUT PERFECT */
input{
  width:100%;
  padding:12px 12px 12px 38px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  outline:none;
  font-size:14px;
  box-sizing:border-box;
}

/* ===== BUTTON ===== */
button{
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
}

/* ===== MESSAGE ===== */
#msg{
  margin-top:12px;
  font-weight:bold;
  font-size:14px;
}

/* ===== LOADER ===== */
.loader {
  border: 3px solid #fff;
  border-top: 3px solid transparent;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  animation: spin 1s linear infinite;
  display:inline-block;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->
<div class="back-btn" onclick="goBack()">⬅ Back</div>

<div class="card">

  <h2>🔐 Reset Password</h2>

  <div class="input-group">
    <i class="fa-solid fa-user"></i>
    <input type="text" id="userid" placeholder="Enter User ID">
  </div>

  <button id="resetBtn" onclick="resetPass()">
    <span id="btnText">Reset Password</span>
  </button>

  <p id="msg"></p>

</div>

<script>

// 🔐 ADMIN CHECK
if(localStorage.getItem("userid") !== "N07550"){
  window.location.href = "dashboard.html";
}

// 🔙 BACK
function goBack(){
  window.location.href = "dashboard.html";
}

// 🔐 RESET FUNCTION
function resetPass(){

  let user = document.getElementById("userid").value.trim();
  let msg = document.getElementById("msg");
  let btn = document.getElementById("resetBtn");
  let text = document.getElementById("btnText");

  if(user === ""){
    msg.innerHTML = "❌ Enter User ID";
    return;
  }

  // LOADING
  btn.disabled = true;
  text.innerHTML = '<span class="loader"></span> Processing...';

  let admin = localStorage.getItem("userid");

  let url = "https://script.google.com/macros/s/AKfycbwQGrxhD6caEndOULRK0jMvzG5j9mQ7EA4Xb2n8BtniAFeWh0RGE8lCk0PZgV0uPzmkdQ/exec"
            + "?action=resetPassword"
            + "&admin=" + admin
            + "&userid=" + user
            + "&key=MPGB123";

  fetch(url)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      msg.innerHTML = "✅ Reset Successful";
      msg.style.color = "lightgreen";
      text.innerHTML = "✔ Done";
    } else {
      msg.innerHTML = "❌ User Not Found";
      btn.disabled = false;
      text.innerHTML = "Retry";
    }

  })
  .catch(()=>{
    msg.innerHTML = "⚠ Server Error";
    btn.disabled = false;
    text.innerHTML = "Retry";
  });

}

</script>

</body>
</html>
