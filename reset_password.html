<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<style>
body{
font-family:Segoe UI;
background:#1c4fa3;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:10px;
text-align:center;
width:300px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#00c6ff;
border:none;
color:white;
border-radius:5px;
}

#msg{
margin-top:10px;
}
</style>

</head>

<body>

<div class="box">

<h3>🔐 Reset Password</h3>

<input type="text" id="userid" placeholder="Enter User ID">
<input type="password" id="newpass" placeholder="New Password">

<button onclick="resetPass()">Reset</button>

<p id="msg"></p>

</div>

<script>

// 🔐 ADMIN CHECK
let admin = localStorage.getItem("userid");

if(admin !== "N07550"){
  alert("Unauthorized Access!");
  window.location.href = "dashboard.html";
}

function resetPass(){

  let user = document.getElementById("userid").value;
  let pass = document.getElementById("newpass").value;

  let msg = document.getElementById("msg");

  msg.innerHTML = "Processing...";

  let url = "YOUR_SCRIPT_URL"
            + "?action=resetPassword"
            + "&admin=" + admin
            + "&userid=" + user
            + "&newpass=" + pass
            + "&key=MPGB123";

  fetch(url)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      msg.innerHTML = "✅ Password Reset Successful";
    } else {
      msg.innerHTML = "❌ Failed / User Not Found";
    }

  });

}

</script>

</body>
</html>
