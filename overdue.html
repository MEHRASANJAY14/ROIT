<!DOCTYPE html>
<html>
<head>
  <title>PDF Viewer</title>

  <!-- 🔐 LOGIN CHECK -->
  <script>
  (function(){
    let login = localStorage.getItem("login");
    let time = localStorage.getItem("time");
    let now = new Date().getTime();

    if(login !== "true"){
      window.location.replace("index.html");
    }

    if(time && (now - time > 30*60*1000)){
      localStorage.clear();
      window.location.replace("index.html");
    }
  })();
  </script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg,#1e3c72,#2a5298);
      color: white;
    }

    .topbar {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
    }

    .btnTop {
      padding: 8px 15px;
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .backBtn {
      background: linear-gradient(45deg,#ff9800,#ff5722);
    }

    .logoutBtn {
      background: linear-gradient(45deg,#ff1744,#d50000);
    }

    .container {
      padding: 20px;
      text-align: center;
    }

    select {
      padding: 12px;
      width: 320px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    #loader {
      display: none;
      margin-top: 15px;
      font-size: 18px;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
      border-radius: 12px;
      display: none;
      margin-top: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .btn {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #00c853;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
  </style>

</head>

<body>

<div class="topbar">
  <button class="btnTop backBtn" onclick="goBack()">⬅ Back</button>
  <div>📄 PDF Viewer</div>
  <button class="btnTop logoutBtn" onclick="logout()">Logout</button>
</div>

<div class="container">

  <h2>Select Branch</h2>

  <select id="branchSelect">
    <option value="">-- Select Branch --</option>
  </select>

  <div id="loader">⏳ Loading PDF...</div>

  <iframe id="pdfFrame"></iframe>

  <br>
  <button class="btn" onclick="downloadPDF()">⬇ Download</button>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby2ZjLwww2Yupn6be5XkdsRN_sRb3oI9pqnOmZhOSNAcSl5YGAXzCNLRG1wfQsEJALBKg/exec";

let currentPDF = "";

// 🔹 Load dropdown
fetch(API_URL)
  .then(res => res.json())
  .then(data => {

    const select = document.getElementById("branchSelect");

    data.forEach(item => {
      if(item.url){
        const option = document.createElement("option");
        option.value = item.url;
        option.text = item.sol + " - " + item.branch;
        select.appendChild(option);
      }
    });

  });

// 🔹 Load PDF SAME PAGE
document.getElementById("branchSelect").addEventListener("change", function(){

  const url = this.value;
  if(!url) return;

  const loader = document.getElementById("loader");
  const frame = document.getElementById("pdfFrame");

  loader.style.display = "block";
  frame.style.display = "none";

  frame.onload = function(){
    loader.style.display = "none";
    frame.style.display = "block";
  };

  frame.src = url;
  currentPDF = url;

});

// 🔹 Download
function downloadPDF(){
  if(currentPDF){
    window.open(currentPDF.replace("/preview","/view"), "_blank");
  } else {
    alert("Please select a branch first");
  }
}

// 🔹 Back
function goBack(){
  window.location.href = "dashboard.html";
}

// 🔹 Logout
function logout(){
  localStorage.clear();
  window.location.href = "index.html";
}

</script>

</body>
</html>
