<!DOCTYPE html>
<html>
<head>
<title>Overdue Dashboard</title>

<style>
body {
  font-family: Arial;
  padding:20px;
  text-align:center;
}
select {
  padding:12px;
  width:320px;
  font-size:16px;
}
</style>
</head>

<body>

<h2>📊 Overdue Dashboard</h2>

<select id="branchSelect">
<option>Loading...</option>
</select>

<script>

var apiURL = "https://script.google.com/macros/s/AKfycby2ZjLwww2Yupn6be5XkdsRN_sRb3oI9pqnOmZhOSNAcSl5YGAXzCNLRG1wfQsEJALBKg/exec";

// 🔥 XMLHttpRequest (BEST FOR APPS SCRIPT)
var xhr = new XMLHttpRequest();
xhr.open("GET", apiURL, true);

xhr.onreadystatechange = function(){

  if(xhr.readyState == 4 && xhr.status == 200){

    var data = JSON.parse(xhr.responseText);

    console.log("DATA:", data);

    var select = document.getElementById("branchSelect");
    select.innerHTML = '<option value="">-- Select Branch --</option>';

    for(var i=0; i<data.length; i++){

      var item = data[i];

      var url = item.url || "";
      var sol = item.sol || "";
      var branch = item.branch || "Branch";

      if(url !== ""){

        var opt = document.createElement("option");
        opt.value = url;
        opt.text = branch + " (" + sol + ")";

        select.appendChild(opt);
      }
    }
  }
};

xhr.send();


// 🔹 SELECT → OPEN PDF
document.getElementById("branchSelect").onchange = function(){

  var url = this.value;
  if(!url) return;

  var openURL = url.replace("/view", "/preview");

  window.open(openURL, "_blank");

};

</script>

</body>
</html>
