<!DOCTYPE html>
<html>
<head>
<title>Overdue PDF Dashboard</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  padding:20px;
  text-align:center;
}

select {
  padding:12px;
  width:350px;
  font-size:16px;
  border-radius:8px;
}

.loader {
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>📊 Overdue PDF Dashboard</h2>

<select id="branchSelect">
<option value="">-- Loading Branches... --</option>
</select>

<div id="loader" class="loader"></div>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycby2ZjLwww2Yupn6be5XkdsRN_sRb3oI9pqnOmZhOSNAcSl5YGAXzCNLRG1wfQsEJALBKg/exec";

// 🔥 IMPORTANT: cache avoid
fetch(apiURL + "?t=" + new Date().getTime())
.then(function(res){
  return res.json();
})
.then(function(data){

  console.log("DATA:", data);

  var select = document.getElementById("branchSelect");

  // reset dropdown
  select.innerHTML = '<option value="">-- Select Branch --</option>';

  for(var i=0; i<data.length; i++){

    var item = data[i];

    // 🔥 fallback keys (important)
    var url = item.url || item.pdf || "";
    var sol = item.sol || "";
    var branch = item.branch || item.name || "Branch";

    if(url !== ""){

      var opt = document.createElement("option");
      opt.value = url;
      opt.text = branch + " (" + sol + ")";

      select.appendChild(opt);
    }
  }

})
.catch(function(err){
  console.error(err);
  document.getElementById("branchSelect").innerHTML =
    "<option>❌ API Load Failed</option>";
});


// 🔹 ON SELECT
document.getElementById("branchSelect").addEventListener("change", function(){

  var url = this.value;
  if(!url) return;

  document.getElementById("loader").innerText = "⏳ Opening PDF...";

  // 🔥 safe open
  var openURL = url.replace("/view", "/preview");

  window.open(openURL, "_blank");

  setTimeout(function(){
    document.getElementById("loader").innerText = "";
  }, 1000);

});

</script>

</body>
</html>
