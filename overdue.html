<!DOCTYPE html>
<html>
<head>
<title>Overdue Dashboard</title>

<style>
body{
font-family:Segoe UI;
background:linear-gradient(135deg,#e6ffe6,#d9f2ff);
margin:0;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#006633;
color:white;
padding:12px 20px;
border-radius:10px;
margin-bottom:15px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

select{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:10px;
}

iframe{
width:100%;
height:550px;
border-radius:10px;
border:1px solid #ccc;
margin-top:10px;
}

.loading{
text-align:center;
font-weight:bold;
color:#006633;
display:none;
}
</style>

</head>

<body>

<div class="topbar">
<div id="userInfo"></div>
<div>
<button onclick="goBack()">⬅ Back</button>
<button onclick="logout()">Logout</button>
</div>
</div>

<div class="container">

<h2>📊 Overdue Dashboard</h2>

<select id="solSelect" onchange="openReport()">
<option value="">-- Select SOL --</option>
<option value="12010">12010 - JABALPUR</option>
<option value="12060">12060 - SHAHPURA</option>
<option value="12110">12110 - MANJHOLI</option>
</select>

<div id="loading" class="loading">⏳ Loading report...</div>

<iframe id="reportFrame" onload="hideLoading()"></iframe>

</div>

<script>

// 👤 USER INFO
document.getElementById("userInfo").innerText =
"👤 " + (localStorage.getItem("role") || "User") +
" | 🏢 " + (localStorage.getItem("branch") || "Unknown");

function goBack(){
window.location.href = "dashboard.html";
}

function logout(){
localStorage.clear();
window.location.href = "index.html";
}

// 🔥 FILE MAP (PUT REAL FILE IDs HERE)
var fileMap = {
"12010":"PUT_FILE_ID_HERE",
"12060":"PUT_FILE_ID_HERE",
"12110":"PUT_FILE_ID_HERE"
};

// 📂 OPEN REPORT
function openReport(){

var sol = document.getElementById("solSelect").value;

if(sol === "") return;

document.getElementById("loading").style.display = "block";

if(fileMap[sol]){

var url = "https://drive.google.com/file/d/" + fileMap[sol] + "/preview";

document.getElementById("reportFrame").src = url;

}else{
alert("❌ File ID not mapped!");
document.getElementById("loading").style.display = "none";
}
}

// ⏳ HIDE LOADING
function hideLoading(){
document.getElementById("loading").style.display = "none";
}

</script>

</body>
</html>
