<!DOCTYPE html>
<html>
<head>
<title>Overdue PDF Dashboard</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#e6ffe6,#d9f2ff);
  padding:20px;
  text-align:center;
}

select {
  padding:12px;
  width:300px;
  font-size:16px;
  border-radius:8px;
}

.loader {
  display:none;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>📊 Overdue PDF Dashboard</h2>

<select id="branchSelect">
<option value="">-- Select Branch --</option>
</select>

<div id="loader" class="loader">⏳ Opening PDF...</div>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycby2ZjLwww2Yupn6be5XkdsRN_sRb3oI9pqnOmZhOSNAcSl5YGAXzCNLRG1wfQsEJALBKg/exec";

// 🔹 LOAD DROPDOWN
fetch(apiURL)
.then(res => res.json())
.then(data => {

  let select = document.getElementById("branchSelect");

  data.forEach(item => {
    if(item.url){
      let opt = document.createElement("option");
      opt.value = item.url;
      opt.text = item.branch + " (" + item.sol + ")";
      select.appendChild(opt);
    }
  });

});

// 🔹 ON SELECT
document.getElementById("branchSelect").addEventListener("change", function(){

  let url = this.value;
  if(!url) return;

  let loader = document.getElementById("loader");
  loader.style.display = "block";

  // 🔥 OPEN PDF (WORKING METHOD)
  let openURL = url.replace("/view", "/preview");

  setTimeout(()=>{
    window.open(openURL, "_blank");
    loader.style.display = "none";
  }, 500);

});

</script>

</body>
</html>
