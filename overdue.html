<!-- 🔐 LOGIN SECURITY (RUN FIRST) -->
<script>
(function(){

  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");

  let now = new Date().getTime();

  // Not logged in
  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  // Session expiry (30 min)
  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }

})();
</script>

<script>

// 🔥 SOL → Google Drive FILE ID mapping
var fileMap = {
"12010": "FILE_ID_12010",
"12020": "FILE_ID_12020",
"12030": "FILE_ID_12030",
"12040": "FILE_ID_12040"
};

// Open report
function openReport(){

var sol = document.getElementById("solSelect").value;

if(sol === "") return;

if(fileMap[sol]){

var url = "https://drive.google.com/file/d/" + fileMap[sol] + "/preview";

document.getElementById("reportFrame").src = url;
document.getElementById("alertBox").style.display = "none";

}else{
document.getElementById("alertBox").style.display = "block";
document.getElementById("reportFrame").src = "";
}
}
