<!DOCTYPE html>
<html>
<head>
<title>Overdue Dashboard</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#e6ffe6,#d9f2ff);
  margin: 0;
  padding: 20px;
}

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#006633;
  color:white;
  padding:12px 20px;
  border-radius:10px;
  margin-bottom:15px;
}

.container {
  max-width:1000px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
  text-align:center;
}

select {
  padding:12px;
  font-size:16px;
  width:350px;
  border-radius:8px;
  border:1px solid #ccc;
}

.loader {
  display:none;
  margin-top:20px;
  font-weight:bold;
}

.btn {
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:white;
}

.back { background:#007bff; }
.logout { background:#e74c3c; }

</style>
</head>

<body>

<div class="topbar">
<div id="userInfo"></div>
<div>
<button class="btn back" onclick="goBack()">⬅ Back</button>
<button class="btn logout" onclick="logout()">Logout</button>
</div>
</div>

<div class="container">

<h2>📊 Overdue Dashboard</h2>

<select id="branchSelect">
<option>Loading branches...</option>
</select>

<div id="loader" class="loader">⏳ Opening report...</div>

</div>

<script>

// 👤 USER INFO
document.getElementById("userInfo").innerText =
"👤 " + (localStorage.getItem("role") || "User") +
" | 🏢 " + (localStorage.getItem("branch") || "Unknown");

// 🔙 BACK
function goBack(){
window.location.href = "dashboard.html";
}

// 🔓 LOGOUT
function logout(){
localStorage.clear();
window.location.href = "index.html";
}

// 🔥 YOUR LIVE API
const apiURL = "https://script.google.com/macros/s/AKfycby2ZjLwww2Yupn6be5XkdsRN_sRb3oI9pqnOmZhOSNAcSl5YGAXzCNLRG1wfQsEJALBKg/exec";

let allData = [];

// 🔹 LOAD DATA
fetch(apiURL)
.then(res => res.json())
.then(data => {

  allData = data;

  let select = document.getElementById("branchSelect");
  select.innerHTML = '<option value="">-- Select Branch --</option>';

  data.forEach(item => {

    let opt = document.createElement("option");
    opt.value = item.url;
    opt.text = item.branch + " (" + item.sol + ")";

    select.appendChild(opt);

  });

})
.catch(err => {
  alert("❌ API error");
  console.error(err);
});

// 🔹 ON SELECT
document.getElementById("branchSelect").addEventListener("change", function(){

  let url = this.value;

  if(!url) return;

  document.getElementById("loader").style.display = "block";

  // 🔥 OPEN HTML FILE
  setTimeout(()=>{
    window.open(url, "_blank");
    document.getElementById("loader").style.display = "none";
  }, 500);

});

</script>

</body>
</html>
