<!DOCTYPE html>
<html>
<head>
<title>Overdue Dashboard</title>

<style>
body{
font-family:Segoe UI;
background:linear-gradient(135deg,#e6ffe6,#d9f2ff);
margin:0;
padding:30px;
}

.container{
max-width:950px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

h1{
text-align:center;
color:#006633;
margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#555;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:10px;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
background:#006633;
color:white;
cursor:pointer;
font-weight:bold;
margin-right:5px;
}

button:hover{
background:#004d26;
}

iframe{
width:100%;
height:550px;
border-radius:10px;
border:1px solid #ccc;
margin-top:10px;
}

.alert{
color:red;
font-weight:bold;
display:none;
margin-top:5px;
}

.badge{
background:#006633;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
display:inline-block;
margin-top:5px;
}
</style>

</head>

<body>

<div class="container">

<h1>📊 Overdue Dashboard</h1>
<div class="subtitle">Select SOL ID to view overdue accounts</div>

<input list="solList" id="solInput" placeholder="🔍 Type SOL ID (e.g. 12010)">

<datalist id="solList">

<option value="12010">12010 - JABALPUR</option>
<option value="12020">12020 - RANJHI</option>
<option value="12030">12030 - SIHORA (JBP)</option>
<option value="12040">12040 - KHITOLA BAZAR</option>
<option value="12050">12050 - SAHAJPUR</option>
<option value="12060">12060 - SHAHPURA (JBP)</option>
<option value="12070">12070 - PANAGAR</option>
<option value="12080">12080 - LAMKANA</option>
<option value="12090">12090 - ADHARTAL JABALPUR</option>
<option value="12100">12100 - PATAN</option>
<option value="12110">12110 - MANJHOLI</option>
<option value="12120">12120 - PISANHARI MADHIYA</option>
<option value="12130">12130 - EKTA CHOUK</option>
<option value="12140">12140 - KARMETA GRAM</option>
<option value="12150">12150 - BARGI</option>
<option value="12160">12160 - GWARIGHAT ROAD</option>
<option value="12170">12170 - BILHARI</option>
<option value="12180">12180 - KUA</option>
<option value="12190">12190 - KYMORE</option>
<option value="12200">12200 - DEORA KALA</option>
<option value="12210">12210 - VILAYAT KALA</option>
<option value="12220">12220 - DASHARMAN</option>
<option value="12230">12230 - AMGAWAN</option>
<option value="12240">12240 - KATNI</option>
<option value="12250">12250 - DEORI TOLA</option>
<option value="12260">12260 - UMARIYAPAN</option>
<option value="12270">12270 - BADWARA</option>
<option value="12280">12280 - VIJAY RAGHAVGARH</option>
<option value="12290">12290 - KHIRHANI DURGA CHOWK</option>
<option value="12300">12300 - BARAHI</option>
<option value="12310">12310 - BAHORIBAND</option>
<option value="12320">12320 - NARSINGHPUR</option>
<option value="12330">12330 - STATION GANJ</option>
<option value="12340">12340 - AMGAON BADA</option>
<option value="12350">12350 - KANWAS</option>
<option value="12360">12360 - PANARI</option>
<option value="12370">12370 - BOHANI</option>
<option value="12380">12380 - KARELI</option>
<option value="12390">12390 - BAGASPUR</option>
<option value="12400">12400 - SAIKHEDA</option>
<option value="12410">12410 - CHICHALI</option>
<option value="12420">12420 - BARAHATA</option>
<option value="12430">12430 - KAMTI IMALYA</option>
<option value="12440">12440 - SINGHPUR BADA</option>
<option value="12450">12450 - GADARWARA</option>
<option value="12460">12460 - DEORI LOLRI</option>
<option value="12470">12470 - NARSINGHPUR BASTI</option>
<option value="12480">12480 - KARAKBEL</option>
<option value="12490">12490 - SOORWARI</option>
<option value="12500">12500 - TENDUKHEDA</option>
<option value="12510">12510 - GOTEGAON</option>
<option value="12520">12520 - COLLECTORATE</option>
<option value="12530">12530 - ASS KARELI</option>

</datalist>

<div style="margin-bottom:10px;">
<button onclick="openReport()">Open</button>
<button onclick="openNew()">New Tab</button>
</div>

<div id="branchName" class="badge"></div>

<div id="alertBox" class="alert">❌ Report not found!</div>

<iframe id="reportFrame"></iframe>

</div>

<script>

// Enter key
document.getElementById("solInput").addEventListener("keypress", function(e){
if(e.key === "Enter"){
openReport();
}
});

function openReport(){
var sol = document.getElementById("solInput").value.trim();

if(sol === "") return;

var url = "reports/" + sol + ".html";

// Show branch name
var list = document.getElementById("solList").options;
for(let i=0;i<list.length;i++){
if(list[i].value === sol){
document.getElementById("branchName").innerText = list[i].text;
}
}

// Check file
fetch(url,{method:'HEAD'})
.then(res=>{
if(res.ok){
document.getElementById("alertBox").style.display="none";
document.getElementById("reportFrame").src = url;
}else{
showError();
}
})
.catch(()=>showError());
}

function openNew(){
var sol = document.getElementById("solInput").value;
if(sol !== ""){
window.open("reports/" + sol + "_report.html","_blank");
}
}

function showError(){
document.getElementById("alertBox").style.display="block";
document.getElementById("reportFrame").src="";
}
</script>

</body>
</html>
