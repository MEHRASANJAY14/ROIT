<!DOCTYPE html>
<html>
<head>
<title>Overdue Dashboard</title>

<!-- 🔐 SAFE LOGIN CHECK (NO AUTO LOGOUT) -->
<script>
(function(){

  // iframe ignore
  if(window !== window.top) return;

  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let token = localStorage.getItem("token");

  // ❌ DO NOT redirect (fix logout issue)
  if(login !== "true" || !branch || !token){
    console.warn("User not properly logged in");
  }

})();
</script>

<style>
body{
font-family:Segoe UI;
background:linear-gradient(135deg,#e6ffe6,#d9f2ff);
margin:0;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#006633;
color:white;
padding:12px 20px;
border-radius:10px;
margin-bottom:15px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:10px;
}

iframe{
width:100%;
height:550px;
border-radius:10px;
border:1px solid #ccc;
margin-top:10px;
}

.alert{
color:red;
font-weight:bold;
display:none;
text-align:center;
}
</style>

</head>

<div id="alertBox" class="alert">❌ Report not found!</div>

<script>

// 👤 USER INFO
document.getElementById("userInfo").innerText =
"👤 " + (localStorage.getItem("role") || "User") +
" | 🏢 " + (localStorage.getItem("branch") || "Unknown");

// 🔓 LOGOUT
function logout(){
localStorage.clear();
window.location.href = "index.html";
}

// 🔥 FILE MAP
var fileMap = {
"12010":"PASTE_ID_12010",
"12020":"PASTE_ID_12020",
"12030":"PASTE_ID_12030",
"12040":"PASTE_ID_12040"
};

// 🔄 SESSION CONTROL (SAFE)
setInterval(function(){

let time = localStorage.getItem("time");
let now = new Date().getTime();

if(time && (now - time > 30*60*1000)){
alert("Session expired. Please login again.");
localStorage.clear();
window.location.href = "index.html";
}

// keep alive
localStorage.setItem("time", now);

}, 60000);

// ENTER KEY
document.getElementById("solInput").addEventListener("keypress",function(e){
if(e.key==="Enter") openReport();
});

// 📂 OPEN REPORT
function openReport(){
var sol=document.getElementById("solInput").value.trim();

if(fileMap[sol]){
document.getElementById("reportFrame").src =
"https://drive.google.com/uc?export=preview&id="+fileMap[sol];
document.getElementById("alertBox").style.display="none";
}else{
document.getElementById("alertBox").style.display="block";
document.getElementById("reportFrame").src="";
}
}

</script>
