<!DOCTYPE html>
<html>
<head>
  <title>Smart PDF Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg,#1e3c72,#2a5298);
      color: white;
    }

    .container {
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    select {
      padding: 12px;
      width: 320px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    .card {
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
      display: none;
    }

    #loader {
      display: none;
      margin-top: 20px;
      font-size: 18px;
    }

    .btn {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #00c853;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      background: #00b248;
    }

    .topbar {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      font-size: 14px;
    }

  </style>

</head>

<body>

<div class="topbar">
  📍 Regional Office Dashboard | Live PDF Viewer
</div>

<div class="container">

  <h1>📊 Branch PDF Viewer</h1>

  <select id="branchSelect">
    <option value="">-- Select Branch --</option>
  </select>

  <div id="loader">⏳ Loading PDF...</div>

  <div class="card">
    <iframe id="pdfFrame"></iframe>

    <button class="btn" onclick="downloadPDF()">⬇ Download</button>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby2ZjLwww2Yupn6be5XkdsRN_sRb3oI9pqnOmZhOSNAcSl5YGAXzCNLRG1wfQsEJALBKg/exec";

let currentPDF = "";

// 🔹 Fetch data
async function loadBranches() {
  const res = await fetch(API_URL);
  const data = await res.json();

  const select = document.getElementById("branchSelect");

  data.forEach(item => {
    if(item.url){
      const option = document.createElement("option");
      option.value = item.url;
      option.text = item.sol + " - " + item.branch;
      select.appendChild(option);
    }
  });
}

loadBranches();

// 🔹 Dynamic PDF load (same page)
document.getElementById("branchSelect").addEventListener("change", function(){

  const url = this.value;
  if(!url) return;

  const loader = document.getElementById("loader");
  const frame = document.getElementById("pdfFrame");

  loader.style.display = "block";
  frame.style.display = "none";

  frame.onload = function(){
    loader.style.display = "none";
    frame.style.display = "block";
  };

  frame.src = url;   // 🔥 same page load
  currentPDF = url;

});

// 🔹 Download
function downloadPDF(){
  if(currentPDF){
    window.open(currentPDF.replace("/preview","/view"), "_blank");
  } else {
    alert("Please select a branch first");
  }
}

</script>

</body>
</html>
