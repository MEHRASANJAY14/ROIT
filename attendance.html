<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:#fff;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      backdrop-filter:blur(10px);
      background:rgba(255,255,255,0.1);
      position:sticky;
      top:0;
    }

    .header h3{
      margin:0;
      font-size:14px;
    }

    .header button{
      background:white;
      border:none;
      padding:6px 10px;
      border-radius:8px;
      font-size:11px;
      cursor:pointer;
      margin-left:5px;
    }

    .container{
      max-width:420px;
      margin:auto;
      padding:15px;
    }

    .card{
      background:rgba(255,255,255,0.1);
      border-radius:16px;
      padding:18px;
      margin-bottom:14px;
      backdrop-filter:blur(12px);
      box-shadow:0 8px 25px rgba(0,0,0,0.3);
    }

    .title{
      font-size:12px;
      opacity:0.7;
    }

    .value{
      font-size:24px;
      font-weight:600;
      margin-top:6px;
    }

    .grid{
      display:flex;
      gap:12px;
    }

    .presentCard{
      background:linear-gradient(135deg,#00c853,#69f0ae);
      color:#003300;
    }

    .leaveCard{
      background:linear-gradient(135deg,#ff9100,#ffcc80);
      color:#5d2600;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-weight:600;
      margin-top:10px;
      cursor:pointer;
      font-size:14px;
      transition:0.2s;
    }

    .btn:active{
      transform:scale(0.96);
    }

    .present{
      background:linear-gradient(135deg,#00c853,#00e676);
      color:white;
    }

    .leave{
      background:linear-gradient(135deg,#ff6d00,#ff3d00);
      color:white;
    }

    .hidden{
      display:none;
    }

    #msg{
      text-align:center;
      margin-top:12px;
      font-size:14px;
    }

    .loader{
      display:none;
      text-align:center;
      margin-top:10px;
      font-size:13px;
    }

    input,select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      margin-bottom:10px;
      background:rgba(255,255,255,0.9);
      font-size:14px;
    }

  </style>
</head>

<body>

<!-- LOGIN CHECK -->
<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let staffId = localStorage.getItem("staffId");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  if(login !== "true" || !branch || !staffId){
    window.location.replace("DASHBOARD.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }
})();
</script>

<div class="header">
  <h3 id="welcome">Loading...</h3>
  <div>
    <button onclick="goBack()">⬅ Back</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="title">Today's Attendance</div>
    <div class="value" id="today">--</div>
  </div>

  <div class="grid">
    <div class="card presentCard">
      <div class="title">Present</div>
      <div class="value" id="present">0</div>
    </div>

    <div class="card leaveCard">
      <div class="title">Leave</div>
      <div class="value" id="leave">0</div>
    </div>
  </div>

  <div class="card">
    <button class="btn present" onclick="mark()">✔ Mark Attendance</button>
    <button class="btn leave" onclick="showLeave()">➕ Apply Leave</button>
  </div>

  <div id="leaveBox" class="card hidden">
    <input type="date" id="from">
    <input type="date" id="to">

    <select id="type">
      <option value="">Select Leave</option>
      <option>PL</option>
      <option>CL</option>
      <option>MEDICAL</option>
      <option>MATERNITY</option>
      <option>PATERNITY</option>
      <option>UCL</option>
    </select>

    <button class="btn leave" onclick="applyLeave()">Submit Leave</button>
  </div>

  <div class="loader" id="loader">Processing...</div>
  <p id="msg"></p>

</div>

<script>

const URL = "YOUR_APPS_SCRIPT_URL";

let staffId = localStorage.getItem("staffId");
let branch = localStorage.getItem("branch");
let isAdmin = (staffId === "N07550");

// LOAD
function load(){
  fetch(URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain" },
    body:JSON.stringify({
      action:"dashboard",
      staff_id: isAdmin ? "ALL" : staffId
    })
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("welcome").innerText =
      "👋 " + (d.name || "User") + " ("+staffId+")" + (isAdmin?" [ADMIN]":"");

    document.getElementById("today").innerText = d.today;
    document.getElementById("present").innerText = d.present;
    document.getElementById("leave").innerText = d.leave;
  });
}

// MARK
function mark(){
  toggle(true);

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain" },
      body:JSON.stringify({
        staff_id:staffId,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      showMsg(d.message);
      toggle(false);
      load();
    });
  });
}

// LEAVE
function showLeave(){
  document.getElementById("leaveBox").classList.remove("hidden");
}

function applyLeave(){
  toggle(true);

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain" },
      body:JSON.stringify({
        staff_id:staffId,
        status:"Leave",
        leave_type:document.getElementById("type").value,
        from_date:document.getElementById("from").value,
        to_date:document.getElementById("to").value,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      showMsg(d.message);
      toggle(false);
      document.getElementById("leaveBox").classList.add("hidden");
      load();
    });
  });
}

// HELPERS
function toggle(x){
  document.getElementById("loader").style.display = x?"block":"none";
}

function showMsg(t){
  document.getElementById("msg").innerText = t;
}

function logout(){
  localStorage.clear();
  window.location.replace("index.html");
}

function goBack(){
  window.history.back();
}

load();

</script>

</body>
</html>
