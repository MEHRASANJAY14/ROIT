<!DOCTYPE html>
<html>
<head>
<title>Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:rgba(255,255,255,0.08);
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

/* BUTTON */
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:600;
  cursor:pointer;
}

.present{
  background:linear-gradient(135deg,#00c853,#00e676);
}

.leave{
  background:linear-gradient(135deg,#ff3d00,#ff7043);
}

/* FORM */
.form-group{
  margin-bottom:12px;
}

label{
  font-size:12px;
  opacity:0.8;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:5px;
}

/* STAFF */
.staffCard{
  background:#fff;
  color:#000;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}

/* LOADER */
#loader{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  font-size:18px;
  z-index:999;
}

.hidden{display:none;}

</style>
</head>

<body>

<div id="loader">⏳ Processing...</div>

<div class="header">
  <button onclick="goBack()">⬅</button>
  <b id="welcome">Loading...</b>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">
  Today: <b id="today">--</b><br>
  Present: <b id="present">0</b><br>
  Leave: <b id="leave">0</b>
</div>

<div class="card">
  <button class="btn present" onclick="mark()">✔ Mark Attendance</button>
  <button class="btn leave" onclick="toggleLeave()">➕ Apply Leave</button>
  <button id="adminBtn" class="btn hidden" style="background:#2979ff;">👑 Staff Attendance</button>
</div>

<!-- LEAVE FORM -->
<div id="leaveBox" class="card hidden">
  <h3>📄 Apply Leave</h3>

  <div class="form-group">
    <label>From Date</label>
    <input type="date" id="from">
  </div>

  <div class="form-group">
    <label>To Date</label>
    <input type="date" id="to">
  </div>

  <div class="form-group">
    <label>Leave Type</label>
    <select id="type">
      <option value="">Select Leave Type</option>
      <option>CL</option>
      <option>PL</option>
      <option>MEDICAL</option>
      <option>UCL</option>
    </select>
  </div>

  <button class="btn leave" onclick="submitLeave()">Submit Leave</button>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="card hidden">
  <input id="search" placeholder="🔍 Search staff">
  <div id="staffList"></div>
</div>

<p id="msg"></p>

</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbzwZiRF2QF96MrX0wGFySzZ7IJqtzT354DNq1YZS4lPdg_gqKMk8OjQJqmE7W4PP401PA/exec";

let staffId=localStorage.getItem("staffId");
let isAdmin=(staffId==="N07550");
let selectedStaff=staffId;

// LOAD
function load(){
fetch(URL,{
method:"POST",
body:JSON.stringify({
action:"dashboard",
staff_id:isAdmin?"ALL":staffId
})
})
.then(r=>r.json())
.then(d=>{
welcome.innerText=d.name+" ("+staffId+")"+(isAdmin?" [ADMIN]":"");
today.innerText=d.today;
present.innerText=d.present;
leave.innerText=d.leave;

if(isAdmin){
adminBtn.classList.remove("hidden");
}
});
}

// MARK
function mark(){
toggle(true);

navigator.geolocation.getCurrentPosition(pos=>{
fetch(URL,{
method:"POST",
body:JSON.stringify({
staff_id:selectedStaff,
status:"Present",
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);
showMsg("✔ Attendance Marked");
load();
});
});
}

// LEAVE
function toggleLeave(){
document.getElementById("leaveBox").classList.toggle("hidden");
}

function submitLeave(){
toggle(true);

fetch(URL,{
method:"POST",
body:JSON.stringify({
staff_id:selectedStaff,
status:"Leave",
leave_type:document.getElementById("type").value,
from_date:document.getElementById("from").value,
to_date:document.getElementById("to").value
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);
showMsg("✔ Leave Applied");
document.getElementById("leaveBox").classList.add("hidden");
load();
});
}

// ADMIN
adminBtn.onclick=()=>{
adminPanel.classList.toggle("hidden");
loadStaff();
};

function loadStaff(){
fetch(URL,{
method:"POST",
body:JSON.stringify({action:"staff_list"})
})
.then(r=>r.json())
.then(d=>{
let html="";
d.staff.forEach(s=>{
html+=`
<div class="staffCard" data-name="${s.name.toLowerCase()}">
<b>${s.name}</b> (${s.staff_id})<br>
<button class="btn present" onclick="markStaff('${s.staff_id}')">Present</button>
<button class="btn leave" onclick="openLeave('${s.staff_id}')">Leave</button>
</div>`;
});
staffList.innerHTML=html;
});
}

function markStaff(id){
selectedStaff=id;
mark();
}

function openLeave(id){
selectedStaff=id;
toggleLeave();
}

// SEARCH
document.addEventListener("input",e=>{
if(e.target.id==="search"){
let val=e.target.value.toLowerCase();
document.querySelectorAll(".staffCard").forEach(c=>{
c.style.display=c.dataset.name.includes(val)?"block":"none";
});
}
});

// HELPERS
function toggle(x){
loader.style.display=x?"flex":"none";
}

function showMsg(t){
msg.innerText=t;
}

function logout(){
localStorage.clear();
location="index.html";
}

function goBack(){
history.back();
}

load();

</script>

</body>
</html>
