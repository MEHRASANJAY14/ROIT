<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f9}
.header{background:#006633;color:#fff;padding:15px;text-align:center}
.box{padding:15px;max-width:420px;margin:auto}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:8px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:6px}
.present{background:#006633;color:#fff}
.leave{background:#ff9800;color:#fff}
.hidden{display:none}
</style>
</head>

<body>

<div class="header">
<h3 id="welcome">Loading...</h3>
</div>

<div class="box">

<div class="card">Today: <b id="today">--</b></div>

<div class="card">
Present: <b id="p">0</b><br>
Leave: <b id="l">0</b>
</div>

<div class="card">
<button class="present" onclick="mark()">Mark Attendance</button>
<button class="leave" onclick="showLeave()">Apply Leave</button>
</div>

<div id="leaveBox" class="card hidden">
<input type="date" id="from">
<input type="date" id="to">
<select id="type">
<option value="">Select</option>
<option>PL</option>
<option>CL</option>
<option>MEDICAL</option>
<option>MATERNITY</option>
<option>PATERNITY</option>
<option>UCL</option>
</select>
<button class="leave" onclick="applyLeave()">Submit Leave</button>
</div>

<p id="msg"></p>

</div>

<script>

const URL = "YOUR_SCRIPT_URL";
let id = "N07550";

function load(){
  fetch(URL,{
    method:"POST",
    body:JSON.stringify({action:"dashboard", staff_id:id})
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("welcome").innerText =
      "Hello " + (d.name || "User") + " ("+id+")";

    document.getElementById("today").innerText = d.today;
    document.getElementById("p").innerText = d.present;
    document.getElementById("l").innerText = d.leave;
  });
}

function mark(){
  document.getElementById("msg").innerText="Processing...";
  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:id,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      document.getElementById("msg").innerText=d.message;
      load();
    });
  });
}

function showLeave(){
  let t=new Date(); t.setDate(t.getDate()+1);
  let d=t.toISOString().split("T")[0];
  document.getElementById("leaveBox").classList.remove("hidden");
  document.getElementById("from").value=d;
  document.getElementById("to").value=d;
}

function applyLeave(){
  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:id,
        status:"Leave",
        leave_type:document.getElementById("type").value,
        from_date:document.getElementById("from").value,
        to_date:document.getElementById("to").value,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      document.getElementById("msg").innerText=d.message;
      document.getElementById("leaveBox").classList.add("hidden");
      load();
    });
  });
}

load();

</script>
</body>
</html>
