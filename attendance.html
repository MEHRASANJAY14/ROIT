<script>

const URL="https://script.google.com/macros/s/AKfycbzwZiRF2QF96MrX0wGFySzZ7IJqtzT354DNq1YZS4lPdg_gqKMk8OjQJqmE7W4PP401PA/exec";

let staffId=localStorage.getItem("staffId");
let isAdmin=(staffId==="N07550");
let selectedStaff=staffId;

// RESET NEXT DAY
let last=localStorage.getItem("markDate");
let today=new Date().toDateString();
if(last && last!==today){
localStorage.removeItem("markDate");
enableButtons();
}

// ================= LOAD (GET FIX) =================
function load(){

let url = URL + "?action=dashboard&staff_id=" + (isAdmin ? "ALL" : staffId);

fetch(url)
.then(res => res.json())
.then(d => {

console.log("DATA:", d);

if(!d || d.status!=="success"){
showMsg("❌ Server Error");
return;
}

welcome.innerText=(d.name||"User")+" ("+staffId+")";
todayText.innerText=d.today || "--";

if(isAdmin && d.self){

userKPI.style.display="none";
adminKPI.style.display="flex";

selfP.innerText=d.self.present || 0;
selfL.innerText=d.self.leave || 0;
staffP.innerText=d.staff.present || 0;
staffL.innerText=d.staff.leave || 0;

adminBtn.classList.remove("hidden");

}else{

present.innerText=d.present || 0;
leave.innerText=d.leave || 0;

}

if(d.today && (d.today.includes("Present")||d.today.includes("Leave"))){
disableButtons();
}

})
.catch(err=>{
console.log("ERROR:", err);
showMsg("❌ Network Error");
});

}

// ================= BUTTON CONTROL =================
function disableButtons(){
markBtn.disabled=true;
leaveBtn.disabled=true;
markBtn.style.opacity=0.5;
leaveBtn.style.opacity=0.5;
}
function enableButtons(){
markBtn.disabled=false;
leaveBtn.disabled=false;
markBtn.style.opacity=1;
leaveBtn.style.opacity=1;
}

// ================= MARK =================
function mark(){

toggle(true);

navigator.geolocation.getCurrentPosition(pos=>{

fetch(URL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
staff_id:selectedStaff,
status:"Present",
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);

if(d.status==="success"){
showMsg("✔ Attendance Marked");
disableButtons();
localStorage.setItem("markDate",new Date().toDateString());
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
disableButtons();
}

load();
});

});

}

// ================= LEAVE =================
function toggleLeave(){leaveBox.classList.toggle("hidden");}

function submitLeave(){

let f=from.value,t=to.value,ty=type.value;

if(!f||!t||!ty){
showMsg("⚠ Fill all fields");
return;
}

toggle(true);

navigator.geolocation.getCurrentPosition(pos=>{

fetch(URL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
staff_id:selectedStaff,
status:"Leave",
leave_type:ty,
from_date:f,
to_date:t,
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);

if(d.status==="success"){
showMsg("✔ Leave Applied");
disableButtons();
localStorage.setItem("markDate",new Date().toDateString());
leaveBox.classList.add("hidden");
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
disableButtons();
}

load();
});

});

}

// ================= CALENDAR =================
function openCalendar(){

calendarBox.classList.toggle("hidden");

fetch(URL + "?action=calendar&staff_id=" + staffId)
.then(r=>r.json())
.then(d=>{

let map={};
(d.data||[]).forEach(x=>map[x.date]=x.status);

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

let first=new Date(y,m,1).getDay();
let total=new Date(y,m+1,0).getDate();

let html="";

for(let i=0;i<first;i++) html+=`<div class="day empty"></div>`;

for(let i=1;i<=total;i++){
let ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");
let st=map[ds]||"Absent";

let cls="day";
if(st==="Present") cls+=" presentDay";
if(st==="Leave") cls+=" leaveDay";

html+=`<div class="${cls}">${i}<br>${st}</div>`;
}

calendarGrid.innerHTML=html;

})
.catch(()=>showMsg("❌ Network Error"));

}

// ================= HELPERS =================
function toggle(x){loader.style.display=x?"flex":"none";}
function showMsg(t){msg.innerText=t;}
function logout(){localStorage.clear();location="index.html";}
function goBack(){history.back();}

load();

</script>
