<!DOCTYPE html>
<html>
<head>
<title>Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
  color:#fff;
}
.header{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:rgba(255,255,255,0.1);
}
.container{max-width:420px;margin:auto;padding:15px;}
.card{
  background:rgba(255,255,255,0.08);
  padding:15px;
  border-radius:15px;
  margin-bottom:12px;
}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:8px;
  cursor:pointer;
}
.present{background:#00c853;}
.leave{background:#ff3d00;}
.staffCard{
  background:#fff;color:#000;padding:10px;
  border-radius:10px;margin-bottom:8px;
}
.hidden{display:none;}
.loader{text-align:center;display:none;}
input,select{
  width:100%;padding:10px;border-radius:8px;
  border:none;margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">
  <button onclick="goBack()">⬅</button>
  <span id="welcome">Loading...</span>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">
  Today: <b id="today">--</b><br>
  Present: <b id="present">0</b><br>
  Leave: <b id="leave">0</b>
</div>

<div class="card">
  <button class="btn present" onclick="mark()">✔ Mark</button>
  <button class="btn leave" onclick="toggleLeave()">Leave</button>
  <button id="adminBtn" class="btn hidden">👑 Staff</button>
</div>

<div id="leaveBox" class="card hidden">
  <input type="date" id="from">
  <input type="date" id="to">
  <select id="type">
    <option value="">Select</option>
    <option>CL</option>
    <option>PL</option>
  </select>
  <button class="btn leave" onclick="submitLeave()">Submit</button>
</div>

<div id="adminPanel" class="card hidden">
  <input id="search" placeholder="Search">
  <div id="staffList"></div>
</div>

<div id="loader" class="loader">⏳ Processing...</div>
<p id="msg"></p>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbzwZiRF2QF96MrX0wGFySzZ7IJqtzT354DNq1YZS4lPdg_gqKMk8OjQJqmE7W4PP401PA/exec";

let staffId = localStorage.getItem("staffId");
let isAdmin = (staffId==="N07550");
let selectedStaff = staffId;

// ================= LOAD =================
function load(){
  fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      action:"dashboard",
      staff_id:isAdmin?"ALL":staffId
    })
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("welcome").innerText =
      (d.name||"User")+" ("+staffId+")"+(isAdmin?" [ADMIN]":"");

    document.getElementById("today").innerText = d.today||"--";
    document.getElementById("present").innerText = d.present||0;
    document.getElementById("leave").innerText = d.leave||0;

    if(isAdmin){
      document.getElementById("adminBtn").classList.remove("hidden");
    }
  })
  .catch(()=>{
    document.getElementById("welcome").innerText="Error loading";
  });
}

// ================= MARK =================
function mark(){
  toggle(true);

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:selectedStaff,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      toggle(false);
      showMsg(d.message);
      load();
    })
    .catch(()=>{
      toggle(false);
      showMsg("Error");
    });
  });
}

// ================= LEAVE =================
function toggleLeave(){
  document.getElementById("leaveBox").classList.toggle("hidden");
}

function submitLeave(){
  toggle(true);

  let from = document.getElementById("from").value;
  let to = document.getElementById("to").value;
  let type = document.getElementById("type").value;

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:selectedStaff,
        status:"Leave",
        leave_type:type,
        from_date:from,
        to_date:to,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      toggle(false);
      showMsg(d.message);
      document.getElementById("leaveBox").classList.add("hidden");
      load();
    })
    .catch(()=>{
      toggle(false);
      showMsg("Error");
    });
  });
}

// ================= ADMIN =================
document.getElementById("adminBtn").onclick=function(){
  let p=document.getElementById("adminPanel");
  p.classList.toggle("hidden");
  loadStaff();
};

function loadStaff(){
  fetch(URL,{
    method:"POST",
    body:JSON.stringify({action:"staff_list"})
  })
  .then(r=>r.json())
  .then(d=>{
    let html="";
    d.staff.forEach(s=>{
      html+=`
      <div class="staffCard" data-name="${s.name.toLowerCase()}">
        <b>${s.name}</b> (${s.staff_id})<br>
        <button class="btn present" onclick="markStaff('${s.staff_id}')">Present</button>
        <button class="btn leave" onclick="openLeave('${s.staff_id}')">Leave</button>
      </div>`;
    });
    document.getElementById("staffList").innerHTML=html;
  });
}

function markStaff(id){
  selectedStaff=id;
  mark();
}

function openLeave(id){
  selectedStaff=id;
  toggleLeave();
}

// SEARCH
document.addEventListener("input",e=>{
  if(e.target.id==="search"){
    let val=e.target.value.toLowerCase();
    document.querySelectorAll(".staffCard").forEach(c=>{
      c.style.display = c.dataset.name.includes(val)?"block":"none";
    });
  }
});

// ================= HELPERS =================
function toggle(x){
  document.getElementById("loader").style.display = x?"block":"none";
}
function showMsg(t){
  document.getElementById("msg").innerText = t;
}
function logout(){
  localStorage.clear();
  window.location="index.html";
}
function goBack(){
  window.history.back();
}

load();

</script>

</body>
</html>
