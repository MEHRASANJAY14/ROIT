<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:#fff;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
    }

    .container{
      max-width:420px;
      margin:auto;
      padding:15px;
    }

    .card{
      background:rgba(255,255,255,0.1);
      border-radius:16px;
      padding:18px;
      margin-bottom:14px;
      backdrop-filter:blur(12px);
    }

    .grid{
      display:flex;
      gap:12px;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-weight:600;
      margin-top:10px;
      cursor:pointer;
    }

    .present{background:#00c853;color:white;}
    .leave{background:#ff3d00;color:white;}

    .hidden{display:none;}

    .staffCard{
      background:#fff;
      color:#000;
      padding:10px;
      border-radius:10px;
      margin-bottom:8px;
    }

    input{
      width:100%;
      padding:10px;
      border-radius:10px;
      border:none;
      margin-bottom:10px;
    }
  </style>
</head>

<body>

<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let staffId = localStorage.getItem("staffId");
  let time = localStorage.getItem("time");

  if(login !== "true" || !branch || !staffId){
    window.location.replace("index.html");
  }
})();
</script>

<div class="header">
  <h3 id="welcome">Loading...</h3>
  <div>
    <button onclick="goBack()">⬅</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <div>Today: <b id="today">--</b></div>
    <div>Present: <b id="present">0</b></div>
    <div>Leave: <b id="leave">0</b></div>
  </div>

  <div class="card">
    <button class="btn present" onclick="mark()">✔ Mark Attendance</button>
    <button class="btn leave" onclick="showLeave()">➕ Apply Leave</button>

    <!-- ADMIN LINK -->
    <button id="adminBtn" class="btn" style="background:#2196f3;color:white;display:none;">
      👑 Staff Attendance
    </button>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="card hidden">
    <input type="text" id="search" placeholder="Search staff...">
    <div id="staffList"></div>
  </div>

  <p id="msg"></p>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbzwZiRF2QF96MrX0wGFySzZ7IJqtzT354DNq1YZS4lPdg_gqKMk8OjQJqmE7W4PP401PA/exec";

let staffId = localStorage.getItem("staffId");
let isAdmin = (staffId === "N07550");

let markedToday = {};

// ================= LOAD =================
function load(){

  fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      action:"dashboard",
      staff_id: isAdmin ? "ALL" : staffId
    })
  })
  .then(r=>r.json())
  .then(d=>{

    document.getElementById("welcome").innerHTML =
      "👤 " + d.name + " ("+staffId+")" + (isAdmin?" [ADMIN]":"");

    document.getElementById("today").innerText = d.today;
    document.getElementById("present").innerText = d.present;
    document.getElementById("leave").innerText = d.leave;

    if(isAdmin){
      document.getElementById("adminBtn").style.display="block";
    }

  });
}

// ================= ADMIN BUTTON =================
document.getElementById("adminBtn").onclick = function(){
  document.getElementById("adminPanel").classList.toggle("hidden");
  loadStaff();
};

// ================= LOAD STAFF =================
function loadStaff(){

  fetch(URL,{
    method:"POST",
    body:JSON.stringify({ action:"staff_list" })
  })
  .then(r=>r.json())
  .then(d=>{

    let html="";

    d.staff.forEach(s=>{

      let disabled = markedToday[s.staff_id] ? "disabled" : "";

      html += `
      <div class="staffCard" data-name="${s.name.toLowerCase()}">
        <b>${s.name}</b> (${s.staff_id})<br>

        <button class="btn present" ${disabled}
        onclick="markStaff('${s.staff_id}','Present')">Present</button>

        <button class="btn leave" ${disabled}
        onclick="markStaff('${s.staff_id}','Leave')">Leave</button>
      </div>`;
    });

    document.getElementById("staffList").innerHTML = html;

  });
}

// ================= MARK SELF =================
function mark(){
  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:staffId,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      showMsg(d.message);
      load();
    });
  });
}

// ================= MARK STAFF =================
function markStaff(id, status){

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:id,
        status:status,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      showMsg(d.message);
      markedToday[id]=true;
      loadStaff();
    });
  });
}

// ================= SEARCH =================
document.addEventListener("input", function(e){
  if(e.target.id==="search"){
    let val = e.target.value.toLowerCase();

    document.querySelectorAll(".staffCard").forEach(c=>{
      let name = c.getAttribute("data-name");
      c.style.display = name.includes(val) ? "block":"none";
    });
  }
});

// ================= HELPERS =================
function showMsg(t){
  document.getElementById("msg").innerText = t;
}

function logout(){
  localStorage.clear();
  window.location.replace("index.html");
}

function goBack(){
  window.history.back();
}

load();

</script>

</body>
</html>
