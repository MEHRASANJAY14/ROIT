<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin:0;
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,#eef2f3,#dfe9f3);
    }

    .header {
      background:linear-gradient(135deg,#006633,#00a65a);
      color:white;
      padding:20px;
      border-bottom-left-radius:25px;
      border-bottom-right-radius:25px;
    }

    .container {
      padding:15px;
      max-width:420px;
      margin:auto;
    }

    .card {
      background:white;
      border-radius:15px;
      padding:18px;
      margin-bottom:12px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }

    .title { font-size:13px; color:#666; }
    .value { font-size:22px; font-weight:600; margin-top:5px; }

    .grid { display:flex; gap:10px; }

    .presentCard { background:#e8f5e9; color:#2e7d32; }
    .leaveCard { background:#fff3e0; color:#ef6c00; }

    .btn {
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      font-weight:600;
      cursor:pointer;
    }

    .present { background:#006633; color:white; }
    .leave { background:#ff9800; color:white; }

    .hidden { display:none; }

    input,select {
      width:100%;
      padding:12px;
      margin-top:5px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    .row { display:flex; gap:10px; }
    .col { flex:1; }

    #msg { text-align:center; margin-top:10px; }

  </style>
</head>

<body>

<div class="header">
  <h2 id="welcome">👋 Hello</h2>
  <div>Attendance Dashboard</div>
</div>

<div class="container">

  <!-- TODAY -->
  <div class="card">
    <div class="title">Today's Attendance</div>
    <div class="value" id="todayStatus">--</div>
  </div>

  <!-- MONTH -->
  <div class="grid">
    <div class="card presentCard">
      <div class="title">Present (Month)</div>
      <div class="value" id="presentCount">0</div>
    </div>

    <div class="card leaveCard">
      <div class="title">Leave (Month)</div>
      <div class="value" id="leaveCount">0</div>
    </div>
  </div>

  <!-- ACTION -->
  <div class="card">
    <button class="btn present" onclick="markAttendance()">Mark Attendance</button>
    <button class="btn leave" onclick="openLeave()">Apply Leave</button>
  </div>

  <!-- LEAVE PANEL -->
  <div class="card hidden" id="leaveSection">

    <label>From Date</label>
    <input type="date" id="from_date">

    <div class="row">
      <div class="col">
        <label>To Date</label>
        <input type="date" id="to_date">
      </div>

      <div class="col">
        <label>Leave Type</label>
        <select id="leave_type">
          <option value="">Select</option>
          <option value="PL">PL</option>
          <option value="CL">CL</option>
          <option value="MEDICAL">MEDICAL</option>
          <option value="MATERNITY">MATERNITY</option>
          <option value="PATERNITY">PATERNITY</option>
          <option value="UCL">UCL</option>
        </select>
      </div>
    </div>

    <button class="btn leave" onclick="submitLeave()">Submit Leave</button>

  </div>

  <p id="msg"></p>

</div>

<script>

const SCRIPT_URL = "YOUR_SCRIPT_URL";
let staffId = "N07550";

// LOAD DASHBOARD
function loadDashboard(){

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"dashboard",
      staff_id:staffId
    })
  })
  .then(res=>res.json())
  .then(res=>{

    document.getElementById("welcome").innerText =
      "👋 Hello " + res.name + " (" + staffId + ")";

    let todayEl = document.getElementById("todayStatus");
    todayEl.innerText = res.today || "Not Marked";

    if(res.today.includes("Present")) todayEl.style.color="green";
    else if(res.today.includes("Leave")) todayEl.style.color="orange";

    document.getElementById("presentCount").innerText = res.present;
    document.getElementById("leaveCount").innerText = res.leave;

  });

}

// MARK PRESENT
function markAttendance(){

  navigator.geolocation.getCurrentPosition(function(pos){

    fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:staffId,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{
      document.getElementById("msg").innerText = res.message;
      setTimeout(loadDashboard,500);
    });

  });

}

// OPEN LEAVE
function openLeave(){

  let today = new Date();
  let nextDay = new Date();
  nextDay.setDate(today.getDate()+1);

  let nextStr = nextDay.toISOString().split("T")[0];

  document.getElementById("leaveSection").classList.remove("hidden");
  document.getElementById("from_date").value = nextStr;
  document.getElementById("to_date").value = nextStr;

}

// SUBMIT LEAVE
function submitLeave(){

  navigator.geolocation.getCurrentPosition(function(pos){

    fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:staffId,
        status:"Leave",
        leave_type:document.getElementById("leave_type").value,
        from_date:document.getElementById("from_date").value,
        to_date:document.getElementById("to_date").value,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{
      document.getElementById("msg").innerText = res.message;
      document.getElementById("leaveSection").classList.add("hidden");
      setTimeout(loadDashboard,500);
    });

  });

}

loadDashboard();

</script>

</body>
</html>
