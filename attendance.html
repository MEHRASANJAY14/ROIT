<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: Arial; text-align: center; padding: 20px; background: #f5f5f5; }
    .box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
    input, select, button { width: 90%; padding: 12px; margin: 10px; font-size: 16px; }
    button { background: #006633; color: white; border: none; }
  </style>
</head>

<body>

<div class="box">

<h2>📍 Attendance System</h2>

<p><b>Staff ID:</b> N07550</p>

<select id="status">
  <option value="Present">Present</option>
  <option value="Leave">Leave</option>
</select>

<!-- Leave Section -->
<div id="leave_section" style="display:none;">

  <select id="leave_type">
    <option value="">Select Leave Type</option>
    <option value="PL">PL</option>
    <option value="CL">CL</option>
    <option value="MATERNITY">MATERNITY</option>
    <option value="JOINING">JOINING</option>
    <option value="PATERNITY">PATERNITY</option>
    <option value="UCL">UCL</option>
    <option value="MEDICAL">MEDICAL</option>
  </select>

  <input type="date" id="from_date">
  <input type="date" id="to_date">

</div>

<button onclick="markAttendance()">Submit</button>

<p id="msg"></p>

</div>

<script>

const SCRIPT_URL = "YOUR_SCRIPT_URL";

document.getElementById("status").addEventListener("change", function() {
  document.getElementById("leave_section").style.display =
    this.value === "Leave" ? "block" : "none";
});

function markAttendance() {

  let status = document.getElementById("status").value;

  let leaveType = document.getElementById("leave_type").value;
  let fromDate = document.getElementById("from_date").value;
  let toDate = document.getElementById("to_date").value;

  if(status === "Leave"){
    if(!leaveType || !fromDate || !toDate){
      alert("Select Leave Type and Dates");
      return;
    }
  }

  navigator.geolocation.getCurrentPosition(function(position){

    const data = {
      staff_id: "N07550",
      status: status,
      lat: position.coords.latitude,
      lng: position.coords.longitude,
      leave_type: leaveType,
      from_date: fromDate,
      to_date: toDate
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
      document.getElementById("msg").innerText =
        res.status === "success"
        ? "✅ Attendance Marked"
        : "❌ " + res.message;
    });

  });

}

</script>

</body>
</html>
