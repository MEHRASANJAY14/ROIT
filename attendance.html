<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    button {
      width: 90%;
      padding: 12px;
      margin: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      background: #006633;
      color: white;
      font-weight: bold;
    }

    select {
      width: 90%;
      padding: 12px;
      margin: 10px;
      font-size: 16px;
      border-radius: 5px;
    }

    #msg {
      margin-top: 15px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📍 Attendance System</h2>

  <p><b>Staff ID:</b> N07550</p>

  <select id="status">
    <option value="Present">Present</option>
    <option value="Leave">Leave</option>
  </select>

  <button onclick="markAttendance()">Submit</button>

  <p id="msg"></p>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRYZ4N0AZwHHwbh30JpTEovFzgJOgItmbpnWDKTvBKMg5GkqiyHtWXYq7U4-8WrdnAtw/exec";

function markAttendance() {

  const staffId = "N07550";

  if (!navigator.geolocation) {
    document.getElementById("msg").innerText = "❌ GPS not supported on this device";
    return;
  }

  document.getElementById("msg").innerText = "📍 Getting location... Please wait";

  navigator.geolocation.getCurrentPosition(

    // ✅ SUCCESS
    function(position) {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      const data = {
        staff_id: staffId,
        status: document.getElementById("status").value,
        lat: lat,
        lng: lng
      };

      document.getElementById("msg").innerText = "📡 Sending data...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(res => {

        if(res.status === "success"){
          document.getElementById("msg").innerText = "✅ Attendance Marked Successfully";
        } else {
          document.getElementById("msg").innerText = "❌ " + res.message;
        }

      })
      .catch(error => {
        document.getElementById("msg").innerText = "❌ Server Error (Check Script URL)";
      });

    },

    // ❌ ERROR HANDLER
    function(error) {

      let msg = "";

      switch(error.code) {
        case error.PERMISSION_DENIED:
          msg = "❌ Location permission denied. Please allow GPS.";
          break;

        case error.POSITION_UNAVAILABLE:
          msg = "❌ Location unavailable. Try moving outside.";
          break;

        case error.TIMEOUT:
          msg = "❌ Location timeout. Try again.";
          break;

        default:
          msg = "❌ Unknown GPS error.";
      }

      document.getElementById("msg").innerText = msg;
    },

    // ⚙️ OPTIONS
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}

</script>

</body>
</html>
