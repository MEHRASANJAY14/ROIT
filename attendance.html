<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin:0;
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,#edf2f7,#e2e8f0);
    }

    .header {
      background:linear-gradient(135deg,#004d26,#00a65a);
      color:white;
      padding:18px;
      border-bottom-left-radius:25px;
      border-bottom-right-radius:25px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .header h3 { margin:0; font-size:16px; }

    .logout {
      background:#fff;
      color:#006633;
      border:none;
      padding:6px 10px;
      border-radius:8px;
      font-size:12px;
      cursor:pointer;
    }

    .container {
      max-width:420px;
      margin:auto;
      padding:15px;
    }

    .card {
      background:white;
      border-radius:16px;
      padding:18px;
      margin-bottom:14px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
    }

    .title { font-size:12px; color:#888; }
    .value { font-size:22px; font-weight:600; margin-top:6px; }

    .grid { display:flex; gap:12px; }

    .presentCard {
      background:linear-gradient(135deg,#e6f4ea,#d1fadf);
      color:#1b5e20;
    }

    .leaveCard {
      background:linear-gradient(135deg,#fff4e5,#ffe0b2);
      color:#e65100;
    }

    .btn {
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-weight:600;
      margin-top:10px;
      cursor:pointer;
    }

    .present {
      background:linear-gradient(135deg,#006633,#00a65a);
      color:white;
    }

    .leave {
      background:linear-gradient(135deg,#ff9800,#ff5722);
      color:white;
    }

    .hidden { display:none; }

    #msg { text-align:center; margin-top:12px; font-size:14px; }

    .loader { display:none; text-align:center; margin-top:10px; }

  </style>
</head>

<body>

<!-- ✅ LOGIN CHECK -->
<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let staffId = localStorage.getItem("staffId");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  if(login !== "true" || !branch || !staffId){
    window.location.replace("index.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }
})();
</script>

<div class="header">
  <h3 id="welcome">Loading...</h3>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

  <div class="card">
    <div class="title">Today's Attendance</div>
    <div class="value" id="today">--</div>
  </div>

  <div class="grid">
    <div class="card presentCard">
      <div class="title">Present</div>
      <div class="value" id="present">0</div>
    </div>

    <div class="card leaveCard">
      <div class="title">Leave</div>
      <div class="value" id="leave">0</div>
    </div>
  </div>

  <div class="card">
    <button class="btn present" onclick="mark()">✔ Mark Attendance</button>
    <button class="btn leave" onclick="showLeave()">➕ Apply Leave</button>
  </div>

  <div id="leaveBox" class="card hidden">
    <input type="date" id="from"><br><br>
    <input type="date" id="to"><br><br>

    <select id="type">
      <option value="">Select Leave</option>
      <option>PL</option>
      <option>CL</option>
      <option>MEDICAL</option>
    </select>

    <button class="btn leave" onclick="applyLeave()">Submit</button>
  </div>

  <div class="loader" id="loader">Processing...</div>
  <p id="msg"></p>

</div>

<script>

const URL = "YOUR_APPS_SCRIPT_URL";

// ✅ Dynamic Login
let staffId = localStorage.getItem("staffId");
let branch = localStorage.getItem("branch");
let isAdmin = (staffId === "N07550");

// LOAD DASHBOARD
function load(){
  fetch(URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain" },
    body:JSON.stringify({
      action:"dashboard",
      staff_id: isAdmin ? "ALL" : staffId
    })
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("welcome").innerText =
      "👋 " + (d.name || "User") + " (" + staffId + ")" + (isAdmin ? " [ADMIN]" : "");

    document.getElementById("today").innerText = d.today;
    document.getElementById("present").innerText = d.present;
    document.getElementById("leave").innerText = d.leave;
  });
}

// MARK ATTENDANCE
function mark(){
  toggle(true);

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain" },
      body:JSON.stringify({
        staff_id:staffId,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      showMsg(d.message);
      toggle(false);
      load();
    });
  });
}

// SHOW LEAVE
function showLeave(){
  document.getElementById("leaveBox").classList.remove("hidden");
}

// APPLY LEAVE
function applyLeave(){
  toggle(true);

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain" },
      body:JSON.stringify({
        staff_id:staffId,
        status:"Leave",
        leave_type:document.getElementById("type").value,
        from_date:document.getElementById("from").value,
        to_date:document.getElementById("to").value,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      showMsg(d.message);
      toggle(false);
      document.getElementById("leaveBox").classList.add("hidden");
      load();
    });
  });
}

// HELPERS
function toggle(x){
  document.getElementById("loader").style.display = x?"block":"none";
}

function showMsg(t){
  document.getElementById("msg").innerText = t;
}

// LOGOUT
function logout(){
  localStorage.clear();
  window.location.replace("index.html");
}

// INIT
load();

</script>

</body>
</html>
