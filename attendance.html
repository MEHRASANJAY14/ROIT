<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin:0;
      font-family:'Poppins',sans-serif;
      background: linear-gradient(135deg,#141e30,#243b55);
      color:white;
    }

    .header {
      padding:20px;
    }

    .header h2 {
      margin:0;
      font-weight:600;
    }

    .sub {
      font-size:13px;
      color:#ccc;
    }

    .container {
      padding:15px;
    }

    /* Cards */
    .cards {
      display:flex;
      gap:10px;
      margin-top:15px;
    }

    .card {
      flex:1;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius:15px;
      padding:15px;
      text-align:center;
    }

    .card h3 {
      margin:5px 0;
      font-size:20px;
    }

    .card p {
      font-size:12px;
      color:#ddd;
    }

    /* Actions */
    .actions {
      margin-top:25px;
    }

    .btn {
      width:100%;
      padding:15px;
      margin-top:12px;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.2s;
    }

    .present {
      background:linear-gradient(135deg,#00c853,#64dd17);
      color:white;
    }

    .leave {
      background:linear-gradient(135deg,#ff9800,#ff5722);
      color:white;
    }

    .logout {
      background:#e53935;
      color:white;
      margin-top:20px;
    }

    .btn:hover {
      transform:translateY(-2px);
      box-shadow:0 5px 15px rgba(0,0,0,0.3);
    }

    #msg {
      margin-top:10px;
      font-size:14px;
    }

  </style>
</head>

<body>

<div class="header">
  <h2>👋 Welcome</h2>
  <div class="sub" id="user"></div>
</div>

<div class="container">

  <!-- STATS -->
  <div class="cards">
    <div class="card">
      <h3 id="presentCount">--</h3>
      <p>Present Days</p>
    </div>

    <div class="card">
      <h3 id="leaveCount">--</h3>
      <p>Leave Days</p>
    </div>

    <div class="card">
      <h3 id="monthCount">--</h3>
      <p>This Month</p>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">

    <button class="btn present" onclick="markAttendance('Present')">
      ✅ Mark Present
    </button>

    <button class="btn leave" onclick="goToLeave()">
      📝 Apply Leave
    </button>

    <button class="btn logout" onclick="logout()">
      🚪 Logout
    </button>

  </div>

  <p id="msg"></p>

</div>

<script>

const SCRIPT_URL = "YOUR_SCRIPT_URL";

let staffId = localStorage.getItem("staff_id") || "N07550";

document.getElementById("user").innerText = "Staff ID: " + staffId;

// 🚀 Mark Attendance
function markAttendance(status){

  navigator.geolocation.getCurrentPosition(function(pos){

    fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:staffId,
        status:status,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{
      document.getElementById("msg").innerText =
        res.status==="success"
        ? "✅ Attendance Marked"
        : "❌ " + res.message;
    });

  });

}

// 🔁 Navigation
function goToLeave(){
  window.location.href="index.html";
}

function logout(){
  localStorage.clear();
  window.location.href="login.html";
}

</script>

</body>
</html>
