<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin:0;
      font-family:'Poppins',sans-serif;
      background: radial-gradient(circle at top,#1f4037,#0f2027);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:#fff;
    }

    .container {
      width:100%;
      max-width:380px;
      padding:15px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      border-radius:20px;
      padding:25px;
      box-shadow:0 20px 60px rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.1);
    }

    h2 {
      text-align:center;
      margin:0;
      font-weight:600;
    }

    .subtitle {
      text-align:center;
      font-size:13px;
      color:#ccc;
      margin-bottom:20px;
    }

    .field {
      position:relative;
      margin-top:18px;
    }

    .field input, .field select {
      width:100%;
      padding:14px;
      border-radius:12px;
      border:none;
      background:rgba(255,255,255,0.12);
      color:#fff;
      font-size:15px;
      outline:none;
    }

    .field label {
      position:absolute;
      left:12px;
      top:12px;
      font-size:13px;
      color:#bbb;
      transition:0.2s;
      pointer-events:none;
    }

    .field input:focus + label,
    .field input:not(:placeholder-shown) + label,
    .field select:focus + label {
      top:-8px;
      font-size:11px;
      color:#00e5ff;
      background:#0f2027;
      padding:2px 6px;
      border-radius:5px;
    }

    .row {
      display:flex;
      gap:10px;
    }

    .col { flex:1; }

    .hidden { display:none; }

    button {
      width:100%;
      padding:15px;
      margin-top:25px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#00e5ff,#2979ff);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover {
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(0,0,0,0.4);
    }

    .loading {
      opacity:0.7;
      pointer-events:none;
    }

    #msg {
      text-align:center;
      margin-top:12px;
      font-size:14px;
    }

  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h2>📍 Attendance</h2>
    <div class="subtitle">Staff ID: N07550</div>

    <!-- STATUS -->
    <div class="field">
      <select id="status">
        <option value="Present">Present</option>
        <option value="Leave">Leave</option>
      </select>
      <label>Status</label>
    </div>

    <!-- LEAVE -->
    <div id="leaveSection" class="hidden">

      <div class="field">
        <input type="date" id="from_date" placeholder=" ">
        <label>From Date</label>
      </div>

      <div class="row">

        <div class="col">
          <div class="field">
            <input type="date" id="to_date" placeholder=" ">
            <label>To Date</label>
          </div>
        </div>

        <div class="col">
          <div class="field">
            <select id="leave_type">
              <option value=""></option>
              <option value="PL">PL</option>
              <option value="CL">CL</option>
              <option value="MEDICAL">MEDICAL</option>
            </select>
            <label>Leave Type</label>
          </div>
        </div>

      </div>

    </div>

    <button id="btn" onclick="markAttendance()">Submit</button>

    <p id="msg"></p>

  </div>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRYZ4N0AZwHHwbh30JpTEovFzgJOgItmbpnWDKTvBKMg5GkqiyHtWXYq7U4-8WrdnAtw/exec";

document.getElementById("status").addEventListener("change", function() {
  document.getElementById("leaveSection")
    .classList.toggle("hidden", this.value !== "Leave");
});

// auto TO date
document.getElementById("from_date").addEventListener("change", function(){
  document.getElementById("to_date").value = this.value;
});

function markAttendance(){

  let btn = document.getElementById("btn");
  btn.classList.add("loading");
  btn.innerText = "Processing...";

  const status = document.getElementById("status").value;
  const leaveType = document.getElementById("leave_type").value;
  const fromDate = document.getElementById("from_date").value;
  const toDate = document.getElementById("to_date").value;

  if(status === "Leave"){
    if(!leaveType || !fromDate || !toDate){
      alert("Fill leave details");
      resetBtn();
      return;
    }
  }

  navigator.geolocation.getCurrentPosition(function(pos){

    fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:"N07550",
        status:status,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude,
        leave_type:leaveType,
        from_date:fromDate,
        to_date:toDate
      })
    })
    .then(res=>res.json())
    .then(res=>{
      document.getElementById("msg").innerText =
        res.status==="success"
        ? "✅ Done"
        : "❌ "+res.message;
      resetBtn();
    })
    .catch(()=>{
      document.getElementById("msg").innerText="❌ Server error";
      resetBtn();
    });

  });

}

function resetBtn(){
  let btn = document.getElementById("btn");
  btn.classList.remove("loading");
  btn.innerText = "Submit";
}

</script>

</body>
</html>
