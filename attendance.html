<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { margin:0; font-family:Arial; background:#f4f6f9; }

    .header {
      background:linear-gradient(135deg,#006633,#00a65a);
      color:white;
      padding:20px;
    }

    .container { padding:15px; max-width:420px; margin:auto; }

    .card {
      background:white;
      padding:15px;
      margin-bottom:10px;
      border-radius:10px;
    }

    .grid { display:flex; gap:10px; }

    .btn {
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:6px;
    }

    .present { background:#006633; color:white; }
    .leave { background:#ff9800; color:white; }

    input,select { width:100%; padding:10px; margin-top:5px; }

    .hidden { display:none; }

  </style>
</head>

<body>

<div class="header">
  <h3 id="welcome">Hello</h3>
</div>

<div class="container">

<div class="card">
  Today: <b id="todayStatus">--</b>
</div>

<div class="grid">
  <div class="card">Present: <b id="presentCount">0</b></div>
  <div class="card">Leave: <b id="leaveCount">0</b></div>
</div>

<div class="card">
  <button id="btnPresent" class="btn present" onclick="markAttendance()">Mark Attendance</button>
  <button class="btn leave" onclick="openLeave()">Apply Leave</button>
</div>

<div class="card hidden" id="leaveSection">

  <label>From Date</label>
  <input type="date" id="from_date">

  <label>To Date</label>
  <input type="date" id="to_date">

  <label>Leave Type</label>
  <select id="leave_type">
    <option value="">Select</option>
    <option value="PL">PL</option>
    <option value="CL">CL</option>
    <option value="MEDICAL">MEDICAL</option>
    <option value="MATERNITY">MATERNITY</option>
    <option value="PATERNITY">PATERNITY</option>
    <option value="UCL">UCL</option>
  </select>

  <button class="btn leave" onclick="submitLeave()">Submit Leave</button>

</div>

<p id="msg"></p>

</div>

<script>

const SCRIPT_URL = "YOUR_SCRIPT_URL";
let staffId = "N07550"; // change if needed

function loadDashboard(){

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"dashboard",
      staff_id:staffId
    })
  })
  .then(res=>res.json())
  .then(res=>{

    document.getElementById("welcome").innerText =
      "Hello " + (res.name || "User") + " (" + staffId + ")";

    document.getElementById("todayStatus").innerText = res.today;
    document.getElementById("presentCount").innerText = res.present;
    document.getElementById("leaveCount").innerText = res.leave;

  });

}

function markAttendance(){

  let btn = document.getElementById("btnPresent");
  let msg = document.getElementById("msg");

  btn.disabled = true;
  btn.innerText = "Processing...";
  msg.innerText = "Getting location...";

  navigator.geolocation.getCurrentPosition(function(pos){

    fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:staffId,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{
      msg.innerText = res.message;
      btn.disabled = false;
      btn.innerText = "Mark Attendance";
      loadDashboard();
    });

  }, function(){
    msg.innerText = "Location permission denied";
    btn.disabled = false;
    btn.innerText = "Mark Attendance";
  });

}

function openLeave(){

  let today = new Date();
  let next = new Date();
  next.setDate(today.getDate()+1);

  let nextStr = next.toISOString().split("T")[0];

  document.getElementById("leaveSection").classList.remove("hidden");

  document.getElementById("from_date").value = nextStr;
  document.getElementById("to_date").value = nextStr;
}

function submitLeave(){

  navigator.geolocation.getCurrentPosition(function(pos){

    fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:staffId,
        status:"Leave",
        leave_type:document.getElementById("leave_type").value,
        from_date:document.getElementById("from_date").value,
        to_date:document.getElementById("to_date").value,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{
      document.getElementById("msg").innerText = res.message;
      document.getElementById("leaveSection").classList.add("hidden");
      loadDashboard();
    });

  });

}

loadDashboard();

</script>

</body>
</html>
