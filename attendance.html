<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin:0;
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,#edf2f7,#e2e8f0);
    }

    .header {
      background:linear-gradient(135deg,#004d26,#00a65a);
      color:white;
      padding:22px;
      border-bottom-left-radius:25px;
      border-bottom-right-radius:25px;
      box-shadow:0 6px 18px rgba(0,0,0,0.1);
    }

    .header h3 { margin:0; font-size:18px; }

    .container {
      max-width:420px;
      margin:auto;
      padding:15px;
    }

    .card {
      background:white;
      border-radius:16px;
      padding:18px;
      margin-bottom:14px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
    }

    .title {
      font-size:12px;
      color:#888;
    }

    .value {
      font-size:22px;
      font-weight:600;
      margin-top:6px;
    }

    .grid {
      display:flex;
      gap:12px;
    }

    .presentCard {
      background:linear-gradient(135deg,#e6f4ea,#d1fadf);
      color:#1b5e20;
    }

    .leaveCard {
      background:linear-gradient(135deg,#fff4e5,#ffe0b2);
      color:#e65100;
    }

    .btn {
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-weight:600;
      margin-top:10px;
      cursor:pointer;
      transition:0.2s;
    }

    .btn:active { transform:scale(0.97); }

    .present {
      background:linear-gradient(135deg,#006633,#00a65a);
      color:white;
    }

    .leave {
      background:linear-gradient(135deg,#ff9800,#ff5722);
      color:white;
    }

    .hidden { display:none; }

    #msg {
      text-align:center;
      margin-top:12px;
      font-size:14px;
      font-weight:500;
    }

    /* LEAVE UI */
    .leave-box { padding:0; overflow:hidden; }

    .leave-header {
      background:linear-gradient(135deg,#ff9800,#ff5722);
      color:white;
      padding:14px;
      font-weight:600;
    }

    .leave-body {
      padding:15px;
    }

    .field {
      margin-bottom:12px;
    }

    .field label {
      font-size:12px;
      color:#777;
      display:block;
      margin-bottom:4px;
    }

    input,select {
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      background:#fafafa;
      font-size:14px;
    }

    .row {
      display:flex;
      gap:10px;
    }

    .col { flex:1; }

    .loader {
      display:none;
      text-align:center;
      margin-top:10px;
      color:#666;
    }

  </style>
</head>

<body>

<div class="header">
  <h3 id="welcome">Loading...</h3>
</div>

<div class="container">

  <!-- TODAY -->
  <div class="card">
    <div class="title">Today's Attendance</div>
    <div class="value" id="today">--</div>
  </div>

  <!-- MONTH -->
  <div class="grid">
    <div class="card presentCard">
      <div class="title">Present</div>
      <div class="value" id="present">0</div>
    </div>

    <div class="card leaveCard">
      <div class="title">Leave</div>
      <div class="value" id="leave">0</div>
    </div>
  </div>

  <!-- ACTION -->
  <div class="card">
    <button id="btnPresent" class="btn present" onclick="mark()">✔ Mark Attendance</button>
    <button class="btn leave" onclick="showLeave()">➕ Apply Leave</button>
  </div>

  <!-- LEAVE -->
  <div id="leaveBox" class="card leave-box hidden">

    <div class="leave-header">Apply Leave</div>

    <div class="leave-body">

      <div class="field">
        <label>From Date</label>
        <input type="date" id="from">
      </div>

      <div class="row">

        <div class="field col">
          <label>To Date</label>
          <input type="date" id="to">
        </div>

        <div class="field col">
          <label>Leave Type</label>
          <select id="type">
            <option value="">Select</option>
            <option>PL</option>
            <option>CL</option>
            <option>MEDICAL</option>
            <option>MATERNITY</option>
            <option>PATERNITY</option>
            <option>UCL</option>
          </select>
        </div>

      </div>

      <button class="btn leave" onclick="applyLeave()">Submit Leave</button>

    </div>

  </div>

  <div class="loader" id="loader">Processing...</div>
  <p id="msg"></p>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbwRYZ4N0AZwHHwbh30JpTEovFzgJOgItmbpnWDKTvBKMg5GkqiyHtWXYq7U4-8WrdnAtw/exec";
let staffId = "N07550";

// LOAD
function load(){
  fetch(URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain" },
    body:JSON.stringify({action:"dashboard", staff_id:staffId})
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("welcome").innerText =
      "👋 Hello " + (d.name || "User") + " ("+staffId+")";

    document.getElementById("today").innerText = d.today;
    document.getElementById("present").innerText = d.present;
    document.getElementById("leave").innerText = d.leave;
  });
}

// MARK
function mark(){
  toggle(true);
  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain" },
      body:JSON.stringify({
        staff_id:staffId,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      showMsg(d.message);
      toggle(false);
      load();
    });
  });
}

// LEAVE OPEN
function showLeave(){
  let t=new Date(); t.setDate(t.getDate()+1);
  let d=t.toISOString().split("T")[0];
  document.getElementById("leaveBox").classList.remove("hidden");
  document.getElementById("from").value=d;
  document.getElementById("to").value=d;
}

// APPLY LEAVE
function applyLeave(){
  toggle(true);
  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain" },
      body:JSON.stringify({
        staff_id:staffId,
        status:"Leave",
        leave_type:document.getElementById("type").value,
        from_date:document.getElementById("from").value,
        to_date:document.getElementById("to").value,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      showMsg(d.message);
      toggle(false);
      document.getElementById("leaveBox").classList.add("hidden");
      load();
    });
  });
}

// HELPERS
function toggle(x){
  document.getElementById("loader").style.display = x?"block":"none";
}
function showMsg(t){
  document.getElementById("msg").innerText = t;
}

document.addEventListener("change", e=>{
  if(e.target.id==="from"){
    document.getElementById("to").value=e.target.value;
  }
});

load();

</script>

</body>
</html>
