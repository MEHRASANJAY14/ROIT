<!DOCTYPE html>
<html>
<head>
<title>Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:rgba(255,255,255,0.08);
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:600;
  cursor:pointer;
}

.present{background:#00c853;}
.leave{background:#ff3d00;}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:5px;
}

.staffCard{
  background:#fff;
  color:#000;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}

#loader{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:999;
}

/* FORM */
.form-row{
  display:flex;
  gap:10px;
}
.form-group{
  flex:1;
}
@media(max-width:480px){
  .form-row{flex-direction:column;}
}

.hidden{display:none;}
</style>
</head>

<body>

<div id="loader">⏳ Processing...</div>

<div class="header">
  <button onclick="goBack()">⬅</button>
  <b id="welcome">Loading...</b>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

<!-- TODAY -->
<div class="card">
  <b>Today:</b> <span id="todayText">--</span>
</div>

<!-- KPI -->
<div class="card">

<div id="userKPI">
  Present (Month): <b id="present">0</b><br>
  Leave (Month): <b id="leave">0</b>
</div>

<div id="adminKPI" style="display:none;justify-content:space-between;">
  <div>
    <b>Self (Month)</b><br>
    P: <span id="selfP">0</span><br>
    L: <span id="selfL">0</span>
  </div>
  <div>
    <b>Staff (Today)</b><br>
    P: <span id="staffP">0</span><br>
    L: <span id="staffL">0</span>
  </div>
</div>

</div>

<!-- ACTION -->
<div class="card">
  <button id="markBtn" class="btn present" onclick="mark()">✔ Mark Attendance</button>
  <button id="leaveBtn" class="btn leave" onclick="toggleLeave()">➕ Apply Leave</button>
  <button class="btn" style="background:#9c27b0;" onclick="openCalendar()">📅 Calendar</button>
  <button id="adminBtn" class="btn hidden" style="background:#2979ff;">👑 Staff</button>
</div>

<!-- LEAVE -->
<div id="leaveBox" class="card hidden">
  <div class="form-row">
    <div class="form-group">
      <label>From</label>
      <input type="date" id="from">
    </div>
    <div class="form-group">
      <label>To</label>
      <input type="date" id="to">
    </div>
  </div>

  <select id="type">
    <option value="">Select Leave</option>
    <option>CL</option>
    <option>PL</option>
    <option>MEDICAL</option>
    <option>UCL</option>
  </select>

  <button class="btn leave" onclick="submitLeave()">Submit</button>
</div>

<!-- CALENDAR -->
<div id="calendarBox" class="card hidden">
  <h3>📅 Attendance History</h3>
  <div id="calendarGrid"></div>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="card hidden">
  <input id="search" placeholder="Search">
  <div id="staffList"></div>
</div>

<p id="msg"></p>

</div>

<script>

const URL="YOUR_SCRIPT_URL"; // replace

let staffId=localStorage.getItem("staffId");
let isAdmin=(staffId==="N07550");
let selectedStaff=staffId;

// RESET NEXT DAY
let last=localStorage.getItem("lastMarkedDate");
let today=new Date().toDateString();
if(last && last!==today){
localStorage.removeItem("lastMarkedDate");
enableButtons();
}

// LOAD
function load(){
fetch(URL,{
method:"POST",
body:JSON.stringify({action:"dashboard",staff_id:isAdmin?"ALL":staffId})
})
.then(r=>r.json())
.then(d=>{

welcome.innerText=d.name+" ("+staffId+")"+(isAdmin?" [ADMIN]":"");
todayText.innerText=d.today || "--";

if(isAdmin){
userKPI.style.display="none";
adminKPI.style.display="flex";
selfP.innerText=d.self.present;
selfL.innerText=d.self.leave;
staffP.innerText=d.staff.present;
staffL.innerText=d.staff.leave;
adminBtn.classList.remove("hidden");
}else{
present.innerText=d.present;
leave.innerText=d.leave;
}

if(d.today && (d.today.includes("Present") || d.today.includes("Leave"))){
disableButtons();
}

});
}

// BUTTON CONTROL
function disableButtons(){
markBtn.disabled=true;
leaveBtn.disabled=true;
markBtn.style.opacity=0.6;
leaveBtn.style.opacity=0.6;
}

function enableButtons(){
markBtn.disabled=false;
leaveBtn.disabled=false;
markBtn.style.opacity=1;
leaveBtn.style.opacity=1;
}

// MARK
function mark(){
toggle(true);

navigator.geolocation.getCurrentPosition(pos=>{
fetch(URL,{
method:"POST",
body:JSON.stringify({
staff_id:selectedStaff,
status:"Present",
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);

if(d.status==="success"){
showMsg("✔ Attendance Marked");
disableButtons();
localStorage.setItem("lastMarkedDate",new Date().toDateString());
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
disableButtons();
}

load();
});
});
}

// LEAVE
function toggleLeave(){
leaveBox.classList.toggle("hidden");
}

function submitLeave(){

let from=from.value,to=to.value,type=document.getElementById("type").value;

if(!from||!to||!type){
showMsg("⚠ Fill all fields");
return;
}

toggle(true);

navigator.geolocation.getCurrentPosition(pos=>{
fetch(URL,{
method:"POST",
body:JSON.stringify({
staff_id:selectedStaff,
status:"Leave",
leave_type:type,
from_date:from,
to_date:to,
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);

if(d.status==="success"){
showMsg("✔ Leave Applied");
disableButtons();
localStorage.setItem("lastMarkedDate",new Date().toDateString());
leaveBox.classList.add("hidden");
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
disableButtons();
}

load();
});
});
}

// CALENDAR
function openCalendar(){
calendarBox.classList.toggle("hidden");

fetch(URL,{
method:"POST",
body:JSON.stringify({action:"calendar",staff_id:staffId})
})
.then(r=>r.json())
.then(d=>{
let html="";
d.data.forEach(x=>{
let c=x.status==="Present"?"#4caf50":"#f44336";
html+=`<div style="margin:5px;padding:10px;background:${c};border-radius:8px">${x.date} - ${x.status}</div>`;
});
calendarGrid.innerHTML=html;
});
}

// ADMIN
adminBtn.onclick=()=>{
adminPanel.classList.toggle("hidden");
loadStaff();
};

function loadStaff(){
fetch(URL,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({action:"staff_list"})
})
.then(r=>r.json())
.then(d=>{
let html="";
d.staff.forEach(s=>{
html+=`<div class="staffCard">${s.name}</div>`;
});
staffList.innerHTML=html;
});
}

// HELPERS
function toggle(x){loader.style.display=x?"flex":"none";}
function showMsg(t){msg.innerText=t;}
function logout(){localStorage.clear();location="index.html";}
function goBack(){history.back();}

load();

</script>

</body>
</html>
