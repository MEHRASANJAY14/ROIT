<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 { margin-bottom: 10px; }

    label {
      display: block;
      text-align: left;
      margin-left: 5%;
      font-size: 14px;
      margin-top: 10px;
    }

    select, input, button {
      width: 90%;
      padding: 12px;
      margin: 5px 0;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #006633;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 15px;
    }

    #msg {
      margin-top: 10px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>📍 Attendance</h2>
  <p><b>Staff ID:</b> N07550</p>

  <!-- STATUS -->
  <label>Status</label>
  <select id="status">
    <option value="Present">Present</option>
    <option value="Leave">Leave</option>
  </select>

  <!-- LEAVE SECTION -->
  <div id="leaveSection" class="hidden">

    <label>Leave Type</label>
    <select id="leave_type">
      <option value="">Select Leave Type</option>
      <option value="PL">PL</option>
      <option value="CL">CL</option>
      <option value="MATERNITY">MATERNITY</option>
      <option value="JOINING">JOINING</option>
      <option value="PATERNITY">PATERNITY</option>
      <option value="UCL">UCL</option>
      <option value="MEDICAL">MEDICAL</option>
    </select>

    <label>From Date</label>
    <input type="date" id="from_date">

    <label>To Date</label>
    <input type="date" id="to_date">

  </div>

  <button onclick="markAttendance()">Submit</button>

  <p id="msg"></p>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRYZ4N0AZwHHwbh30JpTEovFzgJOgItmbpnWDKTvBKMg5GkqiyHtWXYq7U4-8WrdnAtw/exec";

// 🔁 Toggle Leave UI
document.getElementById("status").addEventListener("change", function() {
  const leaveSection = document.getElementById("leaveSection");
  leaveSection.classList.toggle("hidden", this.value !== "Leave");
});

// 🚀 Main function
function markAttendance() {

  const status = document.getElementById("status").value;
  const leaveType = document.getElementById("leave_type").value;
  const fromDate = document.getElementById("from_date").value;
  const toDate = document.getElementById("to_date").value;

  // ✅ Validation
  if(status === "Leave"){
    if(!leaveType){
      alert("Please select Leave Type");
      return;
    }
    if(!fromDate || !toDate){
      alert("Please select From and To Date");
      return;
    }
  }

  if (!navigator.geolocation) {
    alert("GPS not supported");
    return;
  }

  document.getElementById("msg").innerText = "📍 Getting location...";

  navigator.geolocation.getCurrentPosition(function(position){

    const data = {
      staff_id: "N07550",
      status: status,
      lat: position.coords.latitude,
      lng: position.coords.longitude,
      leave_type: leaveType,
      from_date: fromDate,
      to_date: toDate
    };

    document.getElementById("msg").innerText = "📡 Sending data...";

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
      document.getElementById("msg").innerText =
        res.status === "success"
        ? "✅ Attendance Marked Successfully"
        : "❌ " + res.message;
    })
    .catch(() => {
      document.getElementById("msg").innerText = "❌ Server Error";
    });

  }, function(){
    alert("Please allow location access");
  });
}

</script>

</body>
</html>
