<!DOCTYPE html>
<html>
<head>
  <title>Attendance App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 5px;
      font-weight: 600;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      transition: 0.2s;
    }

    select:focus, input:focus {
      border-color: #2c5364;
      outline: none;
      box-shadow: 0 0 5px rgba(44,83,100,0.3);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #msg {
      margin-top: 12px;
      font-weight: 500;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .fade {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      background: #eef;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }

  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h2>📍 Attendance</h2>
    <div class="subtitle">Staff ID: N07550</div>

    <!-- STATUS -->
    <label>Status</label>
    <select id="status">
      <option value="Present">Present</option>
      <option value="Leave">Leave</option>
    </select>

    <!-- LEAVE SECTION -->
    <div id="leaveSection" class="hidden fade">

      <label>Leave Type</label>
      <select id="leave_type">
        <option value="">Select Leave Type</option>
        <option value="PL">PL</option>
        <option value="CL">CL</option>
        <option value="MATERNITY">MATERNITY</option>
        <option value="JOINING">JOINING</option>
        <option value="PATERNITY">PATERNITY</option>
        <option value="UCL">UCL</option>
        <option value="MEDICAL">MEDICAL</option>
      </select>

      <label>From Date</label>
      <input type="date" id="from_date">

      <label>To Date</label>
      <input type="date" id="to_date">

    </div>

    <button onclick="markAttendance()">Submit</button>

    <p id="msg"></p>

  </div>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRYZ4N0AZwHHwbh30JpTEovFzgJOgItmbpnWDKTvBKMg5GkqiyHtWXYq7U4-8WrdnAtw/exec";

// Toggle leave section
document.getElementById("status").addEventListener("change", function() {
  const leaveSection = document.getElementById("leaveSection");
  leaveSection.classList.toggle("hidden", this.value !== "Leave");
});

// Submit
function markAttendance() {

  const status = document.getElementById("status").value;
  const leaveType = document.getElementById("leave_type").value;
  const fromDate = document.getElementById("from_date").value;
  const toDate = document.getElementById("to_date").value;

  if(status === "Leave"){
    if(!leaveType || !fromDate || !toDate){
      alert("Please fill leave details");
      return;
    }
  }

  if (!navigator.geolocation) {
    alert("GPS not supported");
    return;
  }

  document.getElementById("msg").innerText = "📍 Getting location...";

  navigator.geolocation.getCurrentPosition(function(position){

    const data = {
      staff_id: "N07550",
      status: status,
      lat: position.coords.latitude,
      lng: position.coords.longitude,
      leave_type: leaveType,
      from_date: fromDate,
      to_date: toDate
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
      document.getElementById("msg").innerText =
        res.status === "success"
        ? "✅ Attendance Marked"
        : "❌ " + res.message;
    })
    .catch(() => {
      document.getElementById("msg").innerText = "❌ Server error";
    });

  });
}

</script>

</body>
</html>
