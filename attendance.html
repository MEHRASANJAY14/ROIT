<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, select, button {
      width: 90%;
      padding: 12px;
      margin: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #006633;
      color: white;
      border: none;
      font-weight: bold;
    }

    #msg {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📍 Attendance System</h2>

  <!-- Hidden STAFF ID (fixed) -->
  <input type="hidden" id="staff_id" value="N07550">

  <p><b>Staff ID:</b> N07550</p>

  <!-- STATUS -->
  <select id="status">
    <option value="Present">Present</option>
    <option value="Leave">Leave</option>
  </select>

  <button onclick="markAttendance()">Submit</button>

  <p id="msg"></p>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRYZ4N0AZwHHwbh30JpTEovFzgJOgItmbpnWDKTvBKMg5GkqiyHtWXYq7U4-8WrdnAtw/exec";

function markAttendance() {

  let staffId = "N07550"; // 🔥 fixed ID

  if (!navigator.geolocation) {
    alert("GPS not supported");
    return;
  }

  document.getElementById("msg").innerText = "📍 Getting location...";

  navigator.geolocation.getCurrentPosition(function(position){

    const data = {
      staff_id: staffId,
      status: document.getElementById("status").value,
      lat: position.coords.latitude,
      lng: position.coords.longitude
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {

      if(res.status === "success"){
        document.getElementById("msg").innerText = "✅ Attendance Marked Successfully";
      } else {
        document.getElementById("msg").innerText = "❌ " + res.message;
      }

    })
    .catch(() => {
      document.getElementById("msg").innerText = "❌ Server Error";
    });

  }, function(){
    alert("Please allow location access");
  });

}

</script>

</body>
</html>
