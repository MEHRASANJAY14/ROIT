<!DOCTYPE html>
<html>
<head>
<title>Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
  color:#fff;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:rgba(255,255,255,0.1);
}

.header button{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  padding:18px;
  border-radius:18px;
  margin-bottom:15px;
  backdrop-filter:blur(12px);
}

/* BUTTON */
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:12px;
  font-weight:600;
  cursor:pointer;
}

.present{
  background:linear-gradient(135deg,#00c853,#00e676);
}

.leave{
  background:linear-gradient(135deg,#ff3d00,#ff7043);
}

/* FORM */
.form-group{
  margin-bottom:12px;
}

label{
  font-size:12px;
  opacity:0.8;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:5px;
}

/* STAFF */
.staffCard{
  background:#fff;
  color:#000;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}

/* LOADER */
#loader{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:999;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:18px;
}

.hidden{display:none;}
</style>
</head>

<body>

<div id="loader">⏳ Processing...</div>

<div class="header">
  <button onclick="goBack()">⬅</button>
  <span id="welcome">Loading...</span>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">
  Today: <b id="today">--</b><br>
  Present: <b id="present">0</b><br>
  Leave: <b id="leave">0</b>
</div>

<div class="card">
  <button class="btn present" onclick="mark()">✔ Mark Attendance</button>
  <button class="btn leave" onclick="toggleLeave()">➕ Apply Leave</button>
  <button id="adminBtn" class="btn hidden" style="background:#2979ff;">👑 Staff Attendance</button>
</div>

<!-- LEAVE FORM -->
<div id="leaveBox" class="card hidden">
  <h3>📄 Apply Leave</h3>

  <div class="form-group">
    <label>From Date</label>
    <input type="date" id="from">
  </div>

  <div class="form-group">
    <label>To Date</label>
    <input type="date" id="to">
  </div>

  <div class="form-group">
    <label>Leave Type</label>
    <select id="type">
      <option value="">Select Leave Type</option>
      <option>CL</option>
      <option>PL</option>
      <option>MEDICAL</option>
      <option>UCL</option>
    </select>
  </div>

  <button class="btn leave" onclick="submitLeave()">Submit Leave</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="card hidden">
  <input type="text" id="search" placeholder="🔍 Search staff">
  <div id="staffList"></div>
</div>

<p id="msg"></p>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbzwZiRF2QF96MrX0wGFySzZ7IJqtzT354DNq1YZS4lPdg_gqKMk8OjQJqmE7W4PP401PA/exec";

let staffId = localStorage.getItem("staffId");
let isAdmin = (staffId === "N07550");
let selectedStaff = staffId;

// LOAD
function load(){
  fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      action:"dashboard",
      staff_id:isAdmin?"ALL":staffId
    })
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("welcome").innerText =
      (d.name||"User")+" ("+staffId+")"+(isAdmin?" [ADMIN]":"");

    document.getElementById("today").innerText = d.today;
    document.getElementById("present").innerText = d.present;
    document.getElementById("leave").innerText = d.leave;

    if(isAdmin){
      document.getElementById("adminBtn").classList.remove("hidden");
    }
  });
}

// MARK
function mark(){
  toggle(true);

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:selectedStaff,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      toggle(false);
      showMsg(d.message);
      load();
    });
  });
}

// LEAVE
function toggleLeave(){
  document.getElementById("leaveBox").classList.toggle("hidden");
}

function submitLeave(){
  toggle(true);

  let from = document.getElementById("from").value;
  let to = document.getElementById("to").value;
  let type = document.getElementById("type").value;

  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:selectedStaff,
        status:"Leave",
        leave_type:type,
        from_date:from,
        to_date:to,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(r=>r.json())
    .then(d=>{
      toggle(false);
      showMsg(d.message);
      document.getElementById("leaveBox").classList.add("hidden");
      load();
    });
  });
}

// ADMIN
document.getElementById("adminBtn").onclick=function(){
  let p=document.getElementById("adminPanel");
  p.classList.toggle("hidden");
  loadStaff();
};

function loadStaff(){
  fetch(URL,{
    method:"POST",
    body:JSON.stringify({action:"staff_list"})
  })
  .then(r=>r.json())
  .then(d=>{
    let html="";
    d.staff.forEach(s=>{
      html+=`
      <div class="staffCard" data-name="${s.name.toLowerCase()}">
        <b>${s.name}</b> (${s.staff_id})<br>
        <button class="btn present" onclick="markStaff('${s.staff_id}')">Present</button>
        <button class="btn leave" onclick="openLeave('${s.staff_id}')">Leave</button>
      </div>`;
    });
    document.getElementById("staffList").innerHTML=html;
  });
}

function markStaff(id){
  selectedStaff=id;
  mark();
}

function openLeave(id){
  selectedStaff=id;
  toggleLeave();
}

// SEARCH
document.addEventListener("input",e=>{
  if(e.target.id==="search"){
    let val=e.target.value.toLowerCase();
    document.querySelectorAll(".staffCard").forEach(c=>{
      c.style.display = c.dataset.name.includes(val)?"block":"none";
    });
  }
});

// HELPERS
function toggle(x){
  let loader = document.getElementById("loader");
  loader.style.display = x ? "flex" : "none";
}

function showMsg(t){
  document.getElementById("msg").innerText = t;
}

function logout(){
  localStorage.clear();
  window.location="index.html";
}

function goBack(){
  window.history.back();
}

load();

</script>

</body>
</html>
