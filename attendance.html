<!DOCTYPE html>
<html>
<head>
<title>Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.btn{
margin:5px 2px;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:rgba(255,255,255,0.08);
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:600;
  cursor:pointer;
}

.present{background:#00c853;}
.leave{background:#ff3d00;}

input,select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:5px;
}

.form-row{display:flex;gap:10px;}
.form-group{flex:1;}
@media(max-width:480px){.form-row{flex-direction:column;}}

/* Calendar */
.calendar{
  display:grid;
  grid-template-columns: repeat(7,1fr);
  gap:5px;
  text-align:center;
}
.day-name{
font-weight:bold;
color:#00e676;
}
.date{
padding:8px;
border-radius:6px;
font-size:11px;
}
.presentDay{background:#4caf50;}
.leaveDay{background:#f44336;}
.todayBox{border:2px solid yellow;}

#loader{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.hidden{display:none;}
</style>
</head>

<body>

<div id="loader">⏳ Processing...</div>

<div class="header">
<button onclick="goBack()">⬅</button>
<b id="welcome">Loading...</b>
<button onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">
Today: <b id="todayText">--</b>
</div>

<div class="card">
<div id="userKPI">
Present: <b id="present">0</b><br>
Leave: <b id="leave">0</b>
</div>

<div id="adminKPI" style="display:none;justify-content:space-between;">
<div>
Self<br>P:<span id="selfP">0</span><br>L:<span id="selfL">0</span>
</div>
<div>
Staff Today<br>P:<span id="staffP">0</span><br>L:<span id="staffL">0</span>
</div>
</div>
</div>

<div class="card">
Selected Staff: <b id="selectedName">Self</b>
</div>

<div class="card">
<button id="markBtn" class="btn present" onclick="mark()">✔ Mark Attendance</button>
<button id="leaveBtn" class="btn leave" onclick="toggleLeave()">➕ Apply Leave</button>
<button class="btn" style="background:#9c27b0;" onclick="openCalendar()">📅 Calendar</button>
<button id="adminBtn" class="btn hidden" onclick="openStaff()">👑 Staff</button>
</div>

<div id="leaveBox" class="card hidden">
<div class="form-row">
<div class="form-group">
<label>From</label>
<input type="date" id="from">
</div>
<div class="form-group">
<label>To</label>
<input type="date" id="to">
</div>
</div>

<select id="type">
<option value="">Select Leave</option>
<option>CL</option>
<option>PL</option>
<option>MEDICAL</option>
<option>UCL</option>
</select>

<button class="btn leave" onclick="submitLeave()">Submit</button>
</div>

<div id="calendarBox" class="card hidden">
<div style="display:flex;justify-content:space-between;">
<button onclick="changeMonth(-1)">◀</button>
<div id="monthTitle"></div>
<button onclick="changeMonth(1)">▶</button>
</div>
<div class="calendar" id="calendarGrid"></div>
</div>

<div id="staffBox" class="card hidden">
<h3>👑 Staff List</h3>
<input type="text" id="search" placeholder="Search..." onkeyup="filterStaff()">
<div id="staffList"></div>
</div>

<p id="msg"></p>

</div>

<script>

 

const URL="https://script.google.com/macros/s/AKfycbzwZiRF2QF96MrX0wGFySzZ7IJqtzT354DNq1YZS4lPdg_gqKMk8OjQJqmE7W4PP401PA/exec";

let staffId=localStorage.getItem("staffId");
let isAdmin=(staffId==="N07550");
let selectedStaff=staffId;

selectedName.innerText=isAdmin?"Self (Admin)":staffId;

// ===== LOCATION =====
function getLocation(callback){
navigator.geolocation.getCurrentPosition(
pos=>callback(pos.coords.latitude,pos.coords.longitude),
()=>{
showMsg("⚠ Location permission required");
toggle(false);
}
);
}

// ===== STAFF =====
function openStaff(){
staffBox.classList.toggle("hidden");

fetch(URL+"?action=staff_list")
.then(r=>r.json())
.then(d=>{

let html="";

(d.staff||[]).forEach(s=>{

html+=`
<div style="margin:8px;padding:10px;background:#fff2;border-radius:10px;">

<b>${s.name}</b> (${s.staff_id})

<br><br>

<button class="btn present" style="width:48%;" 
onclick="adminMark('${s.staff_id}','Present')">✔ P</button>

<button class="btn leave" style="width:48%;" 
onclick="adminMark('${s.staff_id}','Leave')">✖ L</button>

</div>
`;

});

staffList.innerHTML=html;

});
}

// ===== LOAD =====
function load(){
fetch(URL+"?action=dashboard&staff_id="+(isAdmin?"ALL":staffId))
.then(r=>r.json())
.then(d=>{
if(!d || d.status!=="success"){showMsg("❌ Error");return;}

welcome.innerText=(d.name||"User")+" ("+staffId+")";
todayText.innerText=d.today||"--";

if(isAdmin && d.self){
userKPI.style.display="none";
adminKPI.style.display="flex";
selfP.innerText=d.self.present;
selfL.innerText=d.self.leave;
staffP.innerText=d.staff.present;
staffL.innerText=d.staff.leave;
adminBtn.classList.remove("hidden");
}else{
present.innerText=d.present;
leave.innerText=d.leave;
}

if(d.today && (d.today.includes("Present")||d.today.includes("Leave"))){
disableButtons();
showMsg("✔ Already Marked Today");
}

});
}

// ===== BUTTON =====
function disableButtons(){
markBtn.disabled=true;
leaveBtn.disabled=true;
markBtn.style.opacity=0.5;
leaveBtn.style.opacity=0.5;
}

// ===== MARK =====
function mark(){
toggle(true);

getLocation((lat,lng)=>{
fetch(URL,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({staff_id:selectedStaff,status:"Present",lat:lat,lng:lng})
})
.then(r=>r.json())
.then(d=>{
toggle(false);

if(d.status==="success"){
showMsg("✔ Attendance Marked");
disableButtons();
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
disableButtons();
}

load();
});
});
}

// ===== LEAVE =====
function submitLeave(){
let f=from.value,t=to.value,ty=type.value;

if(!f||!t||!ty){
showMsg("⚠ Fill all fields");
return;
}

toggle(true);

getLocation((lat,lng)=>{
fetch(URL,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({
staff_id:selectedStaff,
status:"Leave",
from_date:f,
to_date:t,
leave_type:ty,
lat:lat,
lng:lng
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);

if(d.status==="success"){
showMsg("✔ Leave Applied");
disableButtons();
leaveBox.classList.add("hidden");
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
disableButtons();
}

load();
});
});
}
 function adminMark(id,type){

toggle(true);

fetch(URL,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({
staff_id:id,
status:type
})
})
.then(r=>r.json())
.then(d=>{

toggle(false);

if(d.status==="success"){
showMsg("✔ "+type+" Marked for " + id);
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
}
else{
showMsg("❌ Error");
}

load();

})
.catch(()=>{
toggle(false);
showMsg("❌ Network Error");
});

}
// ===== CALENDAR =====
let currentMonth=new Date().getMonth();
let currentYear=new Date().getFullYear();

function changeMonth(step){
currentMonth+=step;
if(currentMonth<0){currentMonth=11;currentYear--;}
if(currentMonth>11){currentMonth=0;currentYear++;}
openCalendar();
}

function openCalendar(){
calendarBox.classList.toggle("hidden");

fetch(URL+"?action=calendar&staff_id="+staffId)
.then(r=>r.json())
.then(d=>{
let map={};
(d.data||[]).forEach(x=>map[x.date]=x.status);

let months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
monthTitle.innerText=months[currentMonth]+" "+currentYear;

let days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let html="";

days.forEach(d=>html+=`<div class="day-name">${d}</div>`);

let first=new Date(currentYear,currentMonth,1).getDay();
let total=new Date(currentYear,currentMonth+1,0).getDate();

for(let i=0;i<first;i++) html+="<div></div>";

let today=new Date();

for(let i=1;i<=total;i++){
let ds=currentYear+"-"+String(currentMonth+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");
let st=map[ds]||"Absent";

let cls="date";
if(st==="Present") cls+=" presentDay";
if(st==="Leave") cls+=" leaveDay";
if(i===today.getDate() && currentMonth===today.getMonth()) cls+=" todayBox";

html+=`<div class="${cls}">${i}<br>${st}</div>`;
}

calendarGrid.innerHTML=html;
});
}

// ===== HELPERS =====
function toggle(x){loader.style.display=x?"flex":"none";}
function showMsg(t){msg.innerText=t;}
function logout(){localStorage.clear();location="index.html";}
function goBack(){history.back();}

load();

</script>

</body>
</html>
