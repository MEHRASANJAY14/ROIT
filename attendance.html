<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: Arial; background:#f4f6f9; margin:0; }
    .header { background:#006633; color:white; padding:15px; text-align:center; }
    .container { padding:15px; max-width:420px; margin:auto; }
    .card { background:white; padding:15px; border-radius:10px; }
    label { display:block; margin-top:10px; font-size:13px; }
    select,input { width:100%; padding:10px; margin-top:5px; }
    .row { display:flex; gap:10px; }
    .col { flex:1; }
    button { width:100%; padding:12px; margin-top:15px; background:#006633; color:white; border:none; }
    .hidden { display:none; }
  </style>
</head>

<body>

<div class="header">Attendance</div>

<div class="container">
<div class="card">

<label>Status</label>
<select id="status">
  <option value="Present">Present</option>
  <option value="Leave">Leave</option>
</select>

<div id="leaveSection" class="hidden">

<label>From Date</label>
<input type="date" id="from_date">

<div class="row">
  <div class="col">
    <label>To Date</label>
    <input type="date" id="to_date">
  </div>

  <div class="col">
    <label>Leave Type</label>
    <select id="leave_type">
      <option value="">Select</option>
      <option value="PL">PL</option>
      <option value="CL">CL</option>
      <option value="MEDICAL">MEDICAL</option>
    </select>
  </div>
</div>

</div>

<button onclick="markAttendance()">Submit</button>

<p id="msg"></p>

</div>
</div>

<script>

const SCRIPT_URL = "YOUR_SCRIPT_URL";
let staffId = "N07550";

// Toggle leave UI
document.getElementById("status").addEventListener("change", function() {
  document.getElementById("leaveSection")
    .classList.toggle("hidden", this.value !== "Leave");
});

// 🔥 AUTO LOAD
window.onload = function(){

  let today = new Date().toISOString().split("T")[0];

  document.getElementById("from_date").value = today;
  document.getElementById("to_date").value = today;

  document.getElementById("from_date").min = today;
  document.getElementById("to_date").min = today;

  const params = new URLSearchParams(window.location.search);
  if(params.get("mode") === "leave"){
    document.getElementById("status").value = "Leave";
    document.getElementById("status")
      .dispatchEvent(new Event("change"));
  }

};

// Submit
function markAttendance(){

  let status = document.getElementById("status").value;

  let data = {
    staff_id: staffId,
    status: status,
    lat: 0,
    lng: 0,
    leave_type: document.getElementById("leave_type").value,
    from_date: document.getElementById("from_date").value,
    to_date: document.getElementById("to_date").value
  };

  navigator.geolocation.getCurrentPosition(function(pos){

    data.lat = pos.coords.latitude;
    data.lng = pos.coords.longitude;

    fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify(data)
    })
    .then(res=>res.json())
    .then(res=>{
      document.getElementById("msg").innerText =
        res.status==="success" ? "Done" : res.message;
    });

  });

}

</script>

</body>
</html>
