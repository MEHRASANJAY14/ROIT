<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin:0;
      font-family:'Inter',sans-serif;
      background:#f4f6f9;
    }

    .header {
      background: linear-gradient(135deg,#006633,#00994d);
      color:white;
      padding:20px;
      border-bottom-left-radius:20px;
      border-bottom-right-radius:20px;
    }

    .header h2 { margin:0; }

    .container {
      padding:15px;
      max-width:420px;
      margin:auto;
    }

    .card {
      background:white;
      border-radius:12px;
      padding:15px;
      margin-bottom:12px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
    }

    .title { font-size:13px; color:#666; }
    .value { font-size:22px; font-weight:600; margin-top:5px; }

    .grid {
      display:flex;
      gap:10px;
    }

    .presentCard {
      background:#e8f5e9;
      color:#2e7d32;
    }

    .leaveCard {
      background:#fff3e0;
      color:#ef6c00;
    }

    .btn {
      width:100%;
      padding:13px;
      border:none;
      border-radius:8px;
      font-weight:600;
      cursor:pointer;
      margin-top:10px;
    }

    .present { background:#006633; color:white; }
    .leave { background:#ff9800; color:white; }

    #msg {
      text-align:center;
      margin-top:10px;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="header">
  <h2 id="welcome">👋 Welcome</h2>
  <div>Attendance Dashboard</div>
</div>

<div class="container">

  <!-- TODAY -->
  <div class="card">
    <div class="title">Today's Attendance</div>
    <div class="value" id="todayStatus">--</div>
  </div>

  <!-- MONTH -->
  <div class="grid">

    <div class="card presentCard">
      <div class="title">Present (Month)</div>
      <div class="value" id="presentCount">0</div>
    </div>

    <div class="card leaveCard">
      <div class="title">Leave (Month)</div>
      <div class="value" id="leaveCount">0</div>
    </div>

  </div>

  <!-- ACTIONS -->
  <div class="card">

    <button class="btn present" onclick="markAttendance()">
      Mark Present
    </button>

    <button class="btn leave" onclick="goToLeave()">
      Apply Leave
    </button>

  </div>

  <p id="msg"></p>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRYZ4N0AZwHHwbh30JpTEovFzgJOgItmbpnWDKTvBKMg5GkqiyHtWXYq7U4-8WrdnAtw/exec";

let staffId = "N07550";

// 🔁 LOAD DASHBOARD
function loadDashboard(){

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"dashboard",
      staff_id:staffId
    })
  })
  .then(res=>res.json())
  .then(res=>{

    document.getElementById("welcome").innerText =
      "👋 Welcome " + staffId + " - " + (res.name || "");

    document.getElementById("todayStatus").innerText =
      res.today || "Not Marked";

    document.getElementById("presentCount").innerText =
      res.present || 0;

    document.getElementById("leaveCount").innerText =
      res.leave || 0;

  });

}

// ✅ MARK PRESENT
function markAttendance(){

  document.getElementById("msg").innerText = "Getting location...";

  navigator.geolocation.getCurrentPosition(function(pos){

    fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        staff_id:staffId,
        status:"Present",
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{

      if(res.status==="success"){
        document.getElementById("msg").innerText = "Attendance marked";
        setTimeout(loadDashboard, 500); // 🔥 refresh
      } else {
        document.getElementById("msg").innerText = res.message;
      }

    });

  });

}

// 🔁 NAVIGATION
function goToLeave(){
  window.location.href = "attendance.html";
}

// INIT
loadDashboard();

</script>

</body>
</html>
