<!DOCTYPE html>
<html>
<head>
<title>Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:rgba(255,255,255,0.08);
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:600;
  cursor:pointer;
}

.present{background:#00c853;}
.leave{background:#ff3d00;}

input,select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:5px;
}

.form-row{display:flex;gap:10px;}
.form-group{flex:1;}
@media(max-width:480px){.form-row{flex-direction:column;}}

/* Calendar */
.calendar{
  display:grid;
  grid-template-columns: repeat(7,1fr);
  gap:5px;
  text-align:center;
}
.day{padding:8px;border-radius:6px;font-size:11px;}
.presentDay{background:#4caf50;}
.leaveDay{background:#f44336;}
.empty{background:transparent;}

#loader{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.hidden{display:none;}
</style>
</head>

<body>

<div id="loader">⏳ Processing...</div>

<div class="header">
  <button onclick="goBack()">⬅</button>
  <b id="welcome">Loading...</b>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

<!-- TODAY -->
<div class="card">
  Today: <b id="todayText">--</b>
</div>

<!-- KPI -->
<div class="card">

<div id="userKPI">
Present: <b id="present">0</b><br>
Leave: <b id="leave">0</b>
</div>

<div id="adminKPI" style="display:none;justify-content:space-between;">
<div>
Self<br>P:<span id="selfP">0</span><br>L:<span id="selfL">0</span>
</div>
<div>
Staff Today<br>P:<span id="staffP">0</span><br>L:<span id="staffL">0</span>
</div>
</div>

</div>

<!-- ACTION -->
<div class="card">
<button id="markBtn" class="btn present" onclick="mark()">✔ Mark Attendance</button>
<button id="leaveBtn" class="btn leave" onclick="toggleLeave()">➕ Apply Leave</button>
<button class="btn" style="background:#9c27b0;" onclick="openCalendar()">📅 Calendar</button>
<button id="adminBtn" class="btn hidden" style="background:#2979ff;">👑 Staff</button>
</div>

<!-- LEAVE -->
<div id="leaveBox" class="card hidden">
<div class="form-row">
<div class="form-group">
<label>From</label>
<input type="date" id="from">
</div>
<div class="form-group">
<label>To</label>
<input type="date" id="to">
</div>
</div>

<select id="type">
<option value="">Select Leave</option>
<option>CL</option>
<option>PL</option>
<option>MEDICAL</option>
<option>UCL</option>
</select>

<button class="btn leave" onclick="submitLeave()">Submit</button>
</div>

<!-- CALENDAR -->
<div id="calendarBox" class="card hidden">
<h3>📅 Attendance Calendar</h3>
<div class="calendar" id="calendarGrid"></div>
</div>

<p id="msg"></p>

</div>

<script>

const URL="PASTE_NEW_DEPLOY_URL"; // 🔥 Replace

let staffId=localStorage.getItem("staffId");
let isAdmin=(staffId==="N07550");
let selectedStaff=staffId;

// RESET NEXT DAY
let last=localStorage.getItem("markDate");
let today=new Date().toDateString();
if(last && last!==today){
localStorage.removeItem("markDate");
enableButtons();
}

// LOAD (GET)
function load(){

fetch(URL + "?action=dashboard&staff_id=" + (isAdmin?"ALL":staffId))
.then(res => {
  if(!res.ok) throw new Error("HTTP error");
  return res.json();
})
.then(d => {

console.log("DATA:", d);

if(!d || d.status!=="success"){
  showMsg("Server error");
  return;
}

welcome.innerText=(d.name||"User")+" ("+staffId+")";
todayText.innerText=d.today || "--";

if(isAdmin && d.self && d.staff){

userKPI.style.display="none";
adminKPI.style.display="flex";

selfP.innerText=d.self.present;
selfL.innerText=d.self.leave;
staffP.innerText=d.staff.present;
staffL.innerText=d.staff.leave;

}else{

present.innerText=d.present;
leave.innerText=d.leave;

}

})
.catch(err=>{
console.log("ERROR:", err);
showMsg("❌ Network Error");
});

}

// BUTTON CONTROL
function disableButtons(){
markBtn.disabled=true;
leaveBtn.disabled=true;
markBtn.style.opacity=0.5;
leaveBtn.style.opacity=0.5;
}
function enableButtons(){
markBtn.disabled=false;
leaveBtn.disabled=false;
markBtn.style.opacity=1;
leaveBtn.style.opacity=1;
}

// MARK (POST)
function mark(){
toggle(true);

navigator.geolocation.getCurrentPosition(pos=>{
fetch(URL,{
method:"POST",
body:JSON.stringify({
staff_id:selectedStaff,
status:"Present",
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);

if(d.status==="success"){
showMsg("✔ Attendance Marked");
disableButtons();
localStorage.setItem("markDate",new Date().toDateString());
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
disableButtons();
}

load();
});
});
}

// LEAVE
function toggleLeave(){leaveBox.classList.toggle("hidden");}

function submitLeave(){

let f=from.value,t=to.value,ty=type.value;

if(!f||!t||!ty){
showMsg("⚠ Fill all fields");
return;
}

toggle(true);

navigator.geolocation.getCurrentPosition(pos=>{
fetch(URL,{
method:"POST",
body:JSON.stringify({
staff_id:selectedStaff,
status:"Leave",
leave_type:ty,
from_date:f,
to_date:t,
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
})
.then(r=>r.json())
.then(d=>{
toggle(false);

if(d.status==="success"){
showMsg("✔ Leave Applied");
disableButtons();
localStorage.setItem("markDate",new Date().toDateString());
leaveBox.classList.add("hidden");
}
else if(d.already){
showMsg("✔ Already Marked ("+d.type+")");
disableButtons();
}

load();
});
});
}

// CALENDAR (GET)
function openCalendar(){

calendarBox.classList.toggle("hidden");

fetch(`${URL}?action=calendar&staff_id=${staffId}`)
.then(r=>r.json())
.then(d=>{

let map={};
(d.data||[]).forEach(x=>map[x.date]=x.status);

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

let first=new Date(y,m,1).getDay();
let total=new Date(y,m+1,0).getDate();

let html="";

for(let i=0;i<first;i++) html+=`<div class="day empty"></div>`;

for(let i=1;i<=total;i++){
let ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");
let st=map[ds]||"Absent";

let cls="day";
if(st==="Present") cls+=" presentDay";
if(st==="Leave") cls+=" leaveDay";

html+=`<div class="${cls}">${i}<br>${st}</div>`;
}

calendarGrid.innerHTML=html;

});

}

// HELPERS
function toggle(x){loader.style.display=x?"flex":"none";}
function showMsg(t){msg.innerText=t;}
function logout(){localStorage.clear();location="index.html";}
function goBack(){history.back();}

load();

</script>

</body>
</html>
