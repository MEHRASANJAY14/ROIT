<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
// 🔐 STRONG LOGIN CHECK
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }
})();
</script>

<title>MPGB RO Jabalpur</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{
  --sbi-blue:#1c4fa3;
  --light-blue:#2e6dd8;
}

/* BODY */
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#eaf1ff,#f7fbff);
}

/* HEADER */
.app-header{
  background:linear-gradient(135deg,#1c4fa3,#2e6dd8);
  color:white;
  padding:15px 10px;
  text-align:center;
  position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
}

.logo{
  width:70%;
  max-width:280px;
  margin-bottom:8px;
}

.app-header h1{margin:0;font-size:15px;}
.app-header h2{margin:3px 0;font-size:12px;font-weight:normal;}

.datetime{
  margin-top:6px;
  font-size:12px;
}

/* CONTENT */
.content{
  padding:15px;
  padding-bottom:120px;
}

/* KPI */
.kpi-card{
  background:white;
  padding:20px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  margin-bottom:20px;
  border:1px solid rgba(0,0,0,0.05);
  transition:0.3s;
}

.kpi-card:hover{
  transform:translateY(-4px);
}

.kpi-card h1{
  font-size:30px;
  background:linear-gradient(135deg,#1c4fa3,#2e6dd8);
  -webkit-background-clip:text;
  color:transparent;
}

/* GRID */
.app-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* TILE */
.app-tile{
  background:white;
  padding:20px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,0.06);
  cursor:pointer;
  transition:0.25s;
  border:1px solid rgba(0,0,0,0.05);
  position:relative;
}

/* GLOW BORDER */
.app-tile::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:16px;
  padding:1px;
  background:linear-gradient(135deg,#1c4fa3,#2e6dd8,#00c6ff);
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:0;
  transition:0.3s;
}

.app-tile:hover::before{
  opacity:1;
}

.app-tile:hover{
  transform:translateY(-5px) scale(1.02);
  box-shadow:0 12px 30px rgba(0,0,0,0.15);
}

.app-tile:active{
  transform:scale(0.96);
}

.app-tile i{
  font-size:24px;
  margin-bottom:8px;
  background:linear-gradient(135deg,#1c4fa3,#2e6dd8);
  -webkit-background-clip:text;
  color:transparent;
}

.app-tile span{
  font-size:12px;
  font-weight:500;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:50px;
  width:100%;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  box-shadow:0 -5px 20px rgba(0,0,0,0.1);
}

.bottom-nav i{
  font-size:20px;
  color:#1c4fa3;
}

/* FOOTER */
.footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:linear-gradient(135deg,#1c4fa3,#2e6dd8);
  color:white;
  text-align:center;
  padding:8px;
  font-size:11px;
}
</style>

</head>

<script>
function logout(){
  localStorage.clear();
  window.location.href="index.html";
}
function go(page){
  window.location.href=page;
}

/* Counter */
let count=0;
let target=53;
let interval=setInterval(()=>{
  count++;
  document.getElementById("branchCount").innerText=count;
  if(count>=target) clearInterval(interval);
},20);

/* Date Time */
function updateDateTime(){
  const now=new Date();
  const date=now.toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric',weekday:'long'});
  const time=now.toLocaleTimeString('en-IN');
  document.getElementById("datetime").innerHTML=date+" | "+time+" IST";
}
setInterval(updateDateTime,1000);
updateDateTime();

/* ADMIN TILE */
let user = localStorage.getItem("userid");
if(user === "N07550"){
  let grid=document.querySelector(".app-grid");
  let tile=document.createElement("div");
  tile.className="app-tile";
  tile.onclick=function(){go('reset_password.html');};
  tile.innerHTML=`<i class="fa-solid fa-key"></i><span>Reset Password</span>`;
  grid.appendChild(tile);
}
</script>
