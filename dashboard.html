<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
 let staffId = localStorage.getItem("staffId") || localStorage.getItem("userid");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  // अगर login नहीं या staffId नहीं
  if(login !== "true" || !branch || !staffId){
    window.location.replace("index.html");
  }

  // session timeout (30 min)
  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }

})();
</script>

<title>MPGB RO Jabalpur</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#eaf1ff,#f7fbff);
}

/* HEADER */
.app-header{
  background:linear-gradient(135deg,#1c4fa3,#2e6dd8);
  color:white;
  padding:10px 10px 12px;  /* compact */
  text-align:center;
  position:relative;
}

.logo{
  width:65%;
  max-width:250px;
}

/* 🔔 Notification */
.notification{
  position:absolute;
  right:50px;
  top:12px;
  cursor:pointer;
}

.notification i{
  font-size:18px;
  color:white;
}

.badge{
  position:absolute;
  top:-5px;
  right:-6px;
  background:red;
  color:white;
  font-size:9px;
  padding:2px 5px;
  border-radius:50%;
}

/* 👤 Profile */
.profile{
  position:absolute;
  right:10px;
  top:10px;
  cursor:pointer;
}

.profile i{
  background:rgba(255,255,255,0.2);
  padding:8px;
  border-radius:50%;
}

/* DROPDOWN */
.dropdown{
  position:absolute;
  right:10px;
  top:40px;
  background:#ffffff;
  border-radius:12px;
  width:190px;
  display:none;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  overflow:hidden;
  z-index:999;
}

.dropdown div{
  padding:12px 14px;
  font-size:12px;
  border-bottom:1px solid #f1f1f1;
  color:#333;
}

.dropdown div:hover{
  background:#f5f8ff;
}

.dropdown div:last-child{
  color:#e53935;
  font-weight:600;
}

/* CONTENT */
.content{
  padding:15px;
  padding-top:20px;
  padding-bottom:120px;
}

.kpi-card{
  background:white;
  padding:14px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  margin-bottom:18px;
}

.kpi-card h4{font-size:11px;}
.kpi-card h1{font-size:24px;}

/* GRID */
.app-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* TILE */
.app-tile{
  background:white;
  padding:18px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  cursor:pointer;
}

.app-tile i{
  font-size:22px;
  color:#1c4fa3;
  margin-bottom:6px;
}

.app-tile span{
  font-size:11px;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:50px;
  width:100%;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px;
}

/* FOOTER */
.footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:#1c4fa3;
  color:white;
  text-align:center;
  padding:8px;
  font-size:11px;
}
</style>

</head>

<script>
function logout(){
  localStorage.clear();
  window.location.href="index.html";
}
function go(page){
  window.location.href=page;
}

/* PROFILE LOAD */
window.onload = function(){
 let id = localStorage.getItem("staffId") || localStorage.getItem("userid") || "N/A";
  let branch = localStorage.getItem("branch") || "N/A";

  document.getElementById("userName").innerText = "ID: " + id;
  document.getElementById("branchName").innerText = "Branch: " + branch;
};

/* DROPDOWN */
function toggleMenu(){
  let menu=document.getElementById("dropdown");
  menu.style.display = menu.style.display==="block"?"none":"block";
}

document.addEventListener("click",function(e){
  if(!e.target.closest(".profile")){
    document.getElementById("dropdown").style.display="none";
  }
});

/* NOTIFICATION */
function showNotif(){
  let list = [
    "🎯 Check your branch target",
    "📊 Check business progress",
    "⏰ Check overdue accounts",
    "📄 Check ECS status",
    "⚠️ Review NPA accounts"
  ];

  let html = "<b>🔔 Branch Alerts</b><br><br>";

  list.forEach((n,i)=>{
    html += (i+1)+". "+n+"<br>";
  });

  let box = document.createElement("div");
  box.style.position="fixed";
  box.style.top="50%";
  box.style.left="50%";
  box.style.transform="translate(-50%,-50%)";
  box.style.background="#fff";
  box.style.padding="18px";
  box.style.borderRadius="14px";
  box.style.boxShadow="0 10px 30px rgba(0,0,0,0.3)";
  box.style.zIndex="9999";
  box.style.width="85%";
  box.style.maxWidth="320px";

  box.innerHTML = html + `
  <br>
  <button onclick="this.parentElement.remove()" 
  style="margin-top:10px;padding:6px 12px;border:none;background:#1c4fa3;color:white;border-radius:6px;">
  OK
  </button>`;

  document.body.appendChild(box);

  localStorage.setItem("notif",0);
  document.getElementById("notifCount").innerText=0;
}

/* Badge */
document.getElementById("notifCount").innerText =
localStorage.getItem("notif") || 0;

/* COUNTER */
let count=0,target=53;
let int=setInterval(()=>{
  count++;
  document.getElementById("branchCount").innerText=count;
  if(count>=target) clearInterval(int);
},20);

/* DATE TIME */
setInterval(()=>{
  let now=new Date();
  document.getElementById("datetime").innerText=
  now.toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+
  " | "+now.toLocaleTimeString('en-IN')+" IST";
},1000);

/* ADMIN TILE */
let user = localStorage.getItem("staffId") || localStorage.getItem("userid");
if(user==="N07550"){
  let grid=document.querySelector(".app-grid");
  let tile=document.createElement("div");
  tile.className="app-tile";
  tile.onclick=()=>go('reset_password.html');
  tile.innerHTML=`<i class="fa-solid fa-key"></i><span>Reset Password</span>`;
  grid.appendChild(tile);
}
</script>
