<script>
// 🔐 LOGIN CHECK
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }
})();
</script>

<title>MPGB RO Jabalpur</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{
  --sbi-blue:#1c4fa3;
}

/* BODY */
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#eaf1ff,#f7fbff);
}

/* HEADER */
.app-header{
  background:linear-gradient(135deg,#1c4fa3,#2e6dd8);
  color:white;
  padding:10px;
  text-align:center;
  position:relative;
}

/* 🔔 Notification */
.notification{
  position:absolute;
  right:55px;
  top:10px;

}

.notification i{

}

.badge{

  top:-5px;
  right:-6px;
  background:red;

/* 👤 Profile */

  border-radius:10px;

.dropdown div:last-child{

/* CONTENT */
.content{

/* GRID */
.app-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;

/* TILE */
.app-tile{

.app-tile i{

.bottom-nav{

  bottom:50px;

.footer{

  bottom:0;

<script>
function logout(){
  localStorage.clear();
  window.location.href="index.html";
}

function go(page){
  window.location.href=page;
}

/* Dropdown */
function toggleMenu(){
  let menu=document.getElementById("dropdown");
  menu.style.display = menu.style.display==="block"?"none":"block";
}

document.addEventListener("click",function(e){
  if(!e.target.closest(".profile")){
    document.getElementById("dropdown").style.display="none";
  }
});

/* USER DATA */
document.getElementById("userName").innerText =
  "User: " + (localStorage.getItem("username") || localStorage.getItem("userid") || "User");

document.getElementById("branchName").innerText =
  "Branch: " + (localStorage.getItem("branch") || "-");

/* Notification */
document.getElementById("notifCount").innerText =
  localStorage.getItem("notif") || 3;

/* Counter */
let count=0;
let target=53;
let interval=setInterval(()=>{
  count++;
  document.getElementById("branchCount").innerText=count;
  if(count>=target) clearInterval(interval);
},20);

/* Date Time */
function updateDateTime(){
  const now=new Date();
  const date=now.toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric',weekday:'long'});
  const time=now.toLocaleTimeString('en-IN');
  document.getElementById("datetime").innerHTML=date+" | "+time+" IST";
}
setInterval(updateDateTime,1000);
updateDateTime();
</script>
