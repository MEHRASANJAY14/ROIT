<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
(function(){
  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");
  let now = new Date().getTime();

  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }
})();
</script>

<title>MPGB RO Jabalpur</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#eaf1ff,#f7fbff);
}

/* HEADER */
.app-header{
  background:linear-gradient(135deg,#1c4fa3,#2e6dd8);
  color:white;
  padding:14px 10px 16px;
  text-align:center;
  position:relative;
}

.logo{
  width:65%;
  max-width:260px;
}

.app-header h1{font-size:14px;margin:0;}
.app-header h2{font-size:12px;margin:2px;}
.datetime{font-size:11px;}

/* NOTIFICATION */
.notification{
  position:absolute;
  right:55px;
  top:12px;
  cursor:pointer;
}

.badge{
  position:absolute;
  top:-5px;
  right:-6px;
  background:red;
  color:white;
  font-size:9px;
  padding:2px 5px;
  border-radius:50%;
}

/* PROFILE */
.profile{
  position:absolute;
  right:10px;
  top:10px;
  cursor:pointer;
}

.profile i{
  background:rgba(255,255,255,0.2);
  padding:8px;
  border-radius:50%;
}

/* DROPDOWN */
.dropdown{
  position:absolute;
  right:10px;
  top:42px;
  background:white;
  border-radius:10px;
  width:180px;
  display:none;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.dropdown div{
  padding:10px;
  font-size:12px;
  border-bottom:1px solid #eee;
}
.dropdown div:last-child{color:red;cursor:pointer;}

/* CONTENT */
.content{padding:15px;padding-bottom:120px;}

.kpi-card{
  background:white;
  padding:14px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.kpi-card h4{font-size:11px;}
.kpi-card h1{font-size:24px;}

/* GRID */
.app-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* TILE */
.app-tile{
  background:white;
  padding:18px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  cursor:pointer;
}

.app-tile i{
  font-size:22px;
  color:#1c4fa3;
  margin-bottom:6px;
}

.bottom-nav{
  position:fixed;
  bottom:50px;
  width:100%;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px;
}

.footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:#1c4fa3;
  color:white;
  text-align:center;
  padding:8px;
  font-size:11px;
}
</style>

</head>

<body>

<div class="app-header">

<div class="notification" onclick="showNotif()">
<i class="fa-solid fa-bell"></i>
<span class="badge" id="notifCount">0</span>
</div>

<div class="profile" onclick="toggleMenu()">
<i class="fa-solid fa-user"></i>
</div>

<div class="dropdown" id="dropdown">
<div id="userName"></div>
<div id="branchName"></div>
<div onclick="go('change_password.html')">Change Password</div>
<div onclick="logout()">Logout</div>
</div>

<img src="mpgb_header_small.png" class="logo">
<h1>MADHYA PRADESH GRAMIN BANK</h1>
<h2>RO Jabalpur – Digital Dashboard</h2>
<div id="datetime" class="datetime"></div>

</div>

<div class="content">

<div class="kpi-card">
<h4>Total Branches</h4>
<h1 id="branchCount">0</h1>
</div>

<div class="app-grid">

<div class="app-tile" onclick="go('inventory.html')">
<i class="fa-solid fa-box"></i>
<span>Assets</span>
</div>

<div class="app-tile" onclick="go('business.html')">
<i class="fa-solid fa-chart-line"></i>
<span>Business</span>
</div>

<div class="app-tile" onclick="go('ecs.html')">
<i class="fa-solid fa-file-contract"></i>
<span>ECS</span>
</div>

<div class="app-tile" onclick="go('emi.html')">
<i class="fa-solid fa-calculator"></i>
<span>EMI</span>
</div>

<div class="app-tile" onclick="go('Loan_calculators.html')">
<i class="fa-solid fa-hand-holding-dollar"></i>
<span>Loan Tools</span>
</div>

<div class="app-tile" onclick="go('calendar2026.html')">
<i class="fa-solid fa-calendar"></i>
<span>Calendar</span>
</div>

<div class="app-tile" onclick="go('setting.html')">
<i class="fa-solid fa-globe"></i>
<span>Internet</span>
</div>

<div class="app-tile" onclick="go('npa.html')">
<i class="fa-solid fa-triangle-exclamation"></i>
<span>NPA</span>
</div>

<div class="app-tile" onclick="go('Target.html')">
<i class="fa-solid fa-bullseye"></i>
<span>Targets</span>
</div>

<div class="app-tile" onclick="go('overdue.html')">
<i class="fa-solid fa-clock"></i>
<span>Overdue</span>
</div>

</div>

</div>

<div class="bottom-nav">
<i class="fa-solid fa-house"></i>
<i class="fa-solid fa-bell"></i>
<i class="fa-solid fa-user"></i>
</div>

<div class="footer">
© MPGB | RO Jabalpur IT Cell
<div>Developed by Sanjay Mehra</div>
</div>

<script>
function logout(){
  localStorage.clear();
  window.location.href="index.html";
}
function go(page){
  window.location.href=page;
}

/* PROFILE DATA */
let name = localStorage.getItem("username") || "User";
let id   = localStorage.getItem("userid") || "-";
let branch = localStorage.getItem("branch") || "-";

document.getElementById("userName").innerText = name + " ("+id+")";
document.getElementById("branchName").innerText = "Branch: " + branch;

/* DROPDOWN */
function toggleMenu(){
  let menu=document.getElementById("dropdown");
  menu.style.display = menu.style.display==="block"?"none":"block";
}

document.addEventListener("click",function(e){
  if(!e.target.closest(".profile")){
    document.getElementById("dropdown").style.display="none";
  }
});

/* NOTIFICATION SYSTEM */
function showNotif(){
  let list=[
    "3 Overdue Accounts pending",
    "ECS missing in 2 branches",
    "Target update required"
  ];

  let msg="🔔 Notifications:\n\n";
  list.forEach((n,i)=> msg+=(i+1)+". "+n+"\n");

  alert(msg);

  localStorage.setItem("notif",0);
  document.getElementById("notifCount").innerText=0;
}

function simulateUpdates(){
  let last=localStorage.getItem("lastCheck")||0;
  let now=new Date().getTime();

  if(now-last>300000){
    let c=parseInt(localStorage.getItem("notif")||0);
    c++;
    localStorage.setItem("notif",c);
    localStorage.setItem("lastCheck",now);
  }
}
simulateUpdates();

document.getElementById("notifCount").innerText=
localStorage.getItem("notif")||0;

/* COUNTER */
let count=0,target=53;
let int=setInterval(()=>{
  count++;
  document.getElementById("branchCount").innerText=count;
  if(count>=target) clearInterval(int);
},20);

/* DATE TIME */
setInterval(()=>{
  let now=new Date();
  document.getElementById("datetime").innerText=
  now.toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+
  " | "+now.toLocaleTimeString('en-IN')+" IST";
},1000);

/* ADMIN RESET TILE */
let user = localStorage.getItem("userid");
if(user==="N07550"){
  let grid=document.querySelector(".app-grid");
  let tile=document.createElement("div");
  tile.className="app-tile";
  tile.onclick=()=>go('reset_password.html');
  tile.innerHTML=`<i class="fa-solid fa-key"></i><span>Reset Password</span>`;
  grid.appendChild(tile);
}
</script>

</body>
</html>
