<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1c4fa3,#000428);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* BOX */
.box{
  width:90%;
  max-width:340px;
  background:rgba(255,255,255,0.1);
  padding:25px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  box-sizing:border-box;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  background:#00c6ff;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

button:disabled{
  background:#888;
}

/* MESSAGE */
#msg{
  margin-top:10px;
  font-weight:bold;
}

/* SPINNER */
.loader {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #00c6ff;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-right: 8px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="box">

  <h2>🔐 Change Password</h2>

  <input type="password" id="newpass" placeholder="Enter New Password">
  <input type="password" id="confirmpass" placeholder="Confirm Password">

  <button onclick="changePassword()">Update Password</button>

  <p id="msg"></p>

</div>

<script>

// 🔐 PAGE PROTECTION
if(localStorage.getItem("login") !== "true"){
  window.location.href = "index.html";
}

// 🔐 CHANGE PASSWORD FUNCTION
function changePassword(){

  let btn = document.querySelector("button");
  let msg = document.getElementById("msg");

  let newpass = document.getElementById("newpass").value.trim();
  let confirm = document.getElementById("confirmpass").value.trim();
  let user = localStorage.getItem("userid");

  msg.innerHTML = "";

  // VALIDATION
  if(newpass.length < 4){
    msg.innerHTML = "❌ Password must be at least 4 characters";
    return;
  }

  if(newpass !== confirm){
    msg.innerHTML = "❌ Passwords do not match!";
    return;
  }

  // LOADING
  btn.disabled = true;
  msg.innerHTML = '<span class="loader"></span> Updating password...';

  let url = "https://script.google.com/macros/s/AKfycbwQGrxhD6caEndOULRK0jMvzG5j9mQ7EA4Xb2n8BtniAFeWh0RGE8lCk0PZgV0uPzmkdQ/exec"
            + "?action=changePassword"
            + "&userid=" + encodeURIComponent(user)
            + "&newpass=" + encodeURIComponent(newpass)
            + "&key=MPGB123";

  fetch(url)
    .then(res => res.json())
    .then(data => {

      if(data.status === "updated"){

        msg.innerHTML = "✅ Password Updated Successfully!";
        msg.style.color = "lightgreen";

        // REDIRECT TO DASHBOARD
        setTimeout(()=>{
          window.location.href = "dashboard.html";
        },1200);

      } else {
        msg.innerHTML = "❌ Error updating password!";
        btn.disabled = false;
      }

    })
    .catch(()=>{
      msg.innerHTML = "⚠ Server Error!";
      btn.disabled = false;
    });
}
</script>

</body>
</html>
