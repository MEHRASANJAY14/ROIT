<!DOCTYPE html>
<html>
<head>
<title>SOL Dashboard</title>

<style>

body {
  font-family: Arial;
  padding:10px;
  background:#ffffff;
}

/* 🔥 BIG HEADING */
h2 {
  text-align:center;
  color:#003366;
  font-size:clamp(22px,3vw,36px);
  font-weight:bold;
  margin-bottom:20px;
}

/* 🔥 BIG DROPDOWN */
select {
  padding:10px;
  font-size:clamp(16px,2.5vw,22px);
  margin-bottom:20px;
}

/* 🔥 TABLE */
table {
  border-collapse:collapse;
  width:100%;
  margin:auto;
}

th, td {
  border:2px solid #000;
  padding:10px;
  font-size:clamp(14px,1.8vw,18px);
  text-align:center;
}

th {
  background:#d9d9d9;
}

/* 🔥 SPLIT VIEW BIG FONT */
.split th, .split td {
  font-size:clamp(16px,2.5vw,22px);
  padding:12px;
}

/* 🔥 MOBILE OPTIMIZATION */
@media(max-width:768px){
  table { display:block; overflow-x:auto; }
}

</style>

</head>

<body>

<h2>SOL BIMA AND PMJDY ACCOUNT OPENING</h2>

<label><b style="font-size:18px;">Select SOL:</b></label>
<select id="solFilter">
<option value="all">All</option>
</select>

<div id="content"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby99J4qAjuTZUBES2ynKHF9xsTgGghLsu8wU5pyvawXjr-phb_l7eYFd9ApHcxT2YTwUw/exec";

let fullData = [];
let headerData = {};

fetch(API_URL)
.then(res => res.json())
.then(res => {

  fullData = res.data;
  headerData = res.header;

  loadSOL(fullData);
  renderAll(fullData);

});

// 🔹 Load dropdown
function loadSOL(data){
  let set = new Set();
  data.forEach(d => set.add(d.sol));

  let dropdown = document.getElementById("solFilter");

  set.forEach(sol => {
    dropdown.innerHTML += `<option value="${sol}">${sol}</option>`;
  });
}

// 🔹 Change event
document.getElementById("solFilter").addEventListener("change", function(){

  let val = this.value;

  if(val === "all"){
    renderAll(fullData);
  } else {
    let filtered = fullData.filter(d => d.sol == val);
    renderSplit(filtered);
  }

});

// 🔹 ALL VIEW
function renderAll(data){

  let html = `<table>
  <tr>
    <th rowspan="2">SOL ID</th>
    <th rowspan="2">BRANCH</th>
    <th colspan="6">${headerData.account}</th>
    <th rowspan="2">PMJDY AC</th>
    <th colspan="4">${headerData.targetApr}</th>
    <th colspan="4">Target March-27</th>
  </tr>

  <tr>
    <th>SBY</th><th>SBY AMT</th>
    <th>JJBY</th><th>JJBY AMT</th>
    <th>APY</th><th>APY AMT</th>

    <th>JJBY</th><th>SBY</th><th>APY</th><th>PMJDY</th>
    <th>JJBY</th><th>SBY</th><th>APY</th><th>PMJDY</th>
  </tr>`;

  data.forEach(d => {
    html += `<tr>
      <td>${d.sol}</td>
      <td>${d.branch}</td>
      <td>${d.sby_count}</td>
      <td>${d.sby_amount}</td>
      <td>${d.jjby_count}</td>
      <td>${d.jjby_amount}</td>
      <td>${d.apy_count}</td>
      <td>${d.apy_amount}</td>
      <td>${d.pmjdy}</td>
      <td>${d.target_apr_jjby}</td>
      <td>${d.target_apr_sby}</td>
      <td>${d.target_apr_apy}</td>
      <td>${d.target_apr_pmjdy}</td>
      <td>${d.target_mar_jjby}</td>
      <td>${d.target_mar_sby}</td>
      <td>${d.target_mar_apy}</td>
      <td>${d.target_mar_pmjdy}</td>
    </tr>`;
  });

  html += `</table>`;
  document.getElementById("content").innerHTML = html;
}

// 🔥 SPLIT VIEW (BIG FONT)
function renderSplit(data){

  let html = "";

  data.forEach(d => {

    html += `

    <table class="split">
      <tr>
        <th rowspan="2">SOL ID</th>
        <th rowspan="2">BRANCH</th>
        <th colspan="6">${headerData.account}</th>
        <th rowspan="2">PMJDY</th>
      </tr>

      <tr>
        <th>SBY</th><th>SBY AMT</th>
        <th>JJBY</th><th>JJBY AMT</th>
        <th>APY</th><th>APY AMT</th>
      </tr>

      <tr>
        <td>${d.sol}</td>
        <td>${d.branch}</td>
        <td>${d.sby_count}</td>
        <td>${d.sby_amount}</td>
        <td>${d.jjby_count}</td>
        <td>${d.jjby_amount}</td>
        <td>${d.apy_count}</td>
        <td>${d.apy_amount}</td>
        <td>${d.pmjdy}</td>
      </tr>
    </table>

    <table class="split">
      <tr>
        <th colspan="4">${headerData.targetApr}</th>
        <th colspan="4">Target March-27</th>
      </tr>

      <tr>
        <th>JJBY</th><th>SBY</th><th>APY</th><th>PMJDY</th>
        <th>JJBY</th><th>SBY</th><th>APY</th><th>PMJDY</th>
      </tr>

      <tr>
        <td>${d.target_apr_jjby}</td>
        <td>${d.target_apr_sby}</td>
        <td>${d.target_apr_apy}</td>
        <td>${d.target_apr_pmjdy}</td>
        <td>${d.target_mar_jjby}</td>
        <td>${d.target_mar_sby}</td>
        <td>${d.target_mar_apy}</td>
        <td>${d.target_mar_pmjdy}</td>
      </tr>
    </table>

    `;
  });

  document.getElementById("content").innerHTML = html;
}

</script>

</body>
</html>
