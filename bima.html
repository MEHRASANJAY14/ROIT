<!DOCTYPE html>
<html>
<head>
<title>SOL Dashboard</title>

<style>

body {
  font-family: Arial;
  padding:10px;
  background:#ffffff;
}

/* 🔥 BIG HEADING */
h2 {
  text-align:center;
  color:#003366;
  font-size:clamp(22px,3vw,36px);
  font-weight:bold;
  margin-bottom:20px;
}

/* 🔥 BIG DROPDOWN */
select {
  padding:10px;
  font-size:clamp(16px,2.5vw,22px);
  margin-bottom:20px;
}

/* 🔥 TABLE */
.table-container{
  max-height:500px;
  overflow:auto;
  border:2px solid #000;
}

table {
  border-collapse:collapse;
  width:100%;
}

th, td {
  border:2px solid #000;
  padding:10px;
  font-size:clamp(14px,1.8vw,18px);
  text-align:center;
}

/* 🔥 FIX HEADER */
th {
  background:#d9d9d9;
  position:sticky;
  top:0;
  z-index:2;
}

/* 🔥 TOTAL ROW */
.total-row {
  background:#ffe599;
  font-weight:bold;
}

/* 🔥 SPLIT VIEW BIG FONT */
.split th, .split td {
  font-size:clamp(16px,2.5vw,22px);
  padding:12px;
}

/* 🔥 MOBILE */
@media(max-width:768px){
  table { display:block; overflow-x:auto; }
}

</style>

</head>

<body>

<h2>SOL BIMA AND PMJDY ACCOUNT OPENING</h2>

<label><b style="font-size:18px;">Select SOL:</b></label>
<select id="solFilter">
<option value="all">All</option>
</select>

<div id="content"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby99J4qAjuTZUBES2ynKHF9xsTgGghLsu8wU5pyvawXjr-phb_l7eYFd9ApHcxT2YTwUw/exec";

let fullData = [];
let headerData = {};

fetch(API_URL)
.then(res => res.json())
.then(res => {

  fullData = res.data;
  headerData = res.header;

  loadSOL(fullData);
  renderAll(fullData);

});

// 🔹 Load dropdown
function loadSOL(data){
  let set = new Set();
  data.forEach(d => set.add(d.sol));

  let dropdown = document.getElementById("solFilter");

  set.forEach(sol => {
    dropdown.innerHTML += `<option value="${sol}">${sol}</option>`;
  });
}

// 🔹 Change event
document.getElementById("solFilter").addEventListener("change", function(){

  let val = this.value;

  if(val === "all"){
    renderAll(fullData);
  } else {
    let filtered = fullData.filter(d => d.sol == val);
    renderSplit(filtered);
  }

});

// 🔥 ALL VIEW WITH TOTAL
function renderAll(data){

  let totals = {
    sby_count:0, sby_amount:0,
    jjby_count:0, jjby_amount:0,
    apy_count:0, apy_amount:0,
    pmjdy:0,
    target_apr_jjby:0, target_apr_sby:0, target_apr_apy:0, target_apr_pmjdy:0,
    target_mar_jjby:0, target_mar_sby:0, target_mar_apy:0, target_mar_pmjdy:0
  };

  let html = `<div class="table-container"><table>
  <tr>
    <th rowspan="2">SOL ID</th>
    <th rowspan="2">BRANCH</th>
    <th colspan="6">${headerData.account}</th>
    <th rowspan="2">PMJDY AC</th>
    <th colspan="4">${headerData.targetApr}</th>
    <th colspan="4">Target March-27</th>
  </tr>

  <tr>
    <th>SBY</th><th>SBY AMT</th>
    <th>JJBY</th><th>JJBY AMT</th>
    <th>APY</th><th>APY AMT</th>

    <th>JJBY</th><th>SBY</th><th>APY</th><th>PMJDY</th>
    <th>JJBY</th><th>SBY</th><th>APY</th><th>PMJDY</th>
  </tr>`;

  data.forEach(d => {

    // 🔹 TOTAL CALCULATION
    for(let key in totals){
      totals[key] += Number(d[key] || 0);
    }

    html += `<tr>
      <td>${d.sol}</td>
      <td>${d.branch}</td>
      <td>${d.sby_count}</td>
      <td>${d.sby_amount}</td>
      <td>${d.jjby_count}</td>
      <td>${d.jjby_amount}</td>
      <td>${d.apy_count}</td>
      <td>${d.apy_amount}</td>
      <td>${d.pmjdy}</td>
      <td>${d.target_apr_jjby}</td>
      <td>${d.target_apr_sby}</td>
      <td>${d.target_apr_apy}</td>
      <td>${d.target_apr_pmjdy}</td>
      <td>${d.target_mar_jjby}</td>
      <td>${d.target_mar_sby}</td>
      <td>${d.target_mar_apy}</td>
      <td>${d.target_mar_pmjdy}</td>
    </tr>`;
  });

  // 🔥 TOTAL ROW
  html += `<tr class="total-row">
    <td colspan="2">TOTAL</td>
    <td>${totals.sby_count}</td>
    <td>${totals.sby_amount}</td>
    <td>${totals.jjby_count}</td>
    <td>${totals.jjby_amount}</td>
    <td>${totals.apy_count}</td>
    <td>${totals.apy_amount}</td>
    <td>${totals.pmjdy}</td>
    <td>${totals.target_apr_jjby}</td>
    <td>${totals.target_apr_sby}</td>
    <td>${totals.target_apr_apy}</td>
    <td>${totals.target_apr_pmjdy}</td>
    <td>${totals.target_mar_jjby}</td>
    <td>${totals.target_mar_sby}</td>
    <td>${totals.target_mar_apy}</td>
    <td>${totals.target_mar_pmjdy}</td>
  </tr>`;

  html += `</table></div>`;

  document.getElementById("content").innerHTML = html;
}

// 🔹 SPLIT SAME AS BEFORE
function renderSplit(data){
  let html = "";
  data.forEach(d => {
    html += `<table class="split">
      <tr><th>SOL</th><th>${d.sol}</th></tr>
      <tr><th>Branch</th><th>${d.branch}</th></tr>
      <tr><th>SBY</th><th>${d.sby_count}</th></tr>
    </table><br>`;
  });
  document.getElementById("content").innerHTML = html;
}

</script>

</body>
</html>
