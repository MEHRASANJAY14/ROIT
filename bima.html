<!DOCTYPE html>
<html>
<head>
<title>SOL Dashboard</title>

<style>
body { font-family: Arial; padding:20px; background:#f4f7fb; }

h2 { text-align:center; color:#003366; }

select { padding:6px; margin:10px 0; }

table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th, td {
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
}

th { background:#003366; color:white; }

</style>
</head>

<body>

<h2>SOL BIMA AND PMJDY ACCOUNT OPENING</h2>

<div>
<label><b>Select SOL:</b></label>
<select id="solFilter">
<option value="all">All</option>
</select>
</div>

<table id="table">
<thead id="thead"></thead>
<tbody></tbody>
</table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby99J4qAjuTZUBES2ynKHF9xsTgGghLsu8wU5pyvawXjr-phb_l7eYFd9ApHcxT2YTwUw/exec";

let fullData = [];

fetch(API_URL)
.then(res => res.json())
.then(res => {

  fullData = res.data;

  loadSOL(fullData);
  renderAllHeader(res.header);
  renderTable(fullData);

});

// 🔹 Load dropdown
function loadSOL(data){
  let set = new Set();
  data.forEach(d => set.add(d.sol));

  let dropdown = document.getElementById("solFilter");

  set.forEach(sol => {
    dropdown.innerHTML += `<option value="${sol}">${sol}</option>`;
  });
}

// 🔹 FULL HEADER (ALL MODE)
function renderAllHeader(header){

  document.getElementById("thead").innerHTML = `
  <tr>
    <th rowspan="2">SOL</th>
    <th rowspan="2">Branch</th>
    <th colspan="6">${header.account}</th>
    <th rowspan="2">PMJDY</th>
    <th colspan="4">${header.targetApr}</th>
    <th colspan="4">Target March-27</th>
  </tr>

  <tr>
    <th>SBY</th><th>SBY Amt</th>
    <th>JJBY</th><th>JJBY Amt</th>
    <th>APY</th><th>APY Amt</th>

    <th>JJBY</th><th>SBY</th><th>APY</th><th>PMJDY</th>

    <th>JJBY</th><th>SBY</th><th>APY</th><th>PMJDY</th>
  </tr>`;
}

// 🔥 SINGLE HEADER (SPLIT MODE)
function renderSingleHeader(){

  document.getElementById("thead").innerHTML = `
  <tr>
    <th>SOL</th>
    <th>Branch</th>
    <th>SBY</th>
    <th>JJBY</th>
    <th>APY</th>
    <th>PMJDY</th>
  </tr>

  <tr>
    <th colspan="6">TARGET DETAILS BELOW</th>
  </tr>`;
}

// 🔹 Filter change
document.getElementById("solFilter").addEventListener("change", function(){

  let val = this.value;

  if(val === "all"){
    renderAllHeader({account:"",targetApr:""});
    renderTable(fullData);
  } else {
    let filtered = fullData.filter(d => d.sol == val);
    renderSingleHeader();
    renderTable(filtered);
  }

});

// 🔹 Table render
function renderTable(data){

  let tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  let selectedSOL = document.getElementById("solFilter").value;

  data.forEach(d => {

    if(selectedSOL === "all"){

      tbody.innerHTML += `<tr>
        <td>${d.sol}</td>
        <td>${d.branch}</td>
        <td>${d.sby_count}</td>
        <td>${d.sby_amount}</td>
        <td>${d.jjby_count}</td>
        <td>${d.jjby_amount}</td>
        <td>${d.apy_count}</td>
        <td>${d.apy_amount}</td>
        <td>${d.pmjdy}</td>
        <td>${d.target_apr_jjby}</td>
        <td>${d.target_apr_sby}</td>
        <td>${d.target_apr_apy}</td>
        <td>${d.target_apr_pmjdy}</td>
        <td>${d.target_mar_jjby}</td>
        <td>${d.target_mar_sby}</td>
        <td>${d.target_mar_apy}</td>
        <td>${d.target_mar_pmjdy}</td>
      </tr>`;

    } else {

      tbody.innerHTML += `
      <tr style="background:#eef6ff;">
        <td>${d.sol}</td>
        <td>${d.branch}</td>
        <td>${d.sby_count}</td>
        <td>${d.jjby_count}</td>
        <td>${d.apy_count}</td>
        <td>${d.pmjdy}</td>
      </tr>

      <tr style="background:#f9fbff;">
        <td colspan="6">
          APR → JJBY:${d.target_apr_jjby}, SBY:${d.target_apr_sby}, APY:${d.target_apr_apy}, PMJDY:${d.target_apr_pmjdy}
          <br>
          MAR → JJBY:${d.target_mar_jjby}, SBY:${d.target_mar_sby}, APY:${d.target_mar_apy}, PMJDY:${d.target_mar_pmjdy}
        </td>
      </tr>`;
    }

  });

}

</script>

</body>
</html>
