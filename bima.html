<!DOCTYPE html>
<html>
<head>
<title>SOL Dashboard</title>

<style>
body {
  font-family: Arial;
  padding:20px;
  background:#ffffff;
}

h2 {
  text-align:center;
  color:#003366;
  margin-bottom:20px;
}

select {
  padding:6px;
  margin-bottom:15px;
}

/* 🔥 Excel Style Table */
table {
  border-collapse:collapse;
  margin:auto;
}

th, td {
  border:2px solid #000;
  padding:8px;
  text-align:center;
  font-size:13px;
}

th {
  background:#d9d9d9;
  font-weight:bold;
}

.container {
  display:flex;
  flex-direction:column;
  align-items:center;
}

</style>
</head>

<body>

<h2>SOL BIMA AND PMJDY ACCOUNT OPENING</h2>

<div style="text-align:center;">
  <label><b>Select SOL:</b></label>
  <select id="solFilter">
    <option value="all">Select SOL</option>
  </select>
</div>

<div id="content" class="container"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby99J4qAjuTZUBES2ynKHF9xsTgGghLsu8wU5pyvawXjr-phb_l7eYFd9ApHcxT2YTwUw/exec";

let fullData = [];

fetch(API_URL)
.then(res => res.json())
.then(res => {

  fullData = res.data;
  loadSOL(fullData);

});

// 🔹 Dropdown
function loadSOL(data){
  let set = new Set();
  data.forEach(d => set.add(d.sol));

  let dropdown = document.getElementById("solFilter");

  set.forEach(sol => {
    dropdown.innerHTML += `<option value="${sol}">${sol}</option>`;
  });
}

// 🔹 Change Event
document.getElementById("solFilter").addEventListener("change", function(){

  let val = this.value;

  if(val === "all") return;

  fetch(API_URL)
  .then(res => res.json())
  .then(res => {

    let d = fullData.find(x => x.sol == val);
    renderExcelView(d, res.header);

  });

});

// 🔥 EXACT EXCEL VIEW
function renderExcelView(d, header){

  let html = `

  <!-- TOP TABLE -->
  <table>
    <tr>
      <th rowspan="2">SOL ID</th>
      <th rowspan="2">BRANCH</th>
      <th colspan="6">${header.account}</th>
      <th rowspan="2">PMJDY AC</th>
    </tr>

    <tr>
      <th>SBY BIMA COUNT</th>
      <th>SBY BIMA AMOUNT</th>
      <th>JJBY BIMA COUNT</th>
      <th>JJBY BIMA AMOUNT</th>
      <th>APY BIMA COUNT</th>
      <th>APY BIMA AMOUNT</th>
    </tr>

    <tr>
      <td>${d.sol}</td>
      <td>${d.branch}</td>
      <td>${d.sby_count}</td>
      <td>${d.sby_amount}</td>
      <td>${d.jjby_count}</td>
      <td>${d.jjby_amount}</td>
      <td>${d.apy_count}</td>
      <td>${d.apy_amount}</td>
      <td>${d.pmjdy}</td>
    </tr>
  </table>

  <br>

  <!-- TARGET TABLE -->
  <table>
    <tr>
      <th colspan="4">${header.targetApr}</th>
      <th colspan="4">Target March-27</th>
    </tr>

    <tr>
      <th>JJBY</th>
      <th>SBY</th>
      <th>APY</th>
      <th>PMJDY</th>

      <th>JJBY</th>
      <th>SBY</th>
      <th>APY</th>
      <th>PMJDY</th>
    </tr>

    <tr>
      <td>${d.target_apr_jjby}</td>
      <td>${d.target_apr_sby}</td>
      <td>${d.target_apr_apy}</td>
      <td>${d.target_apr_pmjdy}</td>

      <td>${d.target_mar_jjby}</td>
      <td>${d.target_mar_sby}</td>
      <td>${d.target_mar_apy}</td>
      <td>${d.target_mar_pmjdy}</td>
    </tr>
  </table>
  `;

  document.getElementById("content").innerHTML = html;

}

</script>

</body>
</html>
