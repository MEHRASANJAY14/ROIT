<!DOCTYPE html>
<html>
<head>
<title>SOL Dashboard</title>

<style>
body { font-family: Arial; padding:20px; background:#f4f7fb; }

h2 {
  text-align:center;
  color:#003366;
}

select {
  padding:6px;
  font-size:14px;
  margin:10px 0;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th, td {
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
}

th {
  background:#003366;
  color:white;
}

/* Mobile improve */
@media(max-width:768px){
  table { font-size:11px; }
}

</style>
</head>

<body>

<h2>SOL BIMA AND PMJDY ACCOUNT OPENING</h2>

<!-- 🔥 SOL FILTER -->
<div>
  <label><b>Select SOL:</b></label>
  <select id="solFilter">
    <option value="all">All</option>
  </select>
</div>

<table id="table">

<thead>

<tr>
<th rowspan="2">SOL ID</th>
<th rowspan="2">BRANCH</th>

<th colspan="6" id="accountHeader">Loading...</th>

<th rowspan="2">PMJDY AC</th>

<th colspan="4" id="targetAprHeader">Loading...</th>

<th colspan="4">Target March-27</th>
</tr>

<tr>
<th>SBY COUNT</th>
<th>SBY AMOUNT</th>
<th>JJBY COUNT</th>
<th>JJBY AMOUNT</th>
<th>APY COUNT</th>
<th>APY AMOUNT</th>

<th>JJBY</th>
<th>SBY</th>
<th>APY</th>
<th>PMJDY</th>

<th>JJBY</th>
<th>SBY</th>
<th>APY</th>
<th>PMJDY</th>
</tr>

</thead>

<tbody></tbody>

</table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby99J4qAjuTZUBES2ynKHF9xsTgGghLsu8wU5pyvawXjr-phb_l7eYFd9ApHcxT2YTwUw/exec";

let fullData = [];

// 🔥 Fetch Data
fetch(API_URL)
.then(res => res.json())
.then(res => {

  document.getElementById("accountHeader").innerText = res.header.account;
  document.getElementById("targetAprHeader").innerText = res.header.targetApr;

  fullData = res.data;

  loadSOL(fullData);
  renderTable(fullData);

});

// 🔥 Load SOL Dropdown
function loadSOL(data){
  let set = new Set();

  data.forEach(d => set.add(d.sol));

  let dropdown = document.getElementById("solFilter");

  set.forEach(sol => {
    dropdown.innerHTML += `<option value="${sol}">${sol}</option>`;
  });
}

// 🔥 Filter Event
document.getElementById("solFilter").addEventListener("change", function(){

  let val = this.value;

  if(val === "all"){
    renderTable(fullData);
  } else {
    let filtered = fullData.filter(d => d.sol == val);
    renderTable(filtered);
  }

});

// 🔥 Render Table (UPDATED)
function renderTable(data){

  let tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  let selectedSOL = document.getElementById("solFilter").value;

  data.forEach(d => {

    // ✅ ALL MODE
    if(selectedSOL === "all"){

      let row = `<tr>
        <td>${d.sol}</td>
        <td>${d.branch}</td>

        <td>${d.sby_count}</td>
        <td>${d.sby_amount}</td>

        <td>${d.jjby_count}</td>
        <td>${d.jjby_amount}</td>

        <td>${d.apy_count}</td>
        <td>${d.apy_amount}</td>

        <td>${d.pmjdy}</td>

        <td>${d.target_apr_jjby}</td>
        <td>${d.target_apr_sby}</td>
        <td>${d.target_apr_apy}</td>
        <td>${d.target_apr_pmjdy}</td>

        <td>${d.target_mar_jjby}</td>
        <td>${d.target_mar_sby}</td>
        <td>${d.target_mar_apy}</td>
        <td>${d.target_mar_pmjdy}</td>
      </tr>`;

      tbody.innerHTML += row;

    }

    // 🔥 SINGLE SOL → MOBILE FRIENDLY
    else{

      let row1 = `<tr style="background:#eef6ff; font-weight:bold;">
        <td>${d.sol}</td>
        <td>${d.branch}</td>
        <td colspan="6">SBY: ${d.sby_count} (${d.sby_amount}) | JJBY: ${d.jjby_count} (${d.jjby_amount})</td>
        <td>${d.pmjdy}</td>
        <td colspan="8">APR → JJBY: ${d.target_apr_jjby}, SBY: ${d.target_apr_sby}, APY: ${d.target_apr_apy}, PMJDY: ${d.target_apr_pmjdy}</td>
      </tr>`;

      let row2 = `<tr style="background:#f9fbff;">
        <td colspan="2"></td>
        <td colspan="6">APY: ${d.apy_count} (${d.apy_amount})</td>
        <td></td>
        <td colspan="8">MAR → JJBY: ${d.target_mar_jjby}, SBY: ${d.target_mar_sby}, APY: ${d.target_mar_apy}, PMJDY: ${d.target_mar_pmjdy}</td>
      </tr>`;

      tbody.innerHTML += row1 + row2;

    }

  });

}

</script>

</body>
</html>
