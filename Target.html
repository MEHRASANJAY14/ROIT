<script>

const branchAPI = "https://script.google.com/macros/s/AKfycbwWjluBGmMpCxHEZ0nKinVxhtSioBUAgQ5Vg5GrBstVFY3XvFVLS3IvyAu47uNMLTmn/exec";

fetch(branchAPI, {
  method: "GET",
  mode: "cors"
})
.then(response => response.json())
.then(data => {

  console.log("DATA:", data);

  const select = document.getElementById("branchSelect");

  select.innerHTML = '<option value="">-- Select Branch --</option>';

  data.forEach(item => {
    let opt = document.createElement("option");
    opt.value = item.sol;
    opt.text = item.branch + " (" + item.sol + ")";
    select.appendChild(opt);
  });

})
.catch(error => {
  console.error("ERROR:", error);
  alert("API not accessible ❌");
});

</script>
