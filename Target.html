<!DOCTYPE html>
<html>
<head>
  <title>Branch Dropdown Test</title>
</head>

<body>

<h2>Select Branch</h2>

<select id="branchSelect">
  <option value="">-- Select Branch --</option>
</select>

<script>

const branchAPI = "https://script.google.com/macros/s/AKfycbwWjluBGmMpCxHEZ0nKinVxhtSioBUAgQ5Vg5GrBstVFY3XvFVLS3IvyAu47uNMLTmn/exec";

fetch(branchAPI)
.then(res => res.json())
.then(data => {

  const select = document.getElementById("branchSelect");

  data.forEach(item => {
    let opt = document.createElement("option");

    opt.value = item.sol;

    // 🔥 Proper format
    opt.text = item.branch + " (" + item.sol + ")";

    select.appendChild(opt);
  });

})
.catch(err => {
  console.error("Error:", err);
});

</script>

</body>
</html>
