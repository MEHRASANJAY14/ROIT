<!DOCTYPE html>
<html>
<head>
  <title>Regional Office Jabalpur - Branch PDF Dashboard</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg,#eaf1ff,#f7fbff);
      margin:0;
      padding:0;
      text-align:center;
    }

    /* 🔷 HEADER */
    .header{
      background: linear-gradient(135deg,#1c4fa3,#2e6dd8);
      color:white;
      padding:15px 10px;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
      position:relative;
    }

    .header h1{
      margin:0;
      font-size:16px;
    }

    .header h2{
      margin:3px 0;
      font-size:12px;
      opacity:0.9;
    }

    /* ⬅ BACK BUTTON */
    .back-btn{
      position:absolute;
      left:10px;
      top:12px;
      background:rgba(255,255,255,0.9);
      color:#1c4fa3;
      padding:6px 12px;
      border-radius:20px;
      font-size:12px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:5px;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
      transition:0.3s;
    }

    .back-btn:hover{
      transform:translateY(-2px);
    }

    /* 🔷 CARD */
    .container{
      background:white;
      margin:20px auto;
      width:95%;
      max-width:900px;
      border-radius:16px;
      padding:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    h2 {
      color: #2c3e50;
    }

    select {
      padding:12px;
      font-size:14px;
      width:280px;
      border-radius:10px;
      border:1px solid #ddd;
      margin-top:10px;
    }

    .btn {
      padding:10px 18px;
      margin-top:15px;
      font-size:13px;
      border:none;
      border-radius:20px;
      cursor:pointer;
      color: white;
      background: linear-gradient(135deg,#00c853,#2ecc71);
      display: none;
    }

    iframe {
      width: 100%;
      height: 600px;
      margin-top: 20px;
      border-radius: 14px;
      border: 1px solid #ddd;
    }

    .loader {
      display: none;
      margin-top: 15px;
      font-weight: bold;
      color: #555;
    }

  </style>
</head>

<body>

<!-- 🔷 HEADER -->
<div class="header">

  <!-- ⬅ BACK BUTTON -->
  <div class="back-btn" onclick="goBack()">
    <i class="fa-solid fa-arrow-left"></i> Dashboard
  </div>

  <h1>Regional Office Jabalpur</h1>
  <h2>Branch PDF Dashboard</h2>

</div>

<!-- 🔷 MAIN -->
<div class="container">

<h2>📊 View Branch Reports</h2>

<select id="branchSelect">
  <option value="">-- Loading Branches... --</option>
</select>

<br>

<button class="btn" id="downloadBtn">
  <i class="fa-solid fa-download"></i> Download PDF
</button>

<div class="loader" id="loader">Loading PDF...</div>

<iframe id="pdfFrame"></iframe>

</div>

<script>

function goBack(){
  window.location.replace("dashboard.html");
}

const apiURL = "https://script.google.com/macros/s/AKfycbwWjluBGmMpCxHEZ0nKinVxhtSioBUAgQ5Vg5GrBstVFY3XvFVLS3IvyAu47uNMLTmn/exec";

let allData = [];
let currentPDF = "";

// 🔹 Load Data
fetch(apiURL + "?t=" + new Date().getTime())
.then(res => res.json())
.then(data => {

  allData = data;

  const select = document.getElementById("branchSelect");

  select.innerHTML = '<option value="">-- Select Branch --</option>';

  data.forEach(item => {
    let opt = document.createElement("option");
    opt.value = item.sol;
    opt.text = item.branch + " (" + item.sol + ")";
    select.appendChild(opt);
  });

})
.catch(err => {
  document.getElementById("branchSelect").innerHTML =
    '<option>Error loading data ❌</option>';
});

// 🔹 Show PDF
document.getElementById("branchSelect").addEventListener("change", function(){

  const sol = this.value;
  const loader = document.getElementById("loader");
  const downloadBtn = document.getElementById("downloadBtn");

  if(!sol) return;

  const match = allData.find(d => d.sol == sol);

  if(match && match.pdf){

    loader.style.display = "block";

    document.getElementById("pdfFrame").src = match.pdf;

    currentPDF = match.pdf;

    downloadBtn.style.display = "inline-block";

    setTimeout(() => {
      loader.style.display = "none";
    }, 1000);

  } else {
    alert("PDF not found ❌");
    downloadBtn.style.display = "none";
  }

});

// 🔹 Download
document.getElementById("downloadBtn").addEventListener("click", function(){

  if(!currentPDF){
    alert("No PDF selected ❌");
    return;
  }

  const downloadLink = currentPDF.replace("/preview", "/export?format=pdf");

  window.open(downloadLink, "_blank");

});

</script>

</body>
</html>
