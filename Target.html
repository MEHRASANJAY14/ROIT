<!DOCTYPE html>
<html>
<head>
  <script>
(function(){

  let login = localStorage.getItem("login");
  let branch = localStorage.getItem("branch");
  let time = localStorage.getItem("time");

  let now = new Date().getTime();

  // Not logged in
  if(login !== "true" || !branch){
    window.location.replace("index.html");
  }

  // Session expiry (30 min)
  if(time && (now - time > 30*60*1000)){
    localStorage.clear();
    window.location.replace("index.html");
  }

})();
</script>
  <title>Branch PDF Dashboard</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f9;
      padding: 20px;
    }

    h2 {
      color: #2c3e50;
    }

    select {
      padding: 12px;
      font-size: 16px;
      width: 300px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    iframe {
      width: 100%;
      height: 600px;
      margin-top: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .loader {
      display: none;
      margin-top: 20px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>

<body>

<h2>📊 Branch PDF Dashboard</h2>

<select id="branchSelect">
  <option value="">-- Loading Branches... --</option>
</select>

<div class="loader" id="loader">Loading PDF...</div>

<iframe id="pdfFrame"></iframe>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycbwWjluBGmMpCxHEZ0nKinVxhtSioBUAgQ5Vg5GrBstVFY3XvFVLS3IvyAu47uNMLTmn/exec";

let allData = [];

// 🔹 Load Branch + PDF data
fetch(apiURL + "?t=" + new Date().getTime())
.then(res => res.json())
.then(data => {

  console.log("API DATA:", data);

  allData = data;

  const select = document.getElementById("branchSelect");

  select.innerHTML = '<option value="">-- Select Branch --</option>';

  data.forEach(item => {
    let opt = document.createElement("option");
    opt.value = item.sol;
    opt.text = item.branch + " (" + item.sol + ")";
    select.appendChild(opt);
  });

})
.catch(err => {
  console.error("ERROR:", err);
  document.getElementById("branchSelect").innerHTML =
    '<option>Error loading data ❌</option>';
});


// 🔹 On Select → Show PDF
document.getElementById("branchSelect").addEventListener("change", function(){

  const sol = this.value;
  const loader = document.getElementById("loader");

  if(!sol) return;

  const match = allData.find(d => d.sol == sol);

  if(match && match.pdf){

    loader.style.display = "block";

    document.getElementById("pdfFrame").src = match.pdf;

    setTimeout(() => {
      loader.style.display = "none";
    }, 1000);

  } else {
    alert("PDF not found ❌");
  }

});

</script>

</body>
</html>
