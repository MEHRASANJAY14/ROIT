<!DOCTYPE html>
<html>
<head>
  <title>Branch PDF Dashboard</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f9;
      padding: 20px;
    }

    h2 {
      color: #2c3e50;
    }

    select {
      padding: 12px;
      font-size: 16px;
      width: 300px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    iframe {
      width: 100%;
      height: 600px;
      margin-top: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<h2>📊 Select Branch</h2>

<select id="branchSelect">
  <option value="">-- Select Branch --</option>
</select>

<iframe id="pdfFrame"></iframe>

<script>

const branchAPI = "https://script.google.com/macros/s/AKfycbwWjluBGmMpCxHEZ0nKinVxhtSioBUAgQ5Vg5GrBstVFY3XvFVLS3IvyAu47uNMLTmn/exec";
const pdfAPI = "PASTE_YOUR_PDF_API_HERE";

let pdfData = [];

// Load APIs
Promise.all([
  fetch(branchAPI).then(res => res.json()),
  fetch(pdfAPI).then(res => res.json())
])
.then(([branches, pdfs]) => {

  pdfData = pdfs;

  const select = document.getElementById("branchSelect");

  branches.forEach(item => {
    let opt = document.createElement("option");

    opt.value = item.sol;

    // 🔥 Branch Name FIRST (better UX)
    opt.text = item.branch + " (" + item.sol + ")";

    select.appendChild(opt);
  });

});

// On select → show PDF
document.getElementById("branchSelect").addEventListener("change", function(){

  const sol = this.value;

  if(!sol) return;

  const match = pdfData.find(p => p.sol == sol);

  if(match){
    document.getElementById("pdfFrame").src = match.url;
  } else {
    alert("PDF not found for this branch ❌");
  }

});

</script>

</body>
</html>
