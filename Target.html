<!DOCTYPE html>
<html>
<head>
  <title>Regional Office Jabalpur - Branch PDF Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg,#eaf1ff,#f7fbff);
      margin:0;
      padding:0;
      text-align:center;
      font-size:16px;
    }

    /* HEADER */
    .header{
      background: linear-gradient(135deg,#1c4fa3,#2e6dd8);
      color:white;
      padding:20px 10px;
      position:relative;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }

    .header h1{
      margin:0;
      font-size:20px;
    }

    .header h2{
      margin:5px 0;
      font-size:14px;
      opacity:0.9;
    }

    /* BACK BUTTON */
    .back-btn{
      position:absolute;
      left:12px;
      top:14px;
      background:white;
      color:#1c4fa3;
      padding:8px 14px;
      border-radius:20px;
      font-size:13px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:5px;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    /* CARD */
    .container{
      background:white;
      margin:25px auto;
      width:95%;
      max-width:950px;
      border-radius:16px;
      padding:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    h2 {
      font-size:18px;
      color:#2c3e50;
      margin-bottom:15px;
    }

    /* SELECT */
    select {
      padding:14px;
      font-size:16px;
      width:90%;
      max-width:320px;
      border-radius:10px;
      border:1px solid #ccc;
    }

    /* BUTTON */
    .btn {
      padding:12px 22px;
      margin-top:15px;
      font-size:15px;
      border:none;
      border-radius:20px;
      cursor:pointer;
      color:white;
      background:linear-gradient(135deg,#00c853,#2ecc71);
      display:none;
    }

    /* LOADER */
    .loader {
      display:none;
      margin-top:15px;
      font-size:15px;
      font-weight:bold;
      color:#555;
    }

    /* PDF */
    iframe {
      width:100%;
      height:75vh;
      margin-top:25px;
      border-radius:14px;
      border:1px solid #ddd;
    }

  </style>
</head>

<body>

<div class="header">

  <div class="back-btn" onclick="goBack()">
    <i class="fa-solid fa-arrow-left"></i> Dashboard
  </div>

  <h1>Regional Office Jabalpur</h1>
  <h2>Branch PDF Dashboard</h2>

</div>

<div class="container">

<h2>📊 View Branch Reports</h2>

<select id="branchSelect">
  <option value="">-- Loading Branches... --</option>
</select>

<br>

<button class="btn" id="downloadBtn">
  <i class="fa-solid fa-download"></i> Download PDF
</button>

<div class="loader" id="loader">Loading PDF...</div>

<iframe id="pdfFrame"></iframe>

</div>

<script>

function goBack(){
  window.location.replace("dashboard.html");
}

const apiURL = "https://script.google.com/macros/s/AKfycbwWjluBGmMpCxHEZ0nKinVxhtSioBUAgQ5Vg5GrBstVFY3XvFVLS3IvyAu47uNMLTmn/exec";

let allData = [];
let currentPDF = "";

// LOAD
fetch(apiURL + "?t=" + new Date().getTime())
.then(res => res.json())
.then(data => {

  allData = data;

  const select = document.getElementById("branchSelect");

  select.innerHTML = '<option value="">-- Select Branch --</option>';

  data.forEach(item => {
    let opt = document.createElement("option");
    opt.value = item.sol;
    opt.text = item.branch + " (" + item.sol + ")";
    select.appendChild(opt);
  });

})
.catch(()=>{
  document.getElementById("branchSelect").innerHTML =
    '<option>Error loading data ❌</option>';
});

// SELECT
document.getElementById("branchSelect").addEventListener("change", function(){

  const sol = this.value;
  const loader = document.getElementById("loader");
  const btn = document.getElementById("downloadBtn");

  if(!sol) return;

  const match = allData.find(d => d.sol == sol);

  if(match && match.pdf){

    loader.style.display = "block";
    document.getElementById("pdfFrame").src = match.pdf;
    currentPDF = match.pdf;

    btn.style.display = "inline-block";

    setTimeout(()=> loader.style.display="none",1000);

  } else {
    alert("PDF not found ❌");
    btn.style.display = "none";
  }

});

// DOWNLOAD
document.getElementById("downloadBtn").addEventListener("click", function(){

  if(!currentPDF){
    alert("No PDF selected ❌");
    return;
  }

  const link = currentPDF.replace("/preview", "/export?format=pdf");
  window.open(link, "_blank");

});

</script>

</body>
</html>
