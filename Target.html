<!DOCTYPE html>
<html>
<head>
  <title>Branch PDF Dashboard</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f9;
      padding: 20px;
    }

    h2 {
      color: #2c3e50;
    }

    select {
      padding: 12px;
      font-size: 16px;
      width: 320px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    iframe {
      width: 100%;
      height: 600px;
      margin-top: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .btn {
      padding: 10px 20px;
      margin-top: 15px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      background: #27ae60;
      display: none;
    }

    .btn:hover {
      background: #219150;
    }

    .loader {
      display: none;
      margin-top: 20px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>

<body>

<h2>📊 Branch PDF Dashboard</h2>

<select id="branchSelect">
  <option value="">-- Loading Branches... --</option>
</select>

<br>

<button class="btn" id="downloadBtn">⬇ Download PDF</button>

<div class="loader" id="loader">Loading PDF...</div>

<iframe id="pdfFrame"></iframe>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycbwWjluBGmMpCxHEZ0nKinVxhtSioBUAgQ5Vg5GrBstVFY3XvFVLS3IvyAu47uNMLTmn/exec";

let allData = [];
let currentPDF = "";

// 🔹 Load Data
fetch(apiURL + "?t=" + new Date().getTime())
.then(res => res.json())
.then(data => {

  allData = data;

  const select = document.getElementById("branchSelect");

  select.innerHTML = '<option value="">-- Select Branch --</option>';

  data.forEach(item => {
    let opt = document.createElement("option");
    opt.value = item.sol;
    opt.text = item.branch + " (" + item.sol + ")";
    select.appendChild(opt);
  });

})
.catch(err => {
  console.error("ERROR:", err);
  document.getElementById("branchSelect").innerHTML =
    '<option>Error loading data ❌</option>';
});


// 🔹 On Select → Show PDF
document.getElementById("branchSelect").addEventListener("change", function(){

  const sol = this.value;
  const loader = document.getElementById("loader");
  const downloadBtn = document.getElementById("downloadBtn");

  if(!sol) return;

  const match = allData.find(d => d.sol == sol);

  if(match && match.pdf){

    loader.style.display = "block";

    document.getElementById("pdfFrame").src = match.pdf;

    currentPDF = match.pdf;

    downloadBtn.style.display = "inline-block";

    setTimeout(() => {
      loader.style.display = "none";
    }, 1000);

  } else {
    alert("PDF not found ❌");
    downloadBtn.style.display = "none";
  }

});


// 🔹 Download PDF
document.getElementById("downloadBtn").addEventListener("click", function(){

  if(!currentPDF){
    alert("No PDF selected ❌");
    return;
  }

  // convert preview → download
  const downloadLink = currentPDF.replace("/preview", "/export?format=pdf");

  window.open(downloadLink, "_blank");

});

</script>

</body>
</html>
